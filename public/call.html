<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Видеозвонок | Therapy Call</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #c9a96e;
            --gold-dim: rgba(201,169,110,0.18);
            --gold-mid: rgba(201,169,110,0.45);
            --surface: rgba(12,14,13,0.88);
            --surface-light: rgba(22,26,24,0.92);
            --text: #e8e4dc;
            --text-dim: rgba(232,228,220,0.45);
            --radius: 20px;
            --radius-sm: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #080b09;
            min-height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            color: var(--text);
        }

        .call-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .remote-video-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #060908;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #060908;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 20%, transparent 70%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 3;
        }

        .local-video-wrapper {
            position: absolute;
            bottom: 110px;
            right: 24px;
            width: 110px;
            height: 150px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--gold-mid);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 8px 32px rgba(0,0,0,0.7);
            z-index: 10;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s;
            background: #000;
        }
        .local-video-wrapper:hover {
            transform: scale(1.04);
            border-color: var(--gold);
        }
        .local-video-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            pointer-events: none;
        }
        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 15;
            pointer-events: none;
        }

        .session-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .session-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.8;
        }
        #connectionStatus {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 0.04em;
            transition: color 0.4s, opacity 0.4s;
        }

        .top-buttons {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }
        .top-btn {
            background: var(--surface);
            border: 1px solid var(--gold-mid);
            border-radius: 30px;
            padding: 7px 16px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 400;
            color: var(--gold);
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            backdrop-filter: blur(16px);
        }
        .top-btn:hover {
            background: var(--gold-dim);
            border-color: var(--gold);
        }
        .top-btn.recording-active {
            background: rgba(180,30,30,0.5);
            border-color: rgba(220,60,60,0.6);
            color: #ff8080;
        }
        .rec-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff5555;
            animation: blink 1s ease infinite;
            margin-right: 2px;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

        .waiting-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .waiting-ring {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1.5px solid rgba(201,169,110,0.2);
            border-top-color: var(--gold);
            animation: spin 1.2s cubic-bezier(0.4,0,0.6,1) infinite;
        }
        .waiting-message p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: var(--text);
            opacity: 0.7;
        }
        .waiting-message span {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.6;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            z-index: 20;
            padding: 0 20px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, transparent 100%);
        }

        .control-btn {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1px solid rgba(201,169,110,0.22);
            background: var(--surface);
            backdrop-filter: blur(20px);
            cursor: pointer;
            font-size: 16px;
            color: var(--text);
            transition: all 0.22s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .control-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
            pointer-events: none;
        }
        .control-btn:hover {
            background: var(--gold-dim);
            border-color: var(--gold-mid);
            color: var(--gold);
            transform: translateY(-2px);
        }
        .control-btn:active { transform: translateY(0) scale(0.96); }

        .control-btn.muted {
            background: rgba(180,60,60,0.22);
            border-color: rgba(220,100,100,0.35);
            color: #e06060;
        }

        .control-btn[data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-light);
            border: 1px solid rgba(201,169,110,0.2);
            color: var(--text);
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.06em;
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s, bottom 0.18s;
        }
        .control-btn[data-tip]:hover::after {
            opacity: 1;
            bottom: calc(100% + 14px);
        }

        .end-call {
            width: 58px;
            height: 58px;
            font-size: 18px;
            background: rgba(160,30,30,0.7);
            border-color: rgba(220,80,80,0.4);
            color: #fff;
        }
        .end-call:hover {
            background: rgba(200,40,40,0.9);
            border-color: rgba(255,100,100,0.5);
            color: #fff;
            transform: translateY(-2px);
        }

        .chat-active {
            background: var(--gold-dim) !important;
            border-color: var(--gold) !important;
            color: var(--gold) !important;
        }

        .share-active {
            background: var(--gold-dim) !important;
            border-color: var(--gold) !important;
            color: var(--gold) !important;
        }

        .chat-panel {
            position: absolute;
            bottom: 110px;
            right: 24px;
            width: 310px;
            max-width: calc(100vw - 48px);
            background: var(--surface-light);
            backdrop-filter: blur(28px);
            border-radius: var(--radius);
            border: 1px solid rgba(201,169,110,0.18);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(calc(100% + 28px));
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
            z-index: 25;
        }
        .chat-panel.open {
            transform: translateX(0);
            opacity: 1;
        }

        .chat-header {
            padding: 14px 18px 12px;
            border-bottom: 1px solid rgba(201,169,110,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header-title .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0.8;
        }
        .chat-header-title span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.06em;
            color: var(--text);
        }
        #closeChatBtn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        #closeChatBtn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

        .chat-messages {
            height: 290px;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(201,169,110,0.2) transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.25); border-radius: 2px; }

        .chat-empty {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0.06em;
            font-style: italic;
        }

        .chat-message {
            max-width: 82%;
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 300;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .chat-message.outgoing {
            align-self: flex-end;
            background: rgba(201,169,110,0.18);
            border: 1px solid rgba(201,169,110,0.25);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }
        .chat-message.incoming {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .chat-message-time {
            font-size: 9px;
            opacity: 0.4;
            margin-top: 4px;
            letter-spacing: 0.05em;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px 14px;
            border-top: 1px solid rgba(201,169,110,0.1);
        }
        .chat-input-area input {
            flex: 1;
            padding: 9px 14px;
            border-radius: 24px;
            border: 1px solid rgba(201,169,110,0.18);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 300;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input::placeholder { color: var(--text-dim); }
        .chat-input-area input:focus { border-color: var(--gold-mid); }
        .chat-input-area button {
            background: var(--gold-dim);
            border: 1px solid var(--gold-mid);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--gold);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .chat-input-area button:hover { background: rgba(201,169,110,0.3); border-color: var(--gold); }

        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: var(--surface-light);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(201,169,110,0.22);
            border-radius: 30px;
            padding: 9px 20px;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: var(--text);
            z-index: 3000;
            white-space: nowrap;
            max-width: 90%;
            text-align: center;
            animation: toastIn 0.3s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        .toast.error { border-color: rgba(220,80,80,0.35); color: #e08080; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(14px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 640px) {
            .local-video-wrapper { width: 84px; height: 116px; bottom: 104px; right: 14px; }
            .control-btn { width: 46px; height: 46px; font-size: 15px; }
            .end-call { width: 52px; height: 52px; font-size: 16px; }
            .controls { gap: 10px; padding: 0 14px 20px; }
            .chat-panel { width: calc(100vw - 28px); right: 14px; bottom: 104px; }
            .chat-messages { height: 240px; }
            .top-bar { padding: 14px 16px; }
        }
    </style>
</head>
<body>
<div class="call-container">

    <!-- Remote video -->
    <div class="remote-video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div class="vignette"></div>

    <div id="waitingMessage" class="waiting-message" style="display:none;">
        <div class="waiting-ring"></div>
        <p>Ожидание собеседника</p>
        <span>Сессия готова</span>
    </div>

    <div class="local-video-wrapper" id="localVideoWrapper">
        <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div class="top-bar">
        <div class="session-info">
            <div class="session-label">Терапевтическая сессия</div>
            <div id="connectionStatus">Подключение…</div>
        </div>
        <div class="top-buttons">
            <button id="recordBtn" class="top-btn" data-tip="Запись разговора">
                <i class="fas fa-circle"></i> Запись
            </button>
            <button id="reconnectBtnTop" class="top-btn">
                <i class="fas fa-sync-alt"></i> Переподключиться
            </button>
        </div>
    </div>

    <div class="controls">
        <button id="toggleMic" class="control-btn" data-tip="Микрофон">
            <i class="fas fa-microphone"></i>
        </button>
        <button id="toggleCam" class="control-btn" data-tip="Камера">
            <i class="fas fa-video"></i>
        </button>
        <button id="shareScreenBtn" class="control-btn" data-tip="Показать экран">
            <i class="fas fa-desktop"></i>
        </button>
        <button id="chatToggleBtn" class="control-btn" data-tip="Чат">
            <i class="fas fa-comment"></i>
        </button>
        <button id="endCallBtn" class="control-btn end-call" data-tip="Завершить">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>

    <div id="chatPanel" class="chat-panel">
        <div class="chat-header">
            <div class="chat-header-title">
                <div class="dot"></div>
                <span>Чат сессии</span>
            </div>
            <button id="closeChatBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty">Сообщения появятся здесь</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Написать сообщение…">
            <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    let userRole = urlParams.get('role');
    const currentUserId = localStorage.getItem('userId');

    if (!roomId || !userRole || !currentUserId) {
        alert('Ошибка: не все параметры звонка. Вернитесь на главную.');
        window.location.href = '/';
    }

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const waitingMsg = document.getElementById('waitingMessage');
    const statusDiv = document.getElementById('connectionStatus');
    const toggleMicBtn = document.getElementById('toggleMic');
    const toggleCamBtn = document.getElementById('toggleCam');
    const shareScreenBtn = document.getElementById('shareScreenBtn');
    const recordBtn = document.getElementById('recordBtn');
    const reconnectBtnTop = document.getElementById('reconnectBtnTop');
    const chatToggleBtn = document.getElementById('chatToggleBtn');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const endCallBtn = document.getElementById('endCallBtn');
    const chatPanel = document.getElementById('chatPanel');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const localVideoWrapper = document.getElementById('localVideoWrapper');

    let localStream = null;
    let peerConnection = null;
    let socket = null;
    let partnerSocketId = null;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isLocalLarge = false;
    let connectionEstablished = false;

    let isScreenSharing = false;
    let screenStream = null;
    let cameraTrack = null;

    function updateStatus(msg, isError = false) {
        statusDiv.textContent = msg;
        statusDiv.style.color = isError ? '#e08080' : (connectionEstablished ? 'rgba(232,228,220,0.35)' : 'rgba(232,228,220,0.55)');
        console.log(msg);
    }

    function showToast(message, isError = false) {
        const old = document.querySelector('.toast');
        if (old) old.remove();
        const t = document.createElement('div');
        t.className = 'toast' + (isError ? ' error' : '');
        t.textContent = message;
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 320); }, 2800);
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function addChatMessage(text, isOutgoing = false, time = null) {
        const empty = chatMessages.querySelector('.chat-empty');
        if (empty) empty.remove();
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-message ' + (isOutgoing ? 'outgoing' : 'incoming');
        const timeStr = time ? new Date(time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        msgDiv.innerHTML = `<div>${escapeHtml(text)}</div><div class="chat-message-time">${timeStr}</div>`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function getIceServers() {
        return [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.ekiga.net' },
            { urls: 'stun:stun.ideasip.com' },
            { urls: 'stun:stun.iptel.org' },
            { urls: 'stun:stun.rixtelecom.se' },
            { urls: 'stun:stun.schlund.de' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
        ];
    }

    async function createPeerConnection() {
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        const config = { iceServers: await getIceServers(), iceTransportPolicy: 'all' };
        peerConnection = new RTCPeerConnection(config);
        if (localStream) {
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        }
        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
            waitingMsg.style.display = 'none';
            connectionEstablished = true;
            updateStatus('Соединение установлено');
        };
        peerConnection.onicecandidate = (event) => {
            if (event.candidate && socket && partnerSocketId)
                socket.emit('ice-candidate', { target: partnerSocketId, candidate: event.candidate });
        };
        peerConnection.oniceconnectionstatechange = () => {
            if (!peerConnection) return;
            const state = peerConnection.iceConnectionState;
            console.log('ICE state:', state);
            if (state === 'connected') {
                connectionEstablished = true;
                updateStatus('Соединение установлено');
                waitingMsg.style.display = 'none';
            } else if (state === 'failed') {
                connectionEstablished = false;
                updateStatus('Соединение разорвано, попробуйте переподключиться', true);
                waitingMsg.style.display = 'flex';
                setTimeout(() => { if (!connectionEstablished) reconnect(); }, 3000);
            } else if (state === 'disconnected') {
                connectionEstablished = false;
                updateStatus('Потеря связи', true);
            }
        };
        return peerConnection;
    }

    async function initWebRTC(createOffer = true) {
        if (!localStream) return;
        await createPeerConnection();
        if (createOffer && socket && partnerSocketId) {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', { target: partnerSocketId, sdp: offer });
            updateStatus('Установка соединения…');
        }
    }

    async function startLocalStream() {
        try {
            updateStatus('Запрос доступа к камере…');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStream = stream;
            localVideo.srcObject = localStream;
            cameraTrack = localStream.getVideoTracks()[0];
            updateStatus('Камера активна');
            if (socket && partnerSocketId) await initWebRTC(userRole === 'psychologist');
        } catch(e) {
            updateStatus('Нет доступа к камере или микрофону', true);
            showToast('Не удалось получить доступ к камере', true);
        }
    }

    async function replaceVideoTrack(newTrack) {
        if (!peerConnection) return;
        const senders = peerConnection.getSenders();
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender) {
            try {
                await videoSender.replaceTrack(newTrack);
                console.log('Video track replaced');
            } catch (err) {
                console.error('Error replacing video track:', err);
            }
        } else if (newTrack) {
            peerConnection.addTrack(newTrack, localStream);
        }
        if (newTrack) {
            const newStream = new MediaStream();
            newStream.addTrack(newTrack);
            if (localStream.getAudioTracks()[0]) newStream.addTrack(localStream.getAudioTracks()[0]);
            localVideo.srcObject = newStream;
        }
    }

    async function startScreenShare() {
        if (isScreenSharing) return;
        try {
            const screenStreamObj = await navigator.mediaDevices.getDisplayMedia({ video: true });
            screenStream = screenStreamObj;
            const screenTrack = screenStream.getVideoTracks()[0];
            if (cameraTrack) cameraTrack.enabled = false;
            await replaceVideoTrack(screenTrack);
            isScreenSharing = true;
            shareScreenBtn.classList.add('share-active');
            // Уведомляем собеседника о начале трансляции экрана
            if (socket && partnerSocketId) {
                socket.emit('call-message', { text: '🖥️ Начал трансляцию экрана' });
                socket.emit('screen-share-started', { target: partnerSocketId });
            }
            showToast('Трансляция экрана включена');
            screenTrack.onended = () => {
                if (isScreenSharing) stopScreenShare();
            };
        } catch (err) {
            console.error('Error starting screen share:', err);
            showToast('Не удалось начать трансляцию экрана', true);
        }
    }

    async function stopScreenShare() {
        if (!isScreenSharing) return;
        if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
        }
        if (cameraTrack) {
            cameraTrack.enabled = true;
            await replaceVideoTrack(cameraTrack);
        } else {
            await replaceVideoTrack(null);
        }
        isScreenSharing = false;
        shareScreenBtn.classList.remove('share-active');
        if (socket && partnerSocketId) {
            socket.emit('call-message', { text: '🖥️ Остановил трансляцию экрана' });
            socket.emit('screen-share-stopped', { target: partnerSocketId });
        }
        showToast('Трансляция экрана выключена');
    }

    function toggleScreenShare() {
        if (isScreenSharing) {
            stopScreenShare();
        } else {
            startScreenShare();
        }
    }

    function setupSocket() {
        if (socket) {
            socket.disconnect();
            socket = null;
        }

        socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });

        socket.on('connect', () => {
            updateStatus('Соединение с сервером');
            socket.emit('register_user', currentUserId);
            socket.emit('join-call-room', roomId, currentUserId, userRole);
        });

        socket.on('connect_error', (err) => {
            console.error('Socket connection error:', err);
            updateStatus('Ошибка соединения', true);
        });

        socket.on('room-joined', () => {
            updateStatus('Ожидание собеседника…');
            waitingMsg.style.display = 'flex';
            connectionEstablished = false;
        });

        socket.on('call-ready', async (data) => {
            updateStatus('Собеседник найден…');
            partnerSocketId = data.partnerId;
            waitingMsg.style.display = 'none';
            if (localStream) {
                await initWebRTC(userRole === 'psychologist');
            } else {
                const wait = setInterval(async () => {
                    if (localStream) { clearInterval(wait); await initWebRTC(userRole === 'psychologist'); }
                }, 200);
            }
        });

        socket.on('offer', async (data) => {
            partnerSocketId = data.from;
            if (!peerConnection) await createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            if (socket && partnerSocketId) {
                socket.emit('answer', { target: partnerSocketId, sdp: answer });
            }
        });

        socket.on('answer', async (data) => {
            if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection) {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); }
                catch(e) { console.warn('ICE add error', e); }
            }
        });

        socket.on('call-message', (data) => {
            addChatMessage(data.text, false, data.time);
        });

        socket.on('call-ended', () => {
            updateStatus('Звонок завершён');
            showToast('Сессия завершена');
            setTimeout(() => window.location.href = '/', 1500);
        });

        socket.on('partner-disconnected', () => {
            updateStatus('Собеседник отключился', true);
            showToast('Собеседник покинул сессию', true);
            connectionEstablished = false;
            waitingMsg.style.display = 'flex';
        });

        // Обработка уведомлений о трансляции экрана от собеседника
        socket.on('screen-share-started', () => {
            remoteVideo.style.objectFit = 'contain';
            showToast('Собеседник начал показывать экран');
        });
        socket.on('screen-share-stopped', () => {
            remoteVideo.style.objectFit = 'cover';
            showToast('Собеседник прекратил показ экрана');
        });
    }

    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (!text || !socket || !partnerSocketId) {
            if (!socket) showToast('Нет соединения с сервером', true);
            return;
        }
        addChatMessage(text, true);
        socket.emit('call-message', { text });
        chatInput.value = '';
    }

    function swapVideoSize() {
        const remoteWrapper = document.querySelector('.remote-video-wrapper');
        const localWrapper = document.querySelector('.local-video-wrapper');
        if (!isLocalLarge) {
            remoteWrapper.style.zIndex = '1';
            localWrapper.style.zIndex = '2';
            localWrapper.style.width = '100%';
            localWrapper.style.height = '100%';
            localWrapper.style.bottom = '0';
            localWrapper.style.right = '0';
            localWrapper.style.borderRadius = '0';
            remoteWrapper.style.position = 'absolute';
            remoteWrapper.style.bottom = '110px';
            remoteWrapper.style.right = '24px';
            remoteWrapper.style.width = '110px';
            remoteWrapper.style.height = '150px';
            remoteWrapper.style.borderRadius = '20px';
            remoteWrapper.style.overflow = 'hidden';
            remoteWrapper.style.border = '1px solid rgba(201,169,110,0.45)';
            remoteWrapper.style.cursor = 'pointer';
            isLocalLarge = true;
        } else {
            remoteWrapper.style.zIndex = '1';
            localWrapper.style.zIndex = '10';
            localWrapper.style.width = '110px';
            localWrapper.style.height = '150px';
            localWrapper.style.bottom = '110px';
            localWrapper.style.right = '24px';
            localWrapper.style.borderRadius = '20px';
            remoteWrapper.style.position = 'absolute';
            remoteWrapper.style.inset = '0';
            remoteWrapper.style.width = '100%';
            remoteWrapper.style.height = '100%';
            remoteWrapper.style.border = 'none';
            remoteWrapper.style.bottom = 'auto';
            remoteWrapper.style.right = 'auto';
            remoteWrapper.style.borderRadius = '0';
            remoteWrapper.style.cursor = 'default';
            isLocalLarge = false;
        }
    }

    async function startRecording() {
        if (!localStream) return;
        try {
            recordedChunks = [];
            const recordingStream = new MediaStream([localStream.getAudioTracks()[0]]);
            mediaRecorder = new MediaRecorder(recordingStream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                const fd = new FormData();
                fd.append('recording', blob, `call_recording_${Date.now()}.webm`);
                fd.append('from', currentUserId);
                fd.append('to', partnerSocketId || 'unknown');
                fd.append('roomId', roomId);
                try {
                    await fetch('/api/upload-recording', { method: 'POST', body: fd });
                    showToast('Запись сохранена');
                } catch(e) {
                    console.error('Upload recording error:', e);
                }
            };
            mediaRecorder.start(1000);
            isRecording = true;
            recordBtn.classList.add('recording-active');
            recordBtn.innerHTML = '<span class="rec-dot"></span> Запись ...';
            updateStatus('Запись идёт…');
        } catch(e) { console.error(e); showToast('Ошибка записи', true); }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.remove('recording-active');
            recordBtn.innerHTML = '<i class="fas fa-circle"></i> Запись';
            updateStatus('Запись сохранена');
        }
    }

    function toggleRecording() {
        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
        }
    }

    function endCall() {
        if (socket) socket.emit('end-call');
        if (isRecording) stopRecording();
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (screenStream) screenStream.getTracks().forEach(track => track.stop());
        window.location.href = '/';
    }

    function reconnect() {
        if (socket) {
            socket.disconnect();
            socket = null;
        }
        partnerSocketId = null;
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        setupSocket();
        updateStatus('Переподключение…');
        connectionEstablished = false;
        waitingMsg.style.display = 'flex';
    }

    async function init() {
        setupSocket();
        await startLocalStream();

        toggleMicBtn.onclick = () => {
            if (localStream) {
                const t = localStream.getAudioTracks()[0];
                if (t) {
                    t.enabled = !t.enabled;
                    toggleMicBtn.classList.toggle('muted');
                    toggleMicBtn.innerHTML = t.enabled
                        ? '<i class="fas fa-microphone"></i>'
                        : '<i class="fas fa-microphone-slash"></i>';
                }
            }
        };

        toggleCamBtn.onclick = () => {
            if (localStream) {
                const t = localStream.getVideoTracks()[0];
                if (t) {
                    t.enabled = !t.enabled;
                    toggleCamBtn.classList.toggle('muted');
                    toggleCamBtn.innerHTML = t.enabled
                        ? '<i class="fas fa-video"></i>'
                        : '<i class="fas fa-video-slash"></i>';
                }
            }
        };

        shareScreenBtn.onclick = toggleScreenShare;
        recordBtn.onclick = toggleRecording;
        reconnectBtnTop.onclick = reconnect;
        endCallBtn.onclick = endCall;
        sendChatBtn.onclick = sendChatMessage;
        chatInput.onkeypress = e => { if (e.key === 'Enter') sendChatMessage(); };

        chatToggleBtn.onclick = () => {
            chatPanel.classList.toggle('open');
            chatToggleBtn.classList.toggle('chat-active', chatPanel.classList.contains('open'));
        };

        closeChatBtn.onclick = () => {
            chatPanel.classList.remove('open');
            chatToggleBtn.classList.remove('chat-active');
        };

        localVideoWrapper.onclick = swapVideoSize;
    }

    init();
})();
</script>
</body>
</html>
