<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#080b09">
    <title>Видеосессия | Therapy Call</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --gold: #c9a96e;
            --gold-dim: rgba(201,169,110,0.18);
            --gold-mid: rgba(201,169,110,0.45);
            --surface: rgba(12,14,13,0.88);
            --surface-light: rgba(22,26,24,0.92);
            --text: #e8e4dc;
            --text-dim: rgba(232,228,220,0.45);
            --radius: 20px;
            --radius-sm: 12px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #080b09;
            min-height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            color: var(--text);
        }

        /* Основной контейнер звонка */
        .call-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* Видео удалённого участника – адаптивное */
        .remote-video-wrapper {
            flex: 1;
            background: #060908;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* по умолчанию – как экран (без чёрных полос) */
            background: #000;
        }
        #remoteVideo.camera-mode {
            object-fit: cover; /* для обычной камеры заполняет фон, но сохраняет пропорции */
        }
        #remoteVideo.screen-mode {
            object-fit: contain; /* для демонстрации экрана – без искажений */
        }

        /* Локальное видео (миниатюра) */
        .local-video-wrapper {
            position: absolute;
            bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            right: 16px;
            width: 110px;
            height: 150px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--gold-mid);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 8px 32px rgba(0,0,0,0.7);
            z-index: 10;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s;
            background: #000;
        }
        .local-video-wrapper:hover {
            transform: scale(1.04);
            border-color: var(--gold);
        }
        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* Верхняя панель – только кнопки, без названия */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: calc(16px + var(--safe-top)) 20px 16px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 15;
            pointer-events: none;
        }
        .top-buttons {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .top-btn {
            background: var(--surface);
            border: 1px solid var(--gold-mid);
            border-radius: 40px;
            padding: 8px 18px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: var(--gold);
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            backdrop-filter: blur(16px);
        }
        .top-btn i {
            font-size: 14px;
        }
        .top-btn:hover {
            background: var(--gold-dim);
            border-color: var(--gold);
        }

        /* Меню-гамбургер (для скрытых кнопок) */
        .menu-wrapper {
            position: relative;
            display: inline-block;
        }
        #extraMenu {
            position: absolute;
            right: 0;
            top: 50px;
            background: var(--surface-light);
            backdrop-filter: blur(24px);
            border-radius: var(--radius-sm);
            border: 1px solid var(--gold-mid);
            padding: 8px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 160px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        #extraMenu button {
            width: 100%;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--gold-mid);
        }
        #extraMenu button.recording-active {
            background: rgba(180,30,30,0.5);
            border-color: rgba(220,60,60,0.6);
            color: #ff8080;
        }
        .rec-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff5555;
            animation: blink 1s ease infinite;
            margin-right: 6px;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

        /* Ожидание собеседника */
        .waiting-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .waiting-ring {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1.5px solid rgba(201,169,110,0.2);
            border-top-color: var(--gold);
            animation: spin 1.2s cubic-bezier(0.4,0,0.6,1) infinite;
        }
        .waiting-message p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: var(--text);
            opacity: 0.7;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Панель управления – поднята наверх, адаптивная */
        .controls {
            position: absolute;
            bottom: calc(24px + var(--safe-bottom));
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 20;
            padding: 0 20px;
            flex-wrap: wrap;
        }
        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid rgba(201,169,110,0.22);
            background: var(--surface);
            backdrop-filter: blur(20px);
            cursor: pointer;
            font-size: 20px;
            color: var(--text);
            transition: all 0.22s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            background: var(--gold-dim);
            border-color: var(--gold-mid);
            color: var(--gold);
            transform: translateY(-2px);
        }
        .control-btn.muted {
            background: rgba(180,60,60,0.22);
            border-color: rgba(220,100,100,0.35);
            color: #e06060;
        }
        .end-call {
            width: 60px;
            height: 60px;
            background: rgba(160,30,30,0.7);
            border-color: rgba(220,80,80,0.4);
            color: #fff;
        }
        .end-call:hover {
            background: rgba(200,40,40,0.9);
        }

        /* Панель чата – адаптивная */
        .chat-panel {
            position: absolute;
            bottom: calc(100px + var(--safe-bottom));
            right: 20px;
            width: 320px;
            max-width: calc(100vw - 40px);
            background: var(--surface-light);
            backdrop-filter: blur(28px);
            border-radius: var(--radius);
            border: 1px solid rgba(201,169,110,0.18);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(calc(100% + 28px));
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
            z-index: 25;
        }
        .chat-panel.open {
            transform: translateX(0);
            opacity: 1;
        }
        .chat-header {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(201,169,110,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header-title .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
        }
        .chat-messages {
            height: 280px;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-empty {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
        }
        .chat-message {
            max-width: 82%;
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            word-wrap: break-word;
        }
        .chat-message.outgoing {
            align-self: flex-end;
            background: rgba(201,169,110,0.18);
            border: 1px solid rgba(201,169,110,0.25);
            border-bottom-right-radius: 4px;
        }
        .chat-message.incoming {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border-bottom-left-radius: 4px;
        }
        .chat-message-time {
            font-size: 9px;
            opacity: 0.4;
            margin-top: 4px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px 14px;
            border-top: 1px solid rgba(201,169,110,0.1);
        }
        .chat-input-area input {
            flex: 1;
            padding: 9px 14px;
            border-radius: 24px;
            border: 1px solid rgba(201,169,110,0.18);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .chat-input-area button {
            background: var(--gold-dim);
            border: 1px solid var(--gold-mid);
            width: 36px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--gold);
        }

        /* Мобильные адаптации */
        @media (max-width: 640px) {
            .local-video-wrapper {
                width: 80px;
                height: 110px;
                bottom: calc(80px + var(--safe-bottom));
                right: 12px;
            }
            .control-btn {
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
            .end-call {
                width: 54px;
                height: 54px;
            }
            .controls {
                gap: 12px;
                bottom: calc(16px + var(--safe-bottom));
            }
            .top-btn {
                padding: 6px 14px;
                font-size: 11px;
            }
            .chat-panel {
                bottom: calc(80px + var(--safe-bottom));
                right: 12px;
                width: calc(100vw - 24px);
            }
        }
    </style>
</head>
<body>
<div class="call-container">
    <div class="remote-video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div id="waitingMessage" class="waiting-message" style="display:none;">
        <div class="waiting-ring"></div>
        <p>Ожидание собеседника</p>
    </div>

    <div class="local-video-wrapper" id="localVideoWrapper">
        <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div class="top-bar">
        <div class="top-buttons">
            <button id="pipBtn" class="top-btn" data-tip="Свернуть в окно">
                <i class="fas fa-window-minimize"></i> Свернуть
            </button>
            <div class="menu-wrapper">
                <button id="menuBtn" class="top-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <div id="extraMenu">
                    <button id="recordBtn" class="top-btn"><i class="fas fa-circle"></i> Запись</button>
                    <button id="reconnectBtn" class="top-btn"><i class="fas fa-sync-alt"></i> Переподключиться</button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="toggleMic" class="control-btn" data-tip="Микрофон">
            <i class="fas fa-microphone"></i>
        </button>
        <button id="toggleCam" class="control-btn" data-tip="Камера">
            <i class="fas fa-video"></i>
        </button>
        <button id="shareScreenBtn" class="control-btn" data-tip="Показать экран">
            <i class="fas fa-desktop"></i>
        </button>
        <button id="chatToggleBtn" class="control-btn" data-tip="Чат">
            <i class="fas fa-comment"></i>
        </button>
        <button id="endCallBtn" class="control-btn end-call" data-tip="Завершить">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>

    <div id="chatPanel" class="chat-panel">
        <div class="chat-header">
            <div class="chat-header-title">
                <div class="dot"></div>
                <span>Чат сессии</span>
            </div>
            <button id="closeChatBtn" style="background:none; border:none; color:var(--text-dim); font-size:16px; cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty">Сообщения появятся здесь</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Написать сообщение…">
            <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    let userRole = urlParams.get('role');
    const currentUserId = localStorage.getItem('userId');

    if (!roomId || !userRole || !currentUserId) {
        alert('Ошибка параметров звонка. Вернитесь на главную.');
        window.location.href = '/';
    }

    // DOM элементы
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const waitingMsg = document.getElementById('waitingMessage');
    const toggleMicBtn = document.getElementById('toggleMic');
    const toggleCamBtn = document.getElementById('toggleCam');
    const shareScreenBtn = document.getElementById('shareScreenBtn');
    const recordBtn = document.getElementById('recordBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const chatToggleBtn = document.getElementById('chatToggleBtn');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const endCallBtn = document.getElementById('endCallBtn');
    const chatPanel = document.getElementById('chatPanel');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const localVideoWrapper = document.getElementById('localVideoWrapper');
    const pipBtn = document.getElementById('pipBtn');
    const menuBtn = document.getElementById('menuBtn');
    const extraMenu = document.getElementById('extraMenu');

    let localStream = null;
    let peerConnection = null;
    let socket = null;
    let partnerSocketId = null;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isLocalLarge = false;
    let connectionEstablished = false;
    let isScreenSharing = false;
    let screenStream = null;
    let cameraTrack = null;
    let remoteScreenMode = false;

    // Вспомогательные функции
    function showToast(msg, isErr = false) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const div = document.createElement('div');
        div.className = 'toast';
        div.textContent = msg;
        div.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#c9a96e; padding:8px 18px; border-radius:30px; font-size:12px; z-index:3000; backdrop-filter:blur(12px);';
        if (isErr) div.style.color = '#e08080';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    function addChatMessage(text, isOutgoing = false, time = null) {
        const empty = chatMessages.querySelector('.chat-empty');
        if (empty) empty.remove();
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-message ' + (isOutgoing ? 'outgoing' : 'incoming');
        const timeStr = time ? new Date(time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        msgDiv.innerHTML = `<div>${escapeHtml(text)}</div><div class="chat-message-time">${timeStr}</div>`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    async function getIceServers() {
        return [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.ekiga.net' },
            { urls: 'stun:stun.ideasip.com' },
            { urls: 'stun:stun.iptel.org' },
            { urls: 'stun:stun.rixtelecom.se' },
            { urls: 'stun:stun.schlund.de' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
        ];
    }

    async function createPeerConnection() {
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        const config = { iceServers: await getIceServers(), iceTransportPolicy: 'all' };
        peerConnection = new RTCPeerConnection(config);
        if (localStream) {
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        }
        peerConnection.ontrack = (event) => {
            const stream = event.streams[0];
            remoteVideo.srcObject = stream;
            waitingMsg.style.display = 'none';
            connectionEstablished = true;
            updateRemoteVideoMode(remoteScreenMode);
        };
        peerConnection.onicecandidate = (event) => {
            if (event.candidate && socket && partnerSocketId)
                socket.emit('ice-candidate', { target: partnerSocketId, candidate: event.candidate });
        };
        peerConnection.oniceconnectionstatechange = () => {
            if (!peerConnection) return;
            const state = peerConnection.iceConnectionState;
            if (state === 'connected') {
                connectionEstablished = true;
                waitingMsg.style.display = 'none';
            } else if (state === 'failed') {
                connectionEstablished = false;
                waitingMsg.style.display = 'flex';
                setTimeout(() => { if (!connectionEstablished) reconnect(); }, 3000);
            } else if (state === 'disconnected') {
                connectionEstablished = false;
                waitingMsg.style.display = 'flex';
            }
        };
        return peerConnection;
    }

    async function initWebRTC(createOffer = true) {
        if (!localStream) return;
        await createPeerConnection();
        if (createOffer && socket && partnerSocketId) {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', { target: partnerSocketId, sdp: offer });
        }
    }

    async function startLocalStream() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStream = stream;
            localVideo.srcObject = localStream;
            cameraTrack = localStream.getVideoTracks()[0];
            if (socket && partnerSocketId) await initWebRTC(userRole === 'psychologist');
        } catch(e) {
            showToast('Не удалось получить доступ к камере/микрофону', true);
        }
    }

    async function replaceVideoTrack(newTrack) {
        if (!peerConnection) return;
        const senders = peerConnection.getSenders();
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender) {
            try { await videoSender.replaceTrack(newTrack); } catch(e) {}
        } else if (newTrack) {
            peerConnection.addTrack(newTrack, localStream);
        }
        if (newTrack) {
            const newStream = new MediaStream();
            newStream.addTrack(newTrack);
            if (localStream.getAudioTracks()[0]) newStream.addTrack(localStream.getAudioTracks()[0]);
            localVideo.srcObject = newStream;
        }
    }

    async function startScreenShare() {
        if (isScreenSharing) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            showToast('Трансляция экрана не поддерживается', true);
            return;
        }
        try {
            const screenStreamObj = await navigator.mediaDevices.getDisplayMedia({ video: true });
            screenStream = screenStreamObj;
            const screenTrack = screenStream.getVideoTracks()[0];
            if (cameraTrack) cameraTrack.enabled = false;
            await replaceVideoTrack(screenTrack);
            isScreenSharing = true;
            shareScreenBtn.classList.add('share-active');
            if (socket && partnerSocketId) {
                socket.emit('call-message', { text: 'Начал трансляцию экрана' });
                socket.emit('screen-share-started', { roomId });
            }
            screenTrack.onended = () => { if (isScreenSharing) stopScreenShare(); };
        } catch(err) {
            showToast('Не удалось начать трансляцию', true);
        }
    }

    async function stopScreenShare() {
        if (!isScreenSharing) return;
        if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
        }
        if (cameraTrack) {
            cameraTrack.enabled = true;
            await replaceVideoTrack(cameraTrack);
        } else {
            await replaceVideoTrack(null);
        }
        isScreenSharing = false;
        shareScreenBtn.classList.remove('share-active');
        if (socket && partnerSocketId) {
            socket.emit('call-message', { text: 'Остановил трансляцию экрана' });
            socket.emit('screen-share-stopped', { roomId });
        }
    }

    function toggleScreenShare() {
        if (isScreenSharing) stopScreenShare();
        else startScreenShare();
    }

    function setupSocket() {
        if (socket) { socket.disconnect(); socket = null; }
        socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity
        });
        socket.on('connect', () => {
            socket.emit('register_user', currentUserId);
            socket.emit('join-call-room', roomId, currentUserId, userRole);
        });
        socket.on('room-joined', () => {
            waitingMsg.style.display = 'flex';
            connectionEstablished = false;
        });
        socket.on('call-ready', async (data) => {
            partnerSocketId = data.partnerId;
            waitingMsg.style.display = 'none';
            if (localStream) await initWebRTC(userRole === 'psychologist');
            else {
                const wait = setInterval(async () => {
                    if (localStream) { clearInterval(wait); await initWebRTC(userRole === 'psychologist'); }
                }, 200);
            }
        });
        socket.on('offer', async (data) => {
            partnerSocketId = data.from;
            if (!peerConnection) await createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { target: partnerSocketId, sdp: answer });
        });
        socket.on('answer', async (data) => {
            if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        });
        socket.on('ice-candidate', async (data) => {
            if (peerConnection) {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
            }
        });
        socket.on('call-message', (data) => { addChatMessage(data.text, false, data.time); });
        socket.on('screen-share-started', () => { remoteScreenMode = true; updateRemoteVideoMode(true); });
        socket.on('screen-share-stopped', () => { remoteScreenMode = false; updateRemoteVideoMode(false); });
        socket.on('call-ended', () => {
            showToast('Сессия завершена');
            setTimeout(() => window.location.href = '/', 1500);
        });
        socket.on('partner-disconnected', () => {
            showToast('Собеседник отключился', true);
            waitingMsg.style.display = 'flex';
            connectionEstablished = false;
        });
    }

    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (!text || !socket || !partnerSocketId) return;
        addChatMessage(text, true);
        socket.emit('call-message', { text });
        chatInput.value = '';
    }

    function swapVideoSize() {
        // просто переключение размера локального видео – для удобства
        const wrapper = document.querySelector('.local-video-wrapper');
        if (!isLocalLarge) {
            wrapper.style.width = '100%';
            wrapper.style.height = '100%';
            wrapper.style.bottom = '0';
            wrapper.style.right = '0';
            wrapper.style.borderRadius = '0';
            isLocalLarge = true;
        } else {
            wrapper.style.width = '';
            wrapper.style.height = '';
            wrapper.style.bottom = '';
            wrapper.style.right = '';
            wrapper.style.borderRadius = '';
            isLocalLarge = false;
        }
    }

    async function startRecording() {
        if (!localStream) return;
        recordedChunks = [];
        const recordingStream = new MediaStream([localStream.getAudioTracks()[0]]);
        mediaRecorder = new MediaRecorder(recordingStream, { mimeType: 'audio/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            const fd = new FormData();
            fd.append('recording', blob, `call_${Date.now()}.webm`);
            fd.append('from', currentUserId);
            fd.append('to', partnerSocketId || 'unknown');
            fd.append('roomId', roomId);
            try {
                await fetch('/api/upload-recording', { method: 'POST', body: fd });
                showToast('Запись сохранена');
            } catch(e) { console.error(e); }
        };
        mediaRecorder.start(1000);
        isRecording = true;
        recordBtn.classList.add('recording-active');
        recordBtn.innerHTML = '<span class="rec-dot"></span> Запись ...';
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.remove('recording-active');
            recordBtn.innerHTML = '<i class="fas fa-circle"></i> Запись';
        }
    }

    function toggleRecording() {
        if (isRecording) stopRecording();
        else startRecording();
    }

    function endCall() {
        if (socket) socket.emit('end-call');
        if (isRecording) stopRecording();
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        window.location.href = '/';
    }

    function reconnect() {
        if (socket) socket.disconnect();
        partnerSocketId = null;
        if (peerConnection) peerConnection.close();
        peerConnection = null;
        setupSocket();
        waitingMsg.style.display = 'flex';
        connectionEstablished = false;
    }

    function updateRemoteVideoMode(isScreen) {
        if (isScreen) {
            remoteVideo.classList.remove('camera-mode');
            remoteVideo.classList.add('screen-mode');
        } else {
            remoteVideo.classList.remove('screen-mode');
            remoteVideo.classList.add('camera-mode');
        }
    }

    // Picture-in-Picture
    async function togglePictureInPicture() {
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else if (remoteVideo) {
                await remoteVideo.requestPictureInPicture();
            }
        } catch (err) {
            showToast('Режим PiP не поддерживается браузером', true);
        }
    }

    // Меню
    function toggleMenu(e) {
        e.stopPropagation();
        const isVisible = extraMenu.style.display === 'flex';
        extraMenu.style.display = isVisible ? 'none' : 'flex';
    }
    function closeMenuOnClickOutside(e) {
        if (!menuBtn.contains(e.target) && !extraMenu.contains(e.target)) {
            extraMenu.style.display = 'none';
        }
    }

    // Инициализация
    async function init() {
        setupSocket();
        await startLocalStream();

        // Обработчики
        toggleMicBtn.onclick = () => {
            if (localStream) {
                const t = localStream.getAudioTracks()[0];
                if (t) {
                    t.enabled = !t.enabled;
                    toggleMicBtn.classList.toggle('muted');
                    toggleMicBtn.innerHTML = t.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
                }
            }
        };
        toggleCamBtn.onclick = () => {
            if (localStream) {
                const t = localStream.getVideoTracks()[0];
                if (t) {
                    t.enabled = !t.enabled;
                    toggleCamBtn.classList.toggle('muted');
                    toggleCamBtn.innerHTML = t.enabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
                }
            }
        };
        shareScreenBtn.onclick = toggleScreenShare;
        recordBtn.onclick = toggleRecording;
        reconnectBtn.onclick = reconnect;
        endCallBtn.onclick = endCall;
        sendChatBtn.onclick = sendChatMessage;
        chatInput.onkeypress = e => { if (e.key === 'Enter') sendChatMessage(); };
        chatToggleBtn.onclick = () => {
            chatPanel.classList.toggle('open');
            chatToggleBtn.classList.toggle('chat-active', chatPanel.classList.contains('open'));
        };
        closeChatBtn.onclick = () => chatPanel.classList.remove('open');
        localVideoWrapper.onclick = swapVideoSize;
        pipBtn.onclick = togglePictureInPicture;
        menuBtn.onclick = toggleMenu;
        document.addEventListener('click', closeMenuOnClickOutside);

        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            shareScreenBtn.style.display = 'none';
        }
        updateRemoteVideoMode(false);
    }

    init();
})();
</script>
</body>
</html>
