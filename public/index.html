                localVideo.classList.remove('screen-mode');
            }
        }

        function minimizeCall() {
            if (!isCallActive) return;
            const fullscreenCall = document.getElementById('callContainer');
            const floatingCallElem = document.getElementById('floatingCall');
            if (fullscreenCall) fullscreenCall.style.display = 'none';
            if (floatingCallElem) floatingCallElem.style.display = 'flex';
            // Синхронизируем состояние микрофона и камеры с плавающими кнопками
            const micEnabled = localStream?.getAudioTracks()[0]?.enabled ?? true;
            const camEnabled = localStream?.getVideoTracks()[0]?.enabled ?? true;
            const floatingMicBtn = document.getElementById('floatingMicCallBtn');
            const floatingCamBtn = document.getElementById('floatingCamCallBtn');
            if (floatingMicBtn) {
                floatingMicBtn.innerHTML = micEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
                floatingMicBtn.classList.toggle('muted', !micEnabled);
            }
            if (floatingCamBtn) {
                floatingCamBtn.innerHTML = camEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
                floatingCamBtn.classList.toggle('muted', !camEnabled);
            }
            // Переносим видео в мини-окно уже происходит через ontrack, но на всякий случай продублируем
            const remoteVideoElem = document.getElementById('remoteVideo');
            const floatingRemoteVideoElem = document.getElementById('floatingRemoteVideo');
            if (remoteVideoElem && remoteVideoElem.srcObject && floatingRemoteVideoElem && floatingRemoteVideoElem.srcObject !== remoteVideoElem.srcObject) {
                floatingRemoteVideoElem.srcObject = remoteVideoElem.srcObject;
            }
        }

        function restoreCall() {
            const fullscreenCall = document.getElementById('callContainer');
            const floatingCallElem = document.getElementById('floatingCall');
            if (fullscreenCall) fullscreenCall.style.display = 'flex';
            if (floatingCallElem) floatingCallElem.style.display = 'none';
            // Возвращаем видео обратно
            const remoteVideoElem = document.getElementById('remoteVideo');
            const floatingRemoteVideoElem = document.getElementById('floatingRemoteVideo');
            if (floatingRemoteVideoElem && floatingRemoteVideoElem.srcObject && remoteVideoElem && remoteVideoElem.srcObject !== floatingRemoteVideoElem.srcObject) {
                remoteVideoElem.srcObject = floatingRemoteVideoElem.srcObject;
            }
        }

        socket.off('ice-candidate');

        socket.on('answer', async (data) => {

        // ======================= СОКЕТ =======================
        function initSocket() {
            if (socket) { socket.disconnect(); socket = null; }
            socket = io({
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000
            });
            socket.on('connect', () => { console.log('Socket connected'); if (currentUser) socket.emit('register_user', currentUser.id); });
            socket.on('connect_error', (err) => { console.error('Socket connect error:', err.message); showToast('Ошибка соединения с сервером', true); });
            socket.on('post_created', (newPost) => {
                if (currentTab === 'feed') renderFeed();
                else if (currentTab === 'profile' && currentUser?.role === 'psychologist') renderProfile();
            });
            socket.on('post_updated', (data) => {
                if (currentTab === 'feed') renderFeed();
                else if (currentTab === 'profile') renderProfile();
            });
            socket.on('post_deleted', (postId) => {
                if (currentTab === 'feed') renderFeed();
                else if (currentTab === 'profile') renderProfile();
            });
            socket.on('comment_created', ({ postId, comment }) => {
                const commentsDiv = document.getElementById(`comments-${postId}`);
                if (commentsDiv) {
                    const commentsList = commentsDiv.querySelector('.comments-list');

                                </div>

                        `;

                        if (emptyState) emptyState.remove();
                        commentsList.insertAdjacentHTML('beforeend', newHtml);
                        const commentSpan = document.querySelector(`.comment-toggle[data-id="${postId}"] span`);
                        if (commentSpan) commentSpan.textContent = (parseInt(commentSpan.textContent) || 0) + 1;
                        const post = feedPosts.find(p => p.id === postId);
                        if (post) post.commentsCount = (post.commentsCount || 0) + 1;
                    }
                } else if (currentTab === 'feed') renderFeed();
            });
            socket.on('post_liked', ({ postId, likesCount, userId, liked }) => {

                let preview = '';
                if (msg.text) preview = msg.text.substring(0, 50);

                else if (msg.voice) preview = '🎤 Голосовое';
                else preview = 'Вложение';
                if (currentChatPartner && msg.from === currentChatPartner.id) {
                    appendMessageToChat(msg);
                    scrollToBottom();
                    await fetch('/api/messages/read', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentUser.id, fromUserId: msg.from })
                    }).catch(console.error);
                    if (currentUser.unreadCounts) delete currentUser.unreadCounts[msg.from];
                    updateChatListUnread(msg.from, 0);
                    return;
                }
                if (currentUser && currentUser.unreadCounts) {
                    currentUser.unreadCounts[msg.from] = (currentUser.unreadCounts[msg.from] || 0) + 1;
                }
                fetch(`/api/user/${msg.from}`)
                    .then(r => r.json())
                    .then(userData => {
                        const senderName = userData.success ? userData.user.fullName : 'Новое сообщение';
                        showFloatingNotification('Новое сообщение', `${senderName}: ${preview}`);
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification('Новое сообщение', { body: `${senderName}: ${preview}` });
                        }
                        if (!currentChatPartner && currentTab === 'chats') {
                            renderChats();
                        } else if (!currentChatPartner) {
                            const chatListExists = document.querySelector('.chat-list');
                            if (chatListExists) {
                                updateChatListItem(msg, senderName, preview);
                            }
                        }
                    })
                    .catch(console.error);
            });
            socket.on('notification', (notif) => {
                showFloatingNotification(notif.title, notif.message);
                if (currentUser) refreshUser();
                if (currentTab === 'notifications') renderNotifications();
            });
            socket.on('unread_update', (data) => {
                if (currentUser && data.from && data.count !== undefined) {
                    if (!currentUser.unreadCounts) currentUser.unreadCounts = {};
                    currentUser.unreadCounts[data.from] = data.count;
                    if (!currentChatPartner && currentTab === 'chats') {
                        renderChats();
                    } else if (!currentChatPartner) {
                        updateChatListUnread(data.from, data.count);
                    }
                }
            });
        }

        // ======================= ЧАТ (существующий) =======================
        async function renderChats() {
            currentChatPartner = null;
            if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
            await refreshUser();
            document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;
            const messagesRes = await fetchJSON(`/api/messages/${currentUser.id}`);
            const messages = messagesRes.messages || [];
            const usersFromServer = messagesRes.users || [];
            const contactsMap = new Map();
            const unreadCountsFromServer = currentUser.unreadCounts || {};
            messages.forEach(msg => {
                const contactId = msg.from_user === currentUser.id ? msg.to_user : msg.from_user;
                if (!contactsMap.has(contactId)) {
                    contactsMap.set(contactId, { lastMessage: msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение')), lastTime: msg.created_at });
                } else {
                    const existing = contactsMap.get(contactId);
                    if (new Date(msg.created_at) > new Date(existing.lastTime)) {
                        existing.lastMessage = msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение'));
                        existing.lastTime = msg.created_at;
                    }
                }
            });
            const contacts = usersFromServer.map(u => {
                const contactInfo = contactsMap.get(u.id) || { lastMessage: '', lastTime: new Date(0).toISOString() };
                const unread = unreadCountsFromServer[u.id] || 0;
                return { ...u, ...contactInfo, unread };
            }).sort((a,b) => new Date(b.lastTime) - new Date(a.lastTime));
            let html = `<div class="container"><div class="page-title">Сообщения</div><div class="chat-list">`;
            for (const c of contacts) {
                html += `<div class="chat-contact glass-card" data-contact-id="${c.id}" onclick="openChat('${c.id}','${escapeHtml(c.fullName)}')">
                            <img class="chat-contact-avatar" src="${escapeHtml(c.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.fullName)}&background=8bca8b&color=fff'">
                            <div class="chat-contact-info">
                                <div class="chat-contact-name">${escapeHtml(c.fullName)}</div>
                                <div class="chat-contact-last">${escapeHtml((c.lastMessage || '').substring(0, 40))}</div>
                            </div>
                            ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
                        </div>`;
            }
            if (contacts.length === 0) html += '<div class="empty-state glass-card" style="padding:40px;"><i class="fas fa-comment-slash"></i><div>Нет сообщений. Напишите психологу из раздела «Психологи»!</div></div>';
            html += `</div></div>`;
            document.getElementById('mainContent').innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function openChat(userId, userName) {
            currentChatPartner = { id: userId, name: userName };
            await fetch('/api/messages/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, fromUserId: userId }) });
            if (currentUser.unreadCounts && currentUser.unreadCounts[userId]) delete currentUser.unreadCounts[userId];
            if (currentTab === 'chats') {
                const chatItems = document.querySelectorAll('.chat-contact');
                for (const item of chatItems) {
                    if (item.getAttribute('data-contact-id') === userId) { const badge = item.querySelector('.unread-badge'); if (badge) badge.remove(); break; }
                }
            }
            document.getElementById('mainContent').innerHTML = `
                <div class="chat-page">
                    <div class="chat-messages-container">
                        <div class="chat-messages-header">
                            <button class="back-btn" onclick="renderChats()"><i class="fas fa-arrow-left"></i></button>
                            <img src="" id="chatPartnerAvatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--green-border);" onerror="this.style.display='none'">
                            <div style="flex:1"><div style="font-weight:600;font-size:15px;">${escapeHtml(userName)}</div></div>
                        </div>
                        <div class="chat-messages-list" id="chatMessagesList"></div>
                        <div class="chat-input-area">
                            <div class="chat-controls">
                                <button id="attachImageBtn" title="Фото"><i class="fas fa-image"></i></button>
                                <button id="voiceRecordBtn" title="Голосовое"><i class="fas fa-microphone"></i></button>
                            </div>
                            <input type="file" id="imageInput" accept="image/*" style="display:none">
                            <input type="text" id="chatMessageInput" placeholder="Сообщение...">
                            <button class="send-btn-chat" id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>`;
            await new Promise(resolve => setTimeout(resolve, 10));
            fetch(`/api/user/${userId}`).then(r => r.json()).then(d => { const av = document.getElementById('chatPartnerAvatar'); if (av && d.success) av.src = d.user.avatar; }).catch(console.error);
            await loadChatMessages();
            scrollToBottom();
            const sendBtn = document.getElementById('sendMsgBtn');
            const chatInput = document.getElementById('chatMessageInput');
            const attachBtn = document.getElementById('attachImageBtn');
            const imageInput = document.getElementById('imageInput');
            const voiceBtn = document.getElementById('voiceRecordBtn');
            if (sendBtn) sendBtn.onclick = sendChatMessage;
            if (chatInput) chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendChatMessage(); };
            if (attachBtn && imageInput) {
                attachBtn.onclick = () => imageInput.click();
                imageInput.onchange = async () => {
                    const file = imageInput.files[0];
                    if (!file || !file.type.startsWith('image/')) { showToast('Только изображения', true); return; }
                    const compressedBlob = await compressImage(file, 1024, 0.8);
                    const formData = new FormData();
                    formData.append('image', compressedBlob, file.name);
                    const res = await fetch('/api/upload-chat-image', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', image: data.imageUrl }) });
                        await loadChatMessages();
                        scrollToBottom();
                    }
                    imageInput.value = '';
                };
            }
            if (voiceBtn) {
                let mediaRecorder = null, audioChunks = [], isRecording = false;
                voiceBtn.onclick = async () => {
                    if (!isRecording) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                            audioChunks = [];
                            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                            mediaRecorder.onstop = async () => {
                                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                                const fd = new FormData();
                                fd.append('voice', blob, 'voice.webm');
                                const res = await fetch('/api/upload-voice', { method: 'POST', body: fd });
                                const data = await res.json();
                                if (data.success) {
                                    await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', voice: data.voiceUrl }) });
                                    await loadChatMessages();
                                    scrollToBottom();
                                    showToast('Голосовое отправлено');
                                }
                                stream.getTracks().forEach(t => t.stop());
                                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                                voiceBtn.classList.remove('recording-active');
                                isRecording = false;
                            };
                            mediaRecorder.start();
                            isRecording = true;
                            voiceBtn.classList.add('recording-active');
                            voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
                            setTimeout(() => { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); }, 30000);
                        } catch(e) { showToast('Нет доступа к микрофону', true); }
                    } else { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); }
                };
            }
        }

        async function loadChatMessages() {
            if (!currentChatPartner) return;
            const res = await fetchJSON(`/api/messages/${currentUser.id}`);
            const messages = (res.messages || []).filter(m => (m.from_user === currentChatPartner.id && m.to_user === currentUser.id) || (m.from_user === currentUser.id && m.to_user === currentChatPartner.id));
            messages.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
            const listDiv = document.getElementById('chatMessagesList');
            if (!listDiv) return;
            let html = '';
            for (const m of messages) {
                let voiceHtml = '';
                if (m.voice) voiceHtml = `<div class="voice-message"><audio controls src="${escapeHtml(m.voice)}"></audio></div>`;
                const isOutgoing = m.from_user === currentUser.id;
                html += `<div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                            ${m.text ? `<div class="message-text">${escapeHtml(m.text)}</div>` : ''}
                            ${m.image ? `<img class="chat-image" src="${escapeHtml(m.image)}" onclick="openImageModal('${escapeHtml(m.image)}')">` : ''}
                            ${voiceHtml}
                            <div class="message-time">${new Date(m.created_at).toLocaleTimeString()}</div>
                        </div>`;
            }
            listDiv.innerHTML = html;
            document.querySelectorAll('.voice-message').forEach(container => {
                const audio = container.querySelector('audio');
                if (audio && !container.querySelector('.speed-btn')) addSpeedButtonToAudio(audio);
            });
            scrollToBottom();
        }

        function addSpeedButtonToAudio(audio) {
            const container = audio.closest('.voice-message');
            if (!container || container.querySelector('.speed-btn')) return;
            const speeds = [1, 1.5, 2];
            let currentSpeed = 1;
            const btn = document.createElement('button');
            btn.className = 'speed-btn';
            btn.textContent = `${currentSpeed}x`;
            btn.onclick = (e) => {
                e.stopPropagation();
                let idx = speeds.indexOf(currentSpeed);
                idx = (idx + 1) % speeds.length;
                currentSpeed = speeds[idx];
                audio.playbackRate = currentSpeed;
                btn.textContent = `${currentSpeed}x`;
            };
            container.appendChild(btn);
        }

        function updateChatListUnread(contactId, count) {
            const chatItems = document.querySelectorAll('.chat-contact');
            for (const item of chatItems) {
                if (item.getAttribute('data-contact-id') === contactId) {
                    const existingBadge = item.querySelector('.unread-badge');
                    if (count > 0) {
                        if (existingBadge) existingBadge.textContent = count;
                        else item.insertAdjacentHTML('beforeend', `<div class="unread-badge">${count}</div>`);
                    } else { if (existingBadge) existingBadge.remove(); }
                    break;
                }
            }
        }

        function updateChatListItem(msg, senderName, preview) {
            const contactDiv = document.querySelector(`.chat-contact[data-contact-id="${msg.from}"]`);
            if (!contactDiv) return;
            const lastMsgSpan = contactDiv.querySelector('.chat-contact-last');
            if (lastMsgSpan) lastMsgSpan.textContent = preview.length > 40 ? preview.substring(0,37)+'...' : preview;
            let badge = contactDiv.querySelector('.unread-badge');
            const currentCount = currentUser?.unreadCounts?.[msg.from] || 0;
            if (currentCount > 0) {
                if (badge) badge.textContent = currentCount;
                else contactDiv.insertAdjacentHTML('beforeend', `<div class="unread-badge">${currentCount}</div>`);
            } else { if (badge) badge.remove(); }
            const parent = contactDiv.parentNode;
            parent.insertBefore(contactDiv, parent.firstChild);
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatMessageInput');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            input.value = '';
            const tempMsg = { id: Date.now().toString(), from: currentUser.id, to: currentChatPartner.id, text, created_at: new Date().toISOString() };
            appendMessageToChat(tempMsg);
            try {
                await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text }) });
            } catch(e) { showToast('Ошибка отправки', true); }
            scrollToBottom();
        }

        function appendMessageToChat(msg) {
            const listDiv = document.getElementById('chatMessagesList');
            if (!listDiv) return;
            const fromId = msg.from_user || msg.from;
            const isOutgoing = fromId === currentUser.id;
            let voiceHtml = '';
            if (msg.voice) voiceHtml = `<div class="voice-message"><audio controls src="${escapeHtml(msg.voice)}"></audio></div>`;
            const messageHtml = `<div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">${msg.text ? `<div class="message-text">${escapeHtml(msg.text)}</div>` : ''}${msg.image ? `<img class="chat-image" src="${escapeHtml(msg.image)}" onclick="openImageModal('${escapeHtml(msg.image)}')">` : ''}${voiceHtml}<div class="message-time">${new Date(msg.created_at || msg.createdAt || Date.now()).toLocaleTimeString()}</div></div>`;
            listDiv.insertAdjacentHTML('beforeend', messageHtml);
            scrollToBottom();
            if (msg.voice) {
                const audio = listDiv.querySelector('.voice-message:last-child audio');
                if (audio && !audio.parentElement.querySelector('.speed-btn')) addSpeedButtonToAudio(audio);
            }
        }

        function startChatWith(userId, name) {
            if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
            currentTab = 'chats';
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const chatNav = document.querySelector('.nav-item[data-tab="chats"]');
            if (chatNav) chatNav.classList.add('active');
            openChat(userId, name);
        }

        // ======================= ВИДЕО НАБЛЮДАТЕЛЬ =======================
        function initVideoObservers() {
            if (videoObserver) videoObserver.disconnect();
            const videos = document.querySelectorAll('.post-video');
            if (videos.length === 0) return;
            videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play().catch(e => console.log('Автовоспроизведение заблокировано', e));
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.5 });
            videos.forEach(video => videoObserver.observe(video));
        }

        // ======================= НАВИГАЦИЯ =======================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const act = document.querySelector(`.nav-item[data-tab="${tab}"]`);
            if (act) act.classList.add('active');
            if (tab === 'feed') renderFeed();
            else if (tab === 'psychologists') renderPsychologistsList();
            else if (tab === 'chats') {
                refreshUser().then(() => renderChats());
            }
            else if (tab === 'notifications') renderNotifications();
            else if (tab === 'profile') renderProfile();
        }

        // ======================= ЗАПРОС УВЕДОМЛЕНИЙ =======================
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
        }

        function makeDraggable(element) {
    let startX, startY, startLeft, startTop, isDragging = false;
    const header = element.querySelector('.floating-header');
    if (!header) return;
    const onStart = (e) => {
        // Не перетаскиваем, если клик на кнопке (в том числе на кнопке восстановления)
        if (e.target.closest('.floating-controls button') || e.target.closest('#restoreCallBtn')) return;
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX;
        startY = touch.clientY;
        const rect = element.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        isDragging = true;
        element.classList.add('dragging');
    };
    const onMove = (e) => {
        if (!isDragging) return;
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        let newLeft = startLeft + dx;
        let newTop = startTop + dy;
        newLeft = Math.min(window.innerWidth - element.offsetWidth, Math.max(0, newLeft));
        newTop = Math.min(window.innerHeight - element.offsetHeight, Math.max(0, newTop));
        element.style.left = newLeft + 'px';
        element.style.top = newTop + 'px';
        element.style.right = 'auto';
        element.style.bottom = 'auto';
    };
    const onEnd = () => { isDragging = false; element.classList.remove('dragging'); };
    header.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    header.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onEnd);
}

        // ======================= ИНИЦИАЛИЗАЦИЯ =======================
        async function init() {
            const uid = localStorage.getItem('userId');
            if (uid) {
                try {
                    const r = await fetch(`/api/user/${uid}`);
                    const d = await r.json();
                    if (d.success) {
                        currentUser = d.user;
                        document.getElementById('navAuth').style.display = 'none';
                        document.getElementById('navUser').style.display = 'flex';
                        document.getElementById('bottomNav').style.display = 'flex';
                        await fetchJSON('/api/psychologists').then(d => { allPsychologists = d.psychologists || []; });
                        document.getElementById('searchNavBtn').onclick = openSearchModal;
                        initSocket();
                        requestNotificationPermission();
                        checkUpcomingEvents();
                        setInterval(checkUpcomingEvents, 900000);
                        switchTab('feed');
                    } else { localStorage.clear(); renderFeed(); }
                } catch(e) { localStorage.clear(); renderFeed(); }
            } else {
                renderFeed();
            }
            document.querySelectorAll('.nav-item').forEach(el => { el.onclick = () => switchTab(el.dataset.tab); });
            const floatingCallElem = document.getElementById('floatingCall');
            if (floatingCallElem) makeDraggable(floatingCallElem);
        }

        // Глобальные привязки функций (сохраняем старые, добавляем новые)
        window.openLoginModal = openLoginModal;
        window.openRegisterModal = openRegisterModal;
        window.logout = logout;
        window.switchTab = switchTab;
        window.viewPsychologistPage = viewPsychologistPage;
        window.startChatWith = startChatWith;
        window.bookPsychologist = bookPsychologist;
        window.openReviewModal = openReviewModal;
        window.confirmAppointment = confirmAppointment;
        window.startCall = startCallInWindow; // переопределён
        window.addComment = addComment;
        window.closeModal = closeModal;
        window.toggleSection = toggleSection;
        window.openImageModal = openImageModal;
        window.editProfileModal = editProfileModal;
        window.changeAvatar = changeAvatar;
        window.showScheduleEditor = showScheduleEditor;
        window.createPostModal = createPostModal;
        window.addTaskWithDate = addTaskWithDate;
        window.deleteTask = deleteTask;
        window.openAddNoteModal = openAddNoteModal;
        window.saveNote = saveNote;
        window.openNoteModal = openNoteModal;
        window.updateNote = updateNote;
        window.deleteNote = deleteNote;
        window.addCertificateProfile = addCertificateProfile;
        window.deleteCertificateProfile = deleteCertificateProfile;
        window.saveEditPost = saveEditPost;
        window.saveProfileEdit = saveProfileEdit;
        window.renderProfileCalendar = renderProfileCalendar;
        window.changeProfileMonth = changeProfileMonth;
        window.confirmAppointmentFromNotif = confirmAppointmentFromNotif;

        init();

    </script>
