function openAddClientProgressModal(clientId) {
    const modalId = 'addProgressModal_' + Date.now();
    const html = `
        <div class="modal" id="${modalId}" style="z-index: 2500;">
            <div class="modal-content">
                <div class="modal-handle"></div>
                <h3>Отметить прогресс</h3>
                
                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Что оцениваем?</label>
                <select id="scaleType_${modalId}" style="width: 100%; margin-bottom: 12px;" onchange="updateScaleHint('${modalId}')">
                    <option value="standard">Общее состояние (1-10 баллов)</option>
                    <option value="beck_dep">Депрессия (Шкала Бека, 0-63)</option>
                    <option value="beck_anx">Тревога (Шкала Бека, 0-63)</option>
                </select>

                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Набранный балл:</label>
                <input type="number" id="scaleScore_${modalId}" placeholder="Введите балл..." style="width: 100%; margin-bottom: 4px;">
                <div id="scaleHint_${modalId}" style="font-size: 11px; color: var(--green); margin-bottom: 12px; min-height: 14px;">Введите от 1 до 10</div>

                <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Комментарий / Диагноз:</label>
                <textarea id="scaleNote_${modalId}" rows="2" placeholder="Например: Улучшился сон..." style="width: 100%; margin-bottom: 12px;"></textarea>

                <div class="modal-buttons">
                    <button class="btn-secondary" onclick="closeModal('${modalId}')">Отмена</button>
                    <button class="btn-primary" onclick="submitClientProgress('${clientId}', '${modalId}')">Сохранить</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
    setTimeout(() => document.getElementById(modalId).classList.add('active'), 10);
}

window.updateScaleHint = function(modalId) {
    const type = document.getElementById(`scaleType_${modalId}`).value;
    const hint = document.getElementById(`scaleHint_${modalId}`);
    if (type === 'standard') hint.textContent = 'Введите от 1 до 10 (где 10 - отлично)';
    else if (type === 'beck_dep') hint.textContent = '0-13 (Норма), 14-19 (Легкая), 20-28 (Умеренная), 29-63 (Тяжелая)';
    else if (type === 'beck_anx') hint.textContent = '0-7 (Норма), 8-15 (Слабая), 16-25 (Умеренная), 26-63 (Тяжелая)';
};

// 5. ОТПРАВКА ПРОГРЕССА
async function submitClientProgress(clientId, modalId) {
    const type = document.getElementById(`scaleType_${modalId}`).value;
    const scoreRaw = parseInt(document.getElementById(`scaleScore_${modalId}`).value);
    const userNote = document.getElementById(`scaleNote_${modalId}`).value.trim();

    if (isNaN(scoreRaw)) { showToast('Введите корректный балл', true); return; }

    let severity10 = 5; 
    let finalNoteText = '';

    if (type === 'standard') {
        if (scoreRaw < 1 || scoreRaw > 10) { showToast('Введите от 1 до 10', true); return; }
        severity10 = scoreRaw;
        finalNoteText = userNote;
    } 
    else if (type === 'beck_dep') {
        if (scoreRaw < 0 || scoreRaw > 63) { showToast('Балл Бека должен быть от 0 до 63', true); return; }
        if (scoreRaw <= 13) { severity10 = 9; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Норма). `; }
        else if (scoreRaw <= 19) { severity10 = 6; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Легкая депрессия). `; }
        else if (scoreRaw <= 28) { severity10 = 4; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Умеренная депрессия). `; }
        else { severity10 = 2; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Тяжелая депрессия). `; }
        finalNoteText += userNote;
    }
    else if (type === 'beck_anx') {
        if (scoreRaw < 0 || scoreRaw > 63) { showToast('Балл Бека должен быть от 0 до 63', true); return; }
        if (scoreRaw <= 7) { severity10 = 9; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Норма). `; }
        else if (scoreRaw <= 15) { severity10 = 6; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Слабая тревога). `; }
        else if (scoreRaw <= 25) { severity10 = 4; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Умеренная тревога). `; }
        else { severity10 = 2; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Тяжелая тревога). `; }
        finalNoteText += userNote;
    }

    const data = await fetchJSON('/api/client-progress', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ psychologistId: currentUser.id, clientId, value: severity10, type: 'psychologist', notes: finalNoteText.trim() })
    });

    if (data.success) {
        showToast('Прогресс зафиксирован');
        closeModal(modalId);
        closeModal(window.currentClientCardModalId);
        setTimeout(() => openClientCardInCall(), 350);
    } else {
        showToast('Ошибка сохранения', true);
    }

                <div id="dossierHwList" style="margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; width: 100%;">
                    ${homeworks.map(h => `
                        <div style="display: flex; flex-direction: row; gap: 12px; align-items: flex-start; padding: 12px 14px; background: rgba(255,255,255,0.04); border-radius: 16px; border: 1px solid rgba(255,255,255,0.07); width: 100%; box-sizing: border-box;">
                            <input type="checkbox" ${h.status === 'done' ? 'checked' : ''} disabled style="flex-shrink: 0; margin-top: 2px; width: 18px; height: 18px; accent-color: #8bca8b;">
                            <div style="flex: 1; min-width: 0; text-align: left;">
                                <div style="word-break: break-word; white-space: pre-wrap; font-size: 13.5px; line-height: 1.4; color: #fff; margin: 0;">${escapeHtml(h.text)}</div>${h.due_date ? `<div style="color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 4px;">до ${h.due_date.split('T')[0]}</div>` : ''}
                            </div>
                        </div>
                    `).join('') || '<div style="font-size:12px; color:rgba(255,255,255,0.45);">Нет заданий</div>'}
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h4 style="margin: 0;"><i class="fas fa-sticky-note"></i> Заметки</h4>
                    <button class="btn-sm btn-outline" style="padding: 4px 8px;" onclick="openAddClientNoteModal('${client.id}', '${escapeHtml(client.fullName).replace(/'/g, "\\'")}')"><i class="fas fa-plus"></i></button>
                </div>
                <div id="dossierNotesList" style="margin-bottom: 16px;">
                    ${notes.map(n => `
                        <div class="glass-card" style="padding: 10px; margin-bottom: 8px; font-size: 13px; overflow-wrap: break-word; word-break: break-word; white-space: pre-wrap; line-height: 1.4;">
                            <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px;">
                                <div style="font-weight: 600; color: #fff; font-size: 14px;">${escapeHtml(n.note.split('\n')[0])}</div>
                                <small style="color: rgba(255,255,255,0.6); font-size: 10.5px;">${new Date(n.created_at).toLocaleDateString()}</small>
                            </div>
                            ${escapeHtml(n.note.split('\n').slice(1).join('\n')).trim()}
                            ${n.note.includes('[Прикреплен файл]: ') ? `
                                <a href="${escapeHtml(n.note.match(/\[Прикреплен файл\]: (https?:\/\/[^\s]+)/)[1])}" target="_blank" class="note-attachment-link">
                                    <i class="fas fa-paperclip"></i> Просмотреть прикрепленный файл
                                </a>
                            ` : ''}
                        </div>
                    `).join('') || '<div style="font-size:12px; color:var(--text-muted);">Нет заметок</div>'}
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h4 style="margin: 0;"><i class="fas fa-chart-line"></i> Прогресс</h4>
                    <button class="btn-sm btn-outline" style="padding: 4px 8px;" onclick="openAddClientProgressModal('${client.id}')"><i class="fas fa-plus"></i></button>
                </div>
                <div id="dossierProgressList">
                    ${progress.map(p => `
                        <div style="font-size:12px; margin-bottom:6px; padding:8px; background:rgba(139,202,139,0.05); border-radius:8px; overflow-wrap: break-word; word-break: break-word;">
                            <strong>${p.date.split('T')[0]}</strong> — Состояние: ${p.value}/10
                            <div style="color:rgba(255,255,255,0.6); margin-top:2px;">${escapeHtml(p.notes || '')}</div>
                        </div>
                    `).join('') || '<div style="font-size:12px; color:var(--text-muted);">Данных нет</div>'}
                </div>

                <div class="modal-buttons" style="margin-top:24px;">
                    <button class="btn-primary" style="width:100%;" onclick="closeModal('${modalId}')">Готово</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
    setTimeout(() => document.getElementById(modalId).classList.add('active'), 10);
}
        
        // ======================= ИНИЦИАЛИЗАЦИЯ =======================
        async function init() {
            const token = localStorage.getItem('token');
            const uid = localStorage.getItem('userId');
            if (token && uid) {
                try {
                    const userData = await fetchJSON(`/api/user/${uid}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (userData.success) {
                        currentUser = userData.user;
                        document.getElementById('navAuth').style.display = 'none';
                        document.getElementById('navUser').style.display = 'flex';
                        document.getElementById('bottomNav').style.display = 'flex';
                        const questionnairesNav = document.getElementById('questionnairesNavItem');
                        if (questionnairesNav) questionnairesNav.style.display = currentUser.role === 'client' ? 'flex' : 'none';
                        await fetchJSON('/api/psychologists').then(d => { allPsychologists = d.psychologists || []; });
                        document.getElementById('searchNavBtn').onclick = openSearchModal;
                        initSocket();
                        requestNotificationPermission();
                        checkUpcomingEvents();
                        setInterval(checkUpcomingEvents, 900000);
                        switchTab('feed');
                    } else {
                        localStorage.clear();
                        renderFeed();
                    }
                } catch(e) {
                    localStorage.clear();
                    renderFeed();
                }
            } else {
                renderFeed();
            }
            document.querySelectorAll('.nav-item').forEach(el => { el.onclick = () => switchTab(el.dataset.tab); });
            const floatingCallElem = document.getElementById('floatingCall');
            if (floatingCallElem) makeDraggable(floatingCallElem);
        }
        
        // ======================= ГЛОБАЛЬНЫЕ ПРИВЯЗКИ =======================
        window.openLoginModal = openLoginModal;
        window.openRegisterModal = openRegisterModal;
        window.logout = logout;
        window.switchTab = switchTab;
        window.viewPsychologistPage = viewPsychologistPage;
        window.startChatWith = startChatWith;
        window.bookPsychologist = bookPsychologist;
        window.openReviewModal = openReviewModal;
        window.confirmAppointment = confirmAppointment;
        window.startCall = startCallInWindow;
        window.addComment = addComment;
        window.closeModal = closeModal;
        window.toggleSection = toggleSection;
        window.openImageModal = openImageModal;
        window.editProfileModal = editProfileModal;
        window.changeAvatar = changeAvatar;
        window.showScheduleEditor = showScheduleEditor;
        window.createPostModal = createPostModal;
        window.addTaskWithDate = addTaskWithDate;
        window.deleteTask = deleteTask;
        window.openAddNoteModal = openAddNoteModal;
        window.saveNote = saveNote;
        window.openNoteModal = openNoteModal;
        window.updateNote = updateNote;
        window.deleteNote = deleteNote;
        window.addCertificateProfile = addCertificateProfile;
        window.deleteCertificateProfile = deleteCertificateProfile;
        window.saveEditPost = saveEditPost;
        window.saveProfileEdit = saveProfileEdit;
        window.renderProfileCalendar = renderProfileCalendar;
        window.changeProfileMonth = changeProfileMonth;
        window.confirmAppointmentFromNotif = confirmAppointmentFromNotif;
        window.openReviewModalWithAppointment = openReviewModalWithAppointment;
        window.submitReviewWithAppointment = submitReviewWithAppointment;
        window.editReviewModal = editReviewModal;
        window.updateReview = updateReview;
        window.deleteReview = deleteReview;
        window.createQuestionnaire = createQuestionnaire;
        window.startQuestionnaire = startQuestionnaire;
        window.viewQuestionnaireResponses = viewQuestionnaireResponses;
        window.renderResponsesModal = renderResponsesModal;
        window.togglePublishQuestionnaire = togglePublishQuestionnaire;
        
        init();
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch(err => console.error('Service Worker registration failed:', err));
        }
    </script>
