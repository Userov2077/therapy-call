<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Therapy Call | Сообщество психологов</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ------------------- БАЗОВЫЕ ПЕРЕМЕННЫЕ ------------------- */
        :root {
            --green: #8bca8b;
            --green-dark: #5a9e5a;
            --green-dim: rgba(139, 202, 139, 0.15);
            --green-border: rgba(139, 202, 139, 0.25);
            --glass: rgba(20, 26, 22, 0.65);
            --glass-hover: rgba(28, 36, 30, 0.82);
            --border: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(139, 202, 139, 0.28);
            --text-muted: rgba(255,255,255,0.45);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --nav-h: 62px;
            --bottom-h: 68px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: #050a06;
            color: #fff;
            overflow-x: hidden;
            padding-bottom: calc(var(--bottom-h) + env(safe-area-inset-bottom));
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0a1f0a, #020804);
        }
        /* Navbar */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
            background: rgba(4,10,5,0.78); backdrop-filter: blur(28px) saturate(1.6);
            z-index: 1000; padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
        .logo-icon { font-size: 22px; filter: drop-shadow(0 0 8px rgba(139,202,139,0.5)); }
        .auth-buttons { display: flex; gap: 8px; }
        .btn-login { padding: 7px 18px; border-radius: 30px; font-weight: 500; font-size: 13px; cursor: pointer; background: transparent; border: 1px solid var(--green-border); color: white; transition: all 0.22s; }
        .btn-login:hover { background: var(--green-dim); }
        .btn-register { padding: 7px 18px; border-radius: 30px; font-weight: 600; font-size: 13px; cursor: pointer; background: linear-gradient(135deg, var(--green), var(--green-dark)); border: none; color: #0d2010; }
        .btn-register:hover { opacity: 0.88; transform: scale(1.02); }
        .btn-logout { padding: 7px 16px; border-radius: 30px; font-weight: 600; font-size: 13px; cursor: pointer; background: rgba(220,38,38,0.18); border: 1px solid rgba(220,38,38,0.35); color: #ff6b6b; }
        .btn-logout:hover { background: rgba(220,38,38,0.32); }
        .search-btn { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; color: rgba(255,255,255,0.75); font-size: 15px; cursor: pointer; margin-right: 8px; }
        .search-btn:hover { background: var(--green-dim); color: var(--green); }
        #navUser { display: flex; align-items: center; gap: 2px; }
        .main-content { padding-top: calc(var(--nav-h) + 12px); min-height: 100vh; }
        .container { max-width: 680px; margin: 0 auto; padding: 0 16px; }
        /* Bottom navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(4,10,5,0.95); backdrop-filter: blur(28px);
            display: flex; justify-content: space-around; align-items: center;
            padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            z-index: 1000; height: auto; min-height: var(--bottom-h);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--text-muted); cursor: pointer; transition: all 0.22s;
            padding: 6px 14px; border-radius: 16px; min-width: 50px;
        }
        .nav-item i { font-size: 21px; transition: transform 0.2s; }
        .nav-item span { font-size: 9.5px; font-weight: 500; }
        .nav-item.active { color: var(--green); background: var(--green-dim); }
        .nav-item.active i { transform: scale(1.1); }
        /* Карточки и кнопки */
        .glass-card { background: var(--glass); backdrop-filter: blur(22px) saturate(1.4); border: 1px solid var(--border); border-radius: var(--radius-lg); transition: all 0.28s; }
        .glass-card:hover { background: var(--glass-hover); border-color: var(--border-hover); }
        .btn-sm { padding: 8px 18px; font-size: 13px; border-radius: 30px; background: linear-gradient(135deg, var(--green), var(--green-dark)); border: none; color: #0d2010; cursor: pointer; font-weight: 600; transition: all 0.22s; white-space: nowrap; }
        .btn-sm:hover { opacity: 0.88; transform: scale(1.02); }
        .btn-outline { background: transparent !important; border: 1px solid var(--green-border) !important; color: rgba(255,255,255,0.85) !important; }
        .btn-outline:hover { background: var(--green-dim) !important; color: var(--green) !important; }
        .btn-danger { background: rgba(220,38,38,0.2) !important; border: 1px solid rgba(220,38,38,0.35) !important; color: #ff6b6b !important; }
        .btn-danger:hover { background: rgba(220,38,38,0.35) !important; }
        /* Лента */
        .posts-grid { display: flex; flex-direction: column; gap: 14px; }
        .post-card { padding: 18px; }
        .post-header { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
        .post-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid var(--green-border); }
        .post-author { font-weight: 600; font-size: 14.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .post-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .post-text { margin-bottom: 12px; line-height: 1.6; font-size: 14px; color: rgba(255,255,255,0.88); }
        .post-image { max-width: 100%; border-radius: var(--radius-md); margin-bottom: 12px; cursor: pointer; display: block; }
        .post-video { max-width: 100%; border-radius: var(--radius-md); margin-bottom: 12px; cursor: pointer; background: #000; }
        .post-stats { display: flex; gap: 18px; padding: 10px 0; border-top: 1px solid var(--border); }
        .post-stats button { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 2px 6px; border-radius: 8px; }
        .post-stats button:hover { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.05); }
        .post-stats button.liked { color: var(--green); }
        .post-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .post-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 4px 10px; border-radius: 8px; }
        .post-actions button:hover { background: rgba(255,255,255,0.07); color: white; }
        .rating-stars { color: #f5c518; font-size: 11px; letter-spacing: -1px; display: inline-flex; gap: 1px; }
        /* Комментарии */
        .comments-section { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
        .comment { display: flex; gap: 10px; margin-bottom: 10px; position: relative; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .comment-content { background: rgba(255,255,255,0.05); border-radius: var(--radius-sm); padding: 8px 12px; flex: 1; }
        .comment-author { font-weight: 600; font-size: 12px; margin-bottom: 2px; color: var(--green); }
        .comment-text { font-size: 13px; color: rgba(255,255,255,0.82); line-height: 1.4; }
        .comment-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
        .comment-actions { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); padding: 4px 8px; border-radius: 20px; z-index: 2; }
        .comment-actions button { background: rgba(139,202,139,0.2); border: none; color: #8bca8b; font-size: 11px; padding: 4px 8px; border-radius: 16px; cursor: pointer; }
        .comment-actions button:hover { background: #8bca8b; color: #0d2010; }
        .new-comment { display: flex; gap: 8px; margin-top: 10px; }
        .new-comment input { flex: 1; padding: 9px 14px; border-radius: 30px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; font-size: 13px; outline: none; }
        .new-comment input:focus { border-color: var(--green-border); }
        /* Профиль */
        .profile-header { text-align: center; padding: 20px 0 16px; }
        .profile-avatar-wrap { position: relative; display: inline-block; }
        .profile-avatar-lg { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; border: 3px solid var(--green); cursor: pointer; box-shadow: 0 0 0 6px rgba(139,202,139,0.12); }
        .profile-avatar-lg:hover { opacity: 0.82; }
        .avatar-edit-btn { position: absolute; bottom: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--green); border: 2px solid #050a06; color: #0d2010; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .profile-name { font-size: 22px; font-weight: 700; margin-top: 12px; letter-spacing: -0.3px; }
        .profile-role-badge { display: inline-block; margin-top: 5px; padding: 3px 12px; background: var(--green-dim); border: 1px solid var(--green-border); border-radius: 20px; font-size: 11px; color: var(--green); font-weight: 500; }
        .profile-bio { color: var(--text-muted); margin-top: 8px; font-size: 13.5px; line-height: 1.5; max-width: 400px; margin-left: auto; margin-right: auto; }
        .profile-stats { display: flex; justify-content: center; gap: 0; margin: 18px 0 14px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
        .profile-stat { flex: 1; text-align: center; padding: 14px 8px; border-right: 1px solid var(--border); }
        .profile-stat:last-child { border-right: none; }
        .profile-stat .number { font-size: 20px; font-weight: 700; }
        .profile-stat .label { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .profile-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 6px; }
        /* Блоки профиля (collapsible) */
        .profile-sections { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .collapsible-section { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: border-color 0.22s; }
        .collapsible-section.open { border-color: var(--green-border); }
        .collapsible-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; cursor: pointer; user-select: none; }
        .collapsible-header:hover { background: rgba(255,255,255,0.03); }
        .collapsible-header-left { display: flex; align-items: center; gap: 10px; }
        .collapsible-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; background: var(--green-dim); flex-shrink: 0; }
        .collapsible-title { font-weight: 600; font-size: 15px; }
        .collapsible-subtitle { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
        .collapsible-chevron { color: var(--text-muted); font-size: 13px; transition: transform 0.28s; flex-shrink: 0; }
        .collapsible-section.open .collapsible-chevron { transform: rotate(180deg); color: var(--green); }
        .collapsible-body { max-height: 0; overflow: hidden; transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1), padding 0.28s; padding: 0 18px; }
        .collapsible-section.open .collapsible-body { max-height: 2000px; padding: 0 18px 18px; }
        /* Задачи */
        .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.04); border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border); }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; margin-top: 1px; }
        .task-text { flex: 1; font-size: 13.5px; line-height: 1.4; }
        .task-due { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        .task-completed { opacity: 0.45; text-decoration: line-through; }
        .task-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px; }
        .task-delete:hover { color: #ff6b6b; }
        .section-add-btn { width: 100%; padding: 10px; border-radius: var(--radius-sm); background: var(--green-dim); border: 1px dashed var(--green-border); color: var(--green); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; margin-top: 4px; }
        .section-add-btn:hover { background: rgba(139,202,139,0.22); }
        /* Календарь */
        .apple-calendar { background: rgba(20, 26, 22, 0.5); border-radius: 20px; padding: 12px; backdrop-filter: blur(12px); }
        .apple-calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
        .apple-calendar-header h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; color: var(--green); }
        .apple-calendar-nav-btn { background: rgba(255,255,255,0.1); border: none; width: 32px; height: 32px; border-radius: 30px; color: white; cursor: pointer; }
        .apple-calendar-nav-btn:hover { background: var(--green-dim); color: var(--green); }
        .apple-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
        .apple-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .apple-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; border-radius: 30px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.02); position: relative; }
        .apple-day:hover { background: rgba(139,202,139,0.2); transform: scale(1.02); }
        .apple-day.today { background: var(--green); color: #0d2010; font-weight: 700; box-shadow: 0 2px 8px rgba(139,202,139,0.3); }
        .apple-day.has-event { background: var(--green-dim); border: 1px solid var(--green-border); font-weight: 600; color: #8bca8b; }
        .apple-day.other-month { opacity: 0.3; }
        .event-dot-apple { width: 5px; height: 5px; background: var(--green); border-radius: 50%; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); }
        /* Записи */
        .appointment-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.04); border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
        .appt-info { flex: 1; min-width: 120px; }
        .appt-name { font-weight: 600; font-size: 14px; }
        .appt-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .appt-status { font-size: 11px; margin-top: 3px; }
        .status-pending { color: #f59e0b; }
        .status-confirmed { color: var(--green); }
        .status-completed { color: #9ca3af; text-decoration: line-through; }
        .appt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .client-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.04); border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border); }
        .client-name { font-weight: 600; font-size: 14px; }
        /* Заметки */
        .notes-grid { display: flex; flex-direction: column; gap: 8px; }
        .note-card { padding: 12px 14px; background: rgba(255,255,255,0.04); border-radius: var(--radius-md); cursor: pointer; border: 1px solid var(--border); }
        .note-card:hover { background: rgba(255,255,255,0.07); border-color: var(--green-border); }
        .note-title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
        .note-preview { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        /* Сертификаты */
        .certificates-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .certificate-card { background: rgba(255,255,255,0.05); border-radius: var(--radius-md); padding: 10px; text-align: center; width: 96px; border: 1px solid var(--border); position: relative; }
        .certificate-card:hover { border-color: var(--green-border); }
        .certificate-card img { width: 100%; height: 72px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 6px; }
        .certificate-title { font-size: 10.5px; font-weight: 500; word-break: break-word; color: rgba(255,255,255,0.8); }
        .delete-cert-btn { position: absolute; top: -7px; right: -7px; background: rgba(220,38,38,0.9); border: none; color: white; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
        .delete-cert-btn:hover { background: #dc2626; }
        .add-cert-card { cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 108px; background: var(--green-dim) !important; border: 1px dashed var(--green-border) !important; color: var(--green); font-size: 12px; font-weight: 500; }
        .add-cert-card i { font-size: 22px; }
        /* Психологи */
        .psychologists-list { display: flex; flex-direction: column; gap: 10px; }
        .psychologist-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; transition: all 0.22s; border-radius: var(--radius-lg); }
        .psychologist-item:hover { background: var(--glass-hover); border-color: var(--border-hover); transform: translateX(3px); }
        .psychologist-avatar-list { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid var(--green-border); flex-shrink: 0; }
        .psychologist-info { flex: 1; min-width: 0; }
        .psychologist-name { font-weight: 600; font-size: 15.5px; }
        .psychologist-spec { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .psychologist-price { font-size: 12.5px; color: var(--green); margin-top: 4px; font-weight: 500; }
        .psychologist-chevron { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
        /* Чат */
        .chat-list { display: flex; flex-direction: column; gap: 8px; }
        .chat-contact { display: flex; align-items: center; gap: 14px; padding: 13px 16px; cursor: pointer; border-radius: var(--radius-lg); transition: all 0.22s; position: relative; }
        .chat-contact:hover { background: var(--glass-hover); border-color: var(--border-hover); }
        .chat-contact-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--green-border); flex-shrink: 0; }
        .chat-contact-info { flex: 1; min-width: 0; }
        .chat-contact-name { font-weight: 600; font-size: 15px; }
        .chat-contact-last { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: var(--green); color: #0d2010; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; flex-shrink: 0; min-width: 28px; text-align: center; }
        .chat-page { display: flex; flex-direction: column; height: calc(100vh - var(--nav-h) - var(--bottom-h)); padding: 0 8px; }
        .chat-page .chat-messages-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--glass); backdrop-filter: blur(22px); border: 1px solid var(--border); border-radius: var(--radius-lg); }
        .chat-page .chat-messages-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .chat-page .chat-messages-list { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .chat-messages-list::-webkit-scrollbar { width: 4px; }
        .chat-messages-list::-webkit-scrollbar-track { background: transparent; }
        .chat-messages-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
        .message { max-width: 72%; padding: 10px 14px; border-radius: 20px; word-wrap: break-word; animation: msgIn 0.2s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .message.outgoing { align-self: flex-end; background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #0d2010; border-bottom-right-radius: 5px; }
        .message.incoming { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 5px; }
        .message-text { font-size: 14px; line-height: 1.45; }
        .message-time { font-size: 10px; opacity: 0.55; margin-top: 4px; text-align: right; }
        .message.incoming .message-time { text-align: left; }
        .chat-image { max-width: 180px; max-height: 140px; border-radius: var(--radius-sm); margin-top: 4px; cursor: pointer; transition: transform 0.1s; object-fit: cover; }
        .chat-image:hover { transform: scale(1.02); }
        .voice-message { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(0,0,0,0.3); border-radius: 30px; padding: 4px 12px; margin-top: 4px; }
        .voice-message audio { height: 36px; border-radius: 30px; }
        .speed-btn { background: rgba(139,202,139,0.2); border: none; color: var(--green); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; cursor: pointer; }
        .speed-btn:hover { background: var(--green); color: #0d2010; }
        .chat-input-area { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.25); flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px 16px; border-radius: 30px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: white; font-size: 14px; outline: none; }
        .chat-input-area input:focus { border-color: var(--green-border); }
        .chat-controls { display: flex; gap: 6px; }

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

// Используем делегирование, чтобы код работал даже когда чат создается заново
document.addEventListener('focusin', (e) => {
    if (isMobile && (e.target.id === 'chatMessageInput' || e.target.id === 'chatInputCall')) {
        document.body.classList.add('chat-opened');

});

document.addEventListener('focusout', (e) => {

        // ======================= ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =======================

        // Переменные для видеозвонка

        // ======================= АУТЕНТИФИЦИРОВАННЫЙ FETCH =======================
        async function authFetch(url, options = {}) {
            const token = localStorage.getItem('token');
            const headers = new Headers(options.headers || {});
            if (token) {
                headers.set('Authorization', `Bearer ${token}`);
            }
            if (options.body instanceof FormData) {
                headers.delete('Content-Type');
            }
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('userId');
                if (currentUser) {
                    currentUser = null;
                    document.getElementById('navAuth').style.display = 'flex';
                    document.getElementById('navUser').style.display = 'none';
                    document.getElementById('bottomNav').style.display = 'none';
                    showToast('Сессия истекла, войдите заново', true);
                    if (currentTab === 'feed') renderFeed();
                    else switchTab('feed');

        function playBeep() {
            if (!audioAllowed) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.3;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
                setTimeout(() => audioCtx.close(), 600);
            } catch(e) {}
        }

        async function compressImage(file, maxSize = 1024, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = Math.round(height * (maxSize / width));
                            width = maxSize;
                        } else {
                            width = Math.round(width * (maxSize / height));
                            height = maxSize;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        async function register() {

        fullName: document.getElementById('regName').value,

        phone: document.getElementById('regPhone').value,
        password: document.getElementById('regPass').value,

    };

    });

    if (!d.success) {
        showToast(d.error || 'Ошибка регистрации', true);

    // --- Регистрация успешна, теперь сразу логинимся ---

    const loginRes = await fetch('/api/login', {
        method: 'POST',

    });

    if (!loginData.success) {
        showToast('Автоматический вход не удался, войдите вручную', true);
        closeModal('regM');
        openLoginModal();
        return;
    }

    // Сохраняем токен
    localStorage.setItem('token', loginData.token);
    localStorage.setItem('userId', loginData.userId);

    // Загружаем пользователя
    const userData = await fetchJSON(`/api/user/${loginData.userId}`);

        return;

    closeModal('regM');

    // Если клиент — открываем анкету (уже с авторизацией)

        // ======================= СОКЕТ =======================
        function initSocket() {
            if (socket) { socket.disconnect(); socket = null; }
            const token = localStorage.getItem('token');
            if (!token) return;
            socket = io({
                query: { token },
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000
            });
            socket.on('connect', () => { if (currentUser) socket.emit('register_user', currentUser.id); });
            socket.on('connect_error', (err) => { console.error('Socket connect error:', err.message); showToast('Ошибка соединения с сервером', true); });
            
            socket.on('post_created', (newPost) => {
                if (currentTab === 'feed') {
                    feedPosts.unshift(newPost);
                    const container = document.getElementById('postsContainer');
                    if (container) {
                        const newPostHtml = renderSinglePost(newPost);
                        container.insertAdjacentHTML('afterbegin', newPostHtml);
                        const newPostElement = container.firstElementChild;
                        attachEventsToPostElement(newPostElement);
                    }
                    feedOffset++;
                } else if (currentTab === 'profile' && currentUser?.role === 'psychologist') {
                    renderProfile(true);
                }
            });
            socket.on('post_updated', (data) => {
                if (currentTab === 'feed') {
                    const postElement = document.querySelector(`.post-card[data-post-id="${data.id}"]`);
                    if (postElement) {
                        const textDiv = postElement.querySelector('.post-text');
                        if (textDiv) textDiv.innerText = data.text;
                        const post = feedPosts.find(p => p.id === data.id);
                        if (post) post.text = data.text;
                    }
                } else if (currentTab === 'profile') {
                    renderProfile(true);
                }
            });
            socket.on('post_deleted', (postId) => {
                if (currentTab === 'feed') {
                    const postElement = document.querySelector(`.post-card[data-post-id="${postId}"]`);
                    if (postElement) postElement.remove();
                    const index = feedPosts.findIndex(p => p.id === postId);
                    if (index !== -1) feedPosts.splice(index, 1);
                } else if (currentTab === 'profile') {
                    renderProfile(true);
                }
            });
            socket.on('comment_created', ({ postId, comment }) => {
                const commentsDiv = document.getElementById(`comments-${postId}`);
                if (commentsDiv) {
                    const commentsList = commentsDiv.querySelector('.comments-list');
                    if (commentsList) {
                        const isOwnComment = currentUser && String(currentUser.id) === String(comment.author.id);
                        const newCommentHtml = `
                            <div class="comment" data-comment-id="${comment.id}">
                                <img class="comment-avatar" src="${escapeHtml(comment.author.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=8bca8b&color=fff'">
                                <div class="comment-content">
                                    <div class="comment-author">${escapeHtml(comment.author.fullName)}</div>
                                    <div class="comment-text" id="comment-text-${comment.id}">${escapeHtml(comment.text)}</div>
                                    <div class="comment-time">Только что</div>
                                </div>
                                ${isOwnComment ? `
                                <div class="comment-actions">
                                    <button class="edit-comment-btn" data-id="${comment.id}" data-post-id="${postId}" data-text="${escapeHtml(comment.text)}"><i class="fas fa-pen"></i></button>
                                    <button class="delete-comment-btn" data-id="${comment.id}" data-post-id="${postId}"><i class="fas fa-trash-alt"></i></button>
                                </div>
                                ` : ''}
                            </div>
                        `;
                        const emptyState = commentsList.querySelector('.empty-state');
                        if (emptyState) emptyState.remove();
                        commentsList.insertAdjacentHTML('beforeend', newCommentHtml);
                        const commentSpan = document.querySelector(`.comment-toggle[data-id="${postId}"] span`);
                        if (commentSpan) commentSpan.textContent = (parseInt(commentSpan.textContent) || 0) + 1;
                        const post = feedPosts.find(p => p.id === postId);
                        if (post) post.commentsCount = (post.commentsCount || 0) + 1;
                        const newEditBtn = commentsList.querySelector(`.edit-comment-btn[data-id="${comment.id}"]`);
                        if (newEditBtn) newEditBtn.onclick = () => editComment(comment.id, postId, comment.text);
                        const newDeleteBtn = commentsList.querySelector(`.delete-comment-btn[data-id="${comment.id}"]`);
                        if (newDeleteBtn) newDeleteBtn.onclick = () => deleteComment(comment.id, postId);
                    }
                } else if (currentTab === 'feed') {
                    renderFeed(true);
                }
            });
            socket.on('comment_deleted', ({ commentId, postId }) => {
                const commentDiv = document.querySelector(`.comment[data-comment-id="${commentId}"]`);
                if (commentDiv) commentDiv.remove();
                const commentSpan = document.querySelector(`.comment-toggle[data-id="${postId}"] span`);
                if (commentSpan) commentSpan.textContent = Math.max(0, (parseInt(commentSpan.textContent) || 0) - 1);
                const post = feedPosts.find(p => p.id === postId);
                if (post) post.commentsCount = (post.commentsCount || 0) - 1;

            socket.on('post_liked', ({ postId, likesCount, userId, liked }) => {
                const likeBtn = document.querySelector(`.like-btn[data-id="${postId}"]`);

                    if (post) {
                        post.likesCount = likesCount;

                    }
                } else if (currentTab === 'feed') {
                    renderFeed(true);

                if (currentTab === 'notifications') renderNotifications(true);
            });
            socket.on('appointment_completed', (appointmentId) => {
                if (currentTab === 'profile') renderProfile(true);
                if (currentTab === 'notifications') renderNotifications(true);
                showFloatingNotification('Сеанс завершён', 'Запись отмечена как завершённая', 'info');
            });
            socket.on('new_message', async (msg) => {
                let preview = '';
                if (msg.text) preview = msg.text.substring(0, 50);
                else if (msg.image) preview = '📷 Фото';
                else if (msg.voice) preview = '🎤 Голосовое';
                else preview = 'Вложение';
                if (currentChatPartner && msg.from === currentChatPartner.id) {
                    appendMessageToChat(msg);
                    scrollToBottom();
                    await fetchJSON('/api/messages/read', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentUser.id, fromUserId: msg.from })
                    }).catch(console.error);
                    if (currentUser.unreadCounts) delete currentUser.unreadCounts[msg.from];
                    updateChatListUnread(msg.from, 0);
                    return;
                }
                if (currentUser && currentUser.unreadCounts) {
                    currentUser.unreadCounts[msg.from] = (currentUser.unreadCounts[msg.from] || 0) + 1;
                }
                isChatsCacheValid = false;
                try {
                    const userRes = await fetchJSON(`/api/user/${msg.from}`);
                    const senderName = userRes.success ? userRes.user.fullName : 'Новое сообщение';
                    showFloatingNotification('Новое сообщение', `${senderName}: ${preview}`);
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('Новое сообщение', { body: `${senderName}: ${preview}` });
                    }
                    if (!currentChatPartner && currentTab === 'chats') {
                        renderChats(true);
                    } else if (!currentChatPartner) {
                        const chatListExists = document.querySelector('.chat-list');
                        if (chatListExists) {
                            updateChatListItem(msg, senderName, preview);
                        }
                    }
                } catch(e) { console.error(e); }
            });
            socket.on('notification', (notif) => {
                if (notif.type === 'request_review') {
                    showFloatingNotification(notif.title, notif.message, 'info');
                    setTimeout(() => {
                        if (confirm(`${notif.message}\nОставить отзыв сейчас?`)) {
                            viewPsychologistPage(notif.psychologistId);
                            setTimeout(() => {
                                if (typeof openReviewModalWithAppointment === 'function') {
                                    openReviewModalWithAppointment(notif.psychologistId, notif.psychologistName, notif.appointmentId);
                                }
                            }, 500);
                        }
                    }, 500);
                    return;
                }
                showFloatingNotification(notif.title, notif.message);
                if (currentUser) refreshUser();
                isNotificationsCacheValid = false;
                if (currentTab === 'notifications') {
                    renderNotifications(true);
                }
            });
            socket.on('unread_update', (data) => {
                if (currentUser && data.from && data.count !== undefined) {
                    if (!currentUser.unreadCounts) currentUser.unreadCounts = {};
                    currentUser.unreadCounts[data.from] = data.count;
                    if (!currentChatPartner && currentTab === 'chats') {
                        renderChats(true);
                    } else if (!currentChatPartner) {
                        updateChatListUnread(data.from, data.count);
                    }
                }
            });
        }

        // ======================= НАПОМИНАНИЯ =======================
        function checkUpcomingEvents() {
            if (!currentUser) return;
            const now = new Date();
            const appointments = currentUser.role === 'psychologist' ? (currentUser.clients || []) : (currentUser.appointments || []);
            for (const apt of appointments) {
                if (apt.status === 'confirmed') {
                    const eventDate = new Date(apt.date + 'T' + apt.time);
                    const diff = (eventDate - now) / (1000 * 60);
                    if (diff > 0 && diff <= 60 && !localStorage.getItem(`notified_${apt.appointmentId}`)) {
                        showFloatingNotification('Скоро созвон', `Запись с ${apt.clientName || apt.psychologistName} через ${Math.round(diff)} минут`, 'warning');
                        localStorage.setItem(`notified_${apt.appointmentId}`, '1');
                    }
                }
            }
            if (currentUser.role === 'psychologist') {
                fetchJSON(`/api/tasks/${currentUser.id}`).then(res => {
                    for (const task of (res.tasks || [])) {
                        if (!task.completed && task.dueDate) {
                            const due = new Date(task.dueDate);
                            const today = new Date(); today.setHours(0,0,0,0);
                            const daysDiff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                            if (daysDiff === 0 && !localStorage.getItem(`task_today_${task.id}`)) {
                                showFloatingNotification('Задача на сегодня', task.text, 'warning');
                                localStorage.setItem(`task_today_${task.id}`, '1');
                            } else if (daysDiff === 1 && !localStorage.getItem(`task_tomorrow_${task.id}`)) {
                                showFloatingNotification('Задача на завтра', task.text, 'info');
                                localStorage.setItem(`task_tomorrow_${task.id}`, '1');
                            }
                        }
                    }
                });
            }
        }

            const res = await fetchJSON(`/api/posts/${postId}/comment/${commentId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, text: newText })

                const commentTextDiv = document.getElementById(`comment-text-${commentId}`);
                if (commentTextDiv) commentTextDiv.innerText = newText;

            if (!confirm('Удалить комментарий?')) return;
            const res = await fetchJSON(`/api/posts/${postId}/comment/${commentId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id })

            if (!forceRefresh && isFeedCacheValid && feedPosts.length > 0) {
                document.getElementById('mainContent').innerHTML = `<div class="container"><div class="posts-grid" id="postsContainer"></div></div>`;
                renderFeedPosts();
                if (feedHasMore && !document.getElementById('loadMoreBtn')) {
                    const btn = document.createElement('button');
                    btn.id = 'loadMoreBtn';
                    btn.className = 'btn-sm';
                    btn.textContent = 'Загрузить ещё';
                    btn.style.margin = '20px auto';
                    btn.style.display = 'block';
                    btn.onclick = () => loadMoreFeed();
                    document.getElementById('postsContainer').after(btn);
                }
                return;
            }
            feedOffset = 0;
            feedPosts = [];
            feedHasMore = true;
            document.getElementById('mainContent').innerHTML = `<div class="container"><div class="posts-grid" id="postsContainer"></div><div id="feedLoader" style="text-align:center; padding:20px;"><i class="fas fa-circle-notch fa-spin"></i> Загрузка...</div></div>`;

        async function loadMoreFeed() {
            if (!feedHasMore) return;
            const data = await fetchJSON(`/api/posts?limit=12&offset=${feedOffset}&userId=${currentUser?.id || ''}`);
            if (data.success) {
                const newPosts = data.posts;
                feedPosts = feedPosts.concat(newPosts);
                feedOffset += newPosts.length;
                feedHasMore = data.hasMore || false;
                renderFeedPosts();
                if (feedHasMore) {
                    let btn = document.getElementById('loadMoreBtn');
                    if (!btn) {
                        btn = document.createElement('button');
                        btn.id = 'loadMoreBtn';
                        btn.className = 'btn-sm';
                        btn.textContent = 'Загрузить ещё';
                        btn.style.margin = '20px auto';
                        btn.style.display = 'block';
                        btn.onclick = () => loadMoreFeed();
                        document.getElementById('postsContainer').after(btn);
                    }
                } else {
                    const btn = document.getElementById('loadMoreBtn');
                    if (btn) btn.remove();
                }
                document.getElementById('feedLoader')?.remove();
            } else {
                document.getElementById('feedLoader').innerHTML = '<div class="empty-state glass-card"><i class="fas fa-exclamation-triangle"></i><div>Ошибка загрузки</div></div>';
            }
        }

        function attachEventsToPostElement(postElement) {
            const likeBtn = postElement.querySelector('.like-btn');
            if (likeBtn) {
                likeBtn.onclick = async () => {
                    if (isLoading || !currentUser) { showToast('Войдите в аккаунт', true); return; }

                    const postId = likeBtn.dataset.id;
                    const data = await fetchJSON(`/api/posts/${postId}/like`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentUser.id })
                    });
                    if (data.success) {
                        likeBtn.querySelector('span').textContent = data.likesCount;
                        likeBtn.classList.toggle('liked', data.liked);
                        likeBtn.querySelector('i').className = data.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                        const post = feedPosts.find(p => p.id === postId);
                        if (post) { post.likesCount = data.likesCount; post.userLiked = data.liked; }
                    }
                    isLoading = false;
                };
            }
            const commentToggle = postElement.querySelector('.comment-toggle');
            if (commentToggle) {
                commentToggle.onclick = async () => {
                    const postId = commentToggle.dataset.id;
                    const div = document.getElementById(`comments-${postId}`);
                    const isHidden = div.style.display === 'none';
                    div.style.display = isHidden ? 'block' : 'none';
                    commentToggle.querySelector('i').className = isHidden ? 'fa-solid fa-comment' : 'fa-regular fa-comment';
                    if (isHidden && commentToggle.dataset.loaded === 'false') {
                        await loadCommentsForPost(postId);
                        commentToggle.dataset.loaded = 'true';
                    }
                };
            }
            const editBtn = postElement.querySelector('.edit-post-btn');
            if (editBtn) {
                editBtn.onclick = () => {
                    const postCard = editBtn.closest('.post-card');
                    const currentText = postCard.querySelector('.post-text').innerText;
                    openEditPostModal(editBtn.dataset.id, currentText);
                };
            }
            const deleteBtn = postElement.querySelector('.delete-post-btn');
            if (deleteBtn) {
                deleteBtn.onclick = () => openConfirmModal('Удалить пост?', 'Это действие нельзя отменить.', async () => {

                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ authorId: currentUser.id })
                    });
                    const index = feedPosts.findIndex(p => p.id === deleteBtn.dataset.id);
                    if (index !== -1) feedPosts.splice(index, 1);
                    postElement.remove();
                });
            }

        async function addComment(postId) {
            if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input?.value.trim();
            if (!text) return;
            const sendBtn = input.nextElementSibling;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                const data = await fetchJSON(`/api/posts/${postId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id, text })
                });
                if (data.success) {
                    input.value = '';
                    const commentSpan = document.querySelector(`.comment-toggle[data-id="${postId}"] span`);
                    if (commentSpan) commentSpan.textContent = (parseInt(commentSpan.textContent) || 0) + 1;
                    const post = feedPosts.find(p => p.id === postId);
                    if (post) post.commentsCount = (post.commentsCount || 0) + 1;
                    showToast('Комментарий добавлен');
                } else {
                    showToast(data.error || 'Ошибка', true);

                showToast('Ошибка соединения', true);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }

        function renderClientsList(filter = 'upcoming') {
    const container = document.getElementById('clientsList');

}

        async function renderProfileCalendar() {
            const container = document.getElementById('profileCalendar');
            if (!container) return;
            const year = currentCalendarDate.getFullYear(), month = currentCalendarDate.getMonth();
            const firstDay = new Date(year, month, 1);
            let startDay = firstDay.getDay();
            startDay = startDay === 0 ? 6 : startDay - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevDays = new Date(year, month, 0).getDate();
            const tasksRes = await fetchJSON(`/api/tasks/${currentUser.id}`);
            const tasks = tasksRes.tasks || [];
            const appointments = currentUser.clients || [];
            const events = [];
            tasks.forEach(t => { if (t.dueDate) events.push({ date: t.dueDate, title: t.text, type: 'task' }); });
            appointments.filter(a => a.status === 'confirmed').forEach(a => { events.push({ date: a.date, title: `Запись с ${a.clientName} в ${a.time}`, type: 'appointment', roomId: a.roomId, clientId: a.clientId }); });
            let daysHtml = '';
            for (let i = 0; i < startDay; i++) { daysHtml += `<div class="apple-day other-month">${prevDays - startDay + i + 1}</div>`; }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                const isToday = dateStr === new Date().toISOString().split('T')[0];
                daysHtml += `<div class="apple-day${dayEvents.length ? ' has-event' : ''}${isToday ? ' today' : ''}" data-date="${dateStr}" data-events='${JSON.stringify(dayEvents).replace(/'/g, "&#39;")}'>${d}${dayEvents.length && !isToday ? '<div class="event-dot-apple"></div>' : ''}</div>`;
            }
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

        function showScheduleEditor() {
            const renderSlots = () => {
                const sched = currentUser.schedule || {};
                const ds = Object.keys(sched).sort();
                return ds.length ? ds.map(d => `
                    <div style="margin-bottom:12px;">
                        <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${d}</div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">
                            ${sched[d].map(t => `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--green-dim);border:1px solid var(--green-border);padding:4px 12px;border-radius:20px;font-size:13px;">${t}<button onclick="removeSlot('${d}','${t}')" style="background:none;border:none;color:rgba(255,100,100,0.8);cursor:pointer;font-size:12px;padding:0;line-height:1;">✕</button></span>`).join('')}
                        </div>
                    </div>
                `).join('') : '<div class="empty-state" style="padding:20px;"><i class="fas fa-calendar-times"></i><div>Нет добавленного времени</div></div>';
            };
            const modalId = 'scheduleModal';
            const html = `<div class="modal" id="${modalId}"><div class="modal-content" style="max-height:85vh;display:flex;flex-direction:column;"><div class="modal-handle"></div><h3>📅 Свободное время</h3><div class="schedule-modal-form"><div style="display:flex;gap:8px;align-items:flex-end;"><div style="flex:1;"><label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Дата</label><input type="date" id="slotDate" style="margin-bottom:0;width:100%;"></div><div style="flex:1;"><label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Время</label><input type="time" id="slotTime" style="margin-bottom:0;width:100%;"></div><button class="btn-sm" style="height:44px;margin-bottom:0;" onclick="window.addSlot()"><i class="fas fa-plus"></i> Добавить</button></div></div><div class="schedule-modal-list" id="schedule-list">${renderSlots()}</div><div class="modal-buttons" style="margin-top:0;"><button class="btn-secondary" onclick="closeModal('${modalId}')">Закрыть</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById(modalId).classList.add('active'), 10);
            window.addSlot = async () => {
                const date = document.getElementById('slotDate').value;
                const time = document.getElementById('slotTime').value;
                if (!date || !time) { showToast('Выберите дату и время', true); return; }
                const sched = currentUser.schedule || {};
                if (!sched[date]) sched[date] = [];
                if (sched[date].includes(time)) { showToast('Такое время уже есть', true); return; }
                sched[date].push(time); sched[date].sort();
                const res = await fetchJSON('/api/schedule', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, schedule: sched }) });
                if (res.success) {
                    currentUser.schedule = sched;
                    document.getElementById('schedule-list').innerHTML = renderSlots();
                    showToast('Время добавлено');
                }
            };
            window.removeSlot = async (date, time) => {
                const sched = currentUser.schedule || {};
                if (sched[date]) {
                    sched[date] = sched[date].filter(t => t !== time);
                    if (!sched[date].length) delete sched[date];
                    await fetchJSON('/api/schedule', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, schedule: sched }) });
                    currentUser.schedule = sched;
                    document.getElementById('schedule-list').innerHTML = renderSlots();
                }
            };
        }

        async function bookPsychologist(id, name) {
            const scheduleRes = await fetchJSON(`/api/schedule/${id}`);
            if (!scheduleRes.success) { showToast('Не удалось загрузить расписание', true); return; }
            const schedule = scheduleRes.schedule;
            const dates = Object.keys(schedule).sort();
            let slotsHtml = '';
            if (dates.length) {
                for (const d of dates) {
                    slotsHtml += `<div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${d}</div><div style="display:flex;flex-wrap:wrap;gap:6px;">`;

                    slotsHtml += `</div></div>`;
                }
            } else { slotsHtml = '<div class="empty-state" style="padding:20px;"><i class="fas fa-calendar-times"></i><div>Нет свободного времени</div></div>'; }

            document.body.insertAdjacentHTML('beforeend', html);
            const modal = document.getElementById(modalId);
            setTimeout(() => modal.classList.add('active'), 10);
            let selectedDate = null, selectedTime = null;
            modal.querySelectorAll('.time-slot').forEach(b => {
                b.onclick = () => {
                    modal.querySelectorAll('.time-slot').forEach(bb => bb.classList.remove('selected'));
                    b.classList.add('selected');
                    modal.querySelector('#selSlot').textContent = `✅ Выбрано: ${b.dataset.date} в ${b.dataset.time}`;
                    document.getElementById('confirmBook').disabled = false;
                    selectedDate = b.dataset.date;
                    selectedTime = b.dataset.time;
                };
            });
            window.submitBook = async (pid, mid) => {
                if (!selectedDate || !selectedTime) { showToast('Выберите время', true); return; }
                const data = await fetchJSON('/api/appointment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clientId: currentUser.id, psychologistId: pid, date: selectedDate, time: selectedTime })
                });
                if (data.success) { showToast('Заявка отправлена!'); closeModal(mid); await refreshUser(); if (currentTab === 'profile') renderProfile(true); isNotificationsCacheValid = false; }
                else showToast(data.error || 'Ошибка', true);
            };
        }

        function createPostModal() {
            const modalId = 'cpModal';
            const html = `<div class="modal" id="${modalId}"><div class="modal-content"><div class="modal-handle"></div><h3>Новый пост</h3><textarea id="postText" rows="5" placeholder="Поделитесь чем-то полезным..."></textarea><label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;">Фото или видео (необязательно, видео до 1 минуты)</label><input type="file" id="postMedia" accept="image/*,video/*" style="font-size:12px;"><div id="mediaPreview" style="margin-top:8px; display:none;"></div><div id="uploadProgress" style="display:none;" class="upload-progress"><div class="upload-progress-bar"></div></div><div class="modal-buttons"><button class="btn-secondary" onclick="closeModal('${modalId}')">Отмена</button><button class="btn-primary" id="publishPostBtn">Опубликовать</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById(modalId).classList.add('active'), 10);
            const mediaInput = document.getElementById('postMedia');
            const previewDiv = document.getElementById('mediaPreview');
            const progressDiv = document.getElementById('uploadProgress');
            const progressBar = progressDiv.querySelector('.upload-progress-bar');
            const publishBtn = document.getElementById('publishPostBtn');
            let selectedFile = null;
            mediaInput.onchange = async () => {
                const file = mediaInput.files[0];
                if (!file) return;
                selectedFile = file;
                if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    video.onloadedmetadata = () => {
                        URL.revokeObjectURL(video.src);
                        if (video.duration > 60) {
                            showToast('Видео не должно превышать 60 секунд', true);
                            mediaInput.value = '';
                            previewDiv.innerHTML = '';
                            previewDiv.style.display = 'none';
                            selectedFile = null;
                        } else {
                            previewDiv.innerHTML = `<video controls style="max-width:100%; max-height:120px; border-radius:12px;"><source src="${URL.createObjectURL(file)}"></video><div style="font-size:11px; color:var(--text-muted); margin-top:4px;">✅ Видео ${Math.round(video.duration)} сек.</div>`;
                            previewDiv.style.display = 'block';
                        }
                    };
                    video.src = URL.createObjectURL(file);
                } else if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        previewDiv.innerHTML = `<img src="${e.target.result}" style="max-width:100%; max-height:120px; border-radius:12px;">`;
                        previewDiv.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else { showToast('Неподдерживаемый формат', true); mediaInput.value = ''; selectedFile = null; }
            };
            publishBtn.onclick = async () => {
                if (isPosting) { showToast('Пост уже публикуется, подождите...', true); return; }
                const txt = document.getElementById('postText').value;
                if (!txt.trim()) { showToast('Введите текст', true); return; }
                isPosting = true;
                publishBtn.disabled = true;
                publishBtn.innerHTML = '<span class="spinner-small"></span> Публикация...';
                let imageUrl = null, videoUrl = null;
                if (selectedFile) {
                    const formData = new FormData();
                    let endpoint = '';
                    if (selectedFile.type.startsWith('video/')) {
                        endpoint = '/api/upload-video';
                        formData.append('video', selectedFile);
                    } else if (selectedFile.type.startsWith('image/')) {
                        endpoint = '/api/upload-image';
                        formData.append('image', selectedFile);
                    }
                    if (endpoint) {
                        try {
                            const res = await authFetch(endpoint, { method: 'POST', body: formData });
                            const data = await res.json();
                            if (data.success) {
                                if (selectedFile.type.startsWith('video/')) videoUrl = data.videoUrl;
                                else if (selectedFile.type.startsWith('image/')) imageUrl = data.imageUrl;
                            } else { showToast('Ошибка загрузки медиа', true); isPosting = false; publishBtn.disabled = false; publishBtn.innerHTML = 'Опубликовать'; return; }
                        } catch(err) { showToast('Ошибка загрузки', true); isPosting = false; publishBtn.disabled = false; publishBtn.innerHTML = 'Опубликовать'; return; }
                    }
                }
                progressDiv.style.display = 'block';
                let progress = 0;
                const interval = setInterval(() => { progress += 10; if (progress <= 90) progressBar.style.width = progress + '%'; }, 200);
                try {
                    const data = await fetchJSON('/api/posts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ authorId: currentUser.id, text: txt, image: imageUrl, video: videoUrl }) });
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    if (data.success) {
                        const fullPost = {
                            id: data.post.id,
                            text: txt,
                            image: imageUrl,
                            video: videoUrl,
                            createdAt: new Date().toISOString(),
                            author: {
                                id: currentUser.id,
                                fullName: currentUser.fullName,
                                avatar: currentUser.avatar,
                                rating: currentUser.rating || 0
                            },
                            likesCount: 0,
                            commentsCount: 0,
                            userLiked: false
                        };
                        feedPosts.unshift(fullPost);
                        isFeedCacheValid = true;
                        if (currentTab === 'feed') {
                            const container = document.getElementById('postsContainer');
                            if (container) {
                                const newPostHtml = renderSinglePost(fullPost);
                                container.insertAdjacentHTML('afterbegin', newPostHtml);
                                const newPostElement = container.firstElementChild;
                                attachEventsToPostElement(newPostElement);
                                feedOffset++;
                            }
                            closeModal(modalId);
                            showToast('Пост опубликован');
                        } else if (currentTab === 'profile') {
                            closeModal(modalId);
                            showToast('Пост опубликован');
                            renderProfile(true);
                        } else {
                            closeModal(modalId);
                            showToast('Пост опубликован');
                            renderFeed();
                        }
                    } else {
                        showToast(data.error || 'Ошибка публикации', true);
                        progressDiv.style.display = 'none';
                    }
                } catch(err) { clearInterval(interval); showToast('Ошибка соединения', true); progressDiv.style.display = 'none'; }
                finally { isPosting = false; publishBtn.disabled = false; publishBtn.innerHTML = 'Опубликовать'; setTimeout(() => { progressDiv.style.display = 'none'; progressBar.style.width = '0%'; }, 1000); }
            };
        }
        
        // ======================= ПОИСК =======================
        function openSearchModal() {
            const modalId = 'searchM';
            const html = `<div class="modal" id="${modalId}"><div class="modal-content"><div class="modal-handle"></div><h3>Поиск психологов</h3><input type="search" id="searchInp" placeholder="Введите имя..."><div id="searchRes"></div><div class="modal-buttons"><button class="btn-secondary" onclick="closeModal('${modalId}')">Закрыть</button></div></div></div>`;

        // ======================= ЧАТ =======================
        async function renderChats(forceRefresh = false) {
            if (!forceRefresh && isChatsCacheValid && cachedChatsHtml) {
                document.getElementById('mainContent').innerHTML = cachedChatsHtml;
                return;
            }
            currentChatPartner = null;
            if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
            await refreshUser();
            document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;
            const messagesRes = await fetchJSON(`/api/messages/${currentUser.id}`);
            const messages = messagesRes.messages || [];
            const usersFromServer = messagesRes.users || [];
            const contactsMap = new Map();
            const unreadCountsFromServer = currentUser.unreadCounts || {};
            messages.forEach(msg => {
                const contactId = msg.from_user === currentUser.id ? msg.to_user : msg.from_user;
                if (!contactsMap.has(contactId)) {
                    contactsMap.set(contactId, { lastMessage: msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение')), lastTime: msg.created_at });
                } else {
                    const existing = contactsMap.get(contactId);
                    if (new Date(msg.created_at) > new Date(existing.lastTime)) {
                        existing.lastMessage = msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение'));
                        existing.lastTime = msg.created_at;
                    }
                }
            });
            const contacts = usersFromServer.map(u => {
                const contactInfo = contactsMap.get(u.id) || { lastMessage: '', lastTime: new Date(0).toISOString() };
                const unread = unreadCountsFromServer[u.id] || 0;
                return { ...u, ...contactInfo, unread };
            }).sort((a,b) => new Date(b.lastTime) - new Date(a.lastTime));
            let html = `<div class="container"><div class="page-title">Сообщения</div><div class="chat-list">`;
            for (const c of contacts) {
                html += `<div class="chat-contact glass-card" data-contact-id="${c.id}" onclick="openChat('${c.id}','${escapeHtml(c.fullName)}')">
                            <img class="chat-contact-avatar" src="${escapeHtml(c.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.fullName)}&background=8bca8b&color=fff'">
                            <div class="chat-contact-info">
                                <div class="chat-contact-name">${escapeHtml(c.fullName)}</div>
                                <div class="chat-contact-last">${escapeHtml((c.lastMessage || '').substring(0, 40))}</div>
                            </div>
                            ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
                        </div>`;
            }
            if (contacts.length === 0) html += '<div class="empty-state glass-card" style="padding:40px;"><i class="fas fa-comment-slash"></i><div>Нет сообщений. Напишите психологу из раздела «Психологи»!</div></div>';
            html += `</div></div>`;
            cachedChatsHtml = html;
            isChatsCacheValid = true;
            document.getElementById('mainContent').innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        async function openChat(userId, userName) {
            currentChatPartner = { id: userId, name: userName };
            await fetchJSON('/api/messages/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, fromUserId: userId }) });
            if (currentUser.unreadCounts && currentUser.unreadCounts[userId]) delete currentUser.unreadCounts[userId];
            if (currentTab === 'chats') { const chatItems = document.querySelectorAll('.chat-contact'); for (const item of chatItems) { if (item.getAttribute('data-contact-id') === userId) { const badge = item.querySelector('.unread-badge'); if (badge) badge.remove(); break; } } }
            document.getElementById('mainContent').innerHTML = `<div class="chat-page"><div class="chat-messages-container"><div class="chat-messages-header"><button class="back-btn" onclick="renderChats()"><i class="fas fa-arrow-left"></i></button><img src="" id="chatPartnerAvatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--green-border);" onerror="this.style.display='none'"><div style="flex:1"><div style="font-weight:600;font-size:15px;">${escapeHtml(userName)}</div></div></div><div class="chat-messages-list" id="chatMessagesList"></div><div class="chat-input-area"><div class="chat-controls"><button id="attachImageBtn" title="Фото"><i class="fas fa-image"></i></button><button id="voiceRecordBtn" title="Голосовое"><i class="fas fa-microphone"></i></button></div><input type="file" id="imageInput" accept="image/*" style="display:none"><input type="text" id="chatMessageInput" placeholder="Сообщение..."><button class="send-btn-chat" id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button></div></div></div>`;
            await new Promise(resolve => setTimeout(resolve, 10));
            authFetch(`/api/user/${userId}`)
            .then(r => r.json())
            .then(d => {
                const av = document.getElementById('chatPartnerAvatar');
                if (av && d.success) av.src = d.user.avatar;
            })
            .catch(console.error);
            await loadChatMessages();
            scrollToBottom();
            const sendBtn = document.getElementById('sendMsgBtn');
            const chatInput = document.getElementById('chatMessageInput');
            const attachBtn = document.getElementById('attachImageBtn');
            const imageInput = document.getElementById('imageInput');
            const voiceBtn = document.getElementById('voiceRecordBtn');
            if (sendBtn) sendBtn.onclick = sendChatMessage;
            if (chatInput) chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendChatMessage(); };
            if (attachBtn && imageInput) {
                attachBtn.onclick = () => imageInput.click();
                imageInput.onchange = async () => {
                    const file = imageInput.files[0];
                    if (!file || !file.type.startsWith('image/')) { showToast('Только изображения', true); return; }
                    const compressedBlob = await compressImage(file, 1024, 0.8);
                    const formData = new FormData(); formData.append('image', compressedBlob, file.name);
                    const res = await authFetch('/api/upload-chat-image', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        await fetchJSON('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', image: data.imageUrl }) });
                        await loadChatMessages();
                        scrollToBottom();
                    }
                    imageInput.value = '';
                };
            }
            if (voiceBtn) {
                let mediaRecorder = null, audioChunks = [], isRecording = false;
                voiceBtn.onclick = async () => {
                    if (!isRecording) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                            audioChunks = [];
                            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                            mediaRecorder.onstop = async () => {
                                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                                const fd = new FormData(); fd.append('voice', blob, 'voice.webm');
                                const res = await authFetch('/api/upload-voice', { method: 'POST', body: fd });
                                const data = await res.json();

        function addSpeedButtonToAudio(audio) {
            const container = audio.closest('.voice-message');
            if (!container || container.querySelector('.speed-btn')) return;
            const speeds = [1, 1.5, 2];
            let currentSpeed = 1;
            const btn = document.createElement('button');
            btn.className = 'speed-btn';
            btn.textContent = `${currentSpeed}x`;
            btn.onclick = (e) => {
                e.stopPropagation();
                let idx = speeds.indexOf(currentSpeed);
                idx = (idx + 1) % speeds.length;
                currentSpeed = speeds[idx];
                audio.playbackRate = currentSpeed;
                btn.textContent = `${currentSpeed}x`;
            };
            container.appendChild(btn);
        }

            document.getElementById(`questionsContainer_${modalId}`).innerHTML = renderQuestions();
        }

// 3. ОТПРАВКА ЗАМЕТКИ В 2 ТАБЛИЦЫ
async function submitClientNote(clientId, clientName, modalId) {
    const content = document.getElementById(`clientNoteContent_${modalId}`).value.trim();
    if (!content) { showToast('Введите текст заметки', true); return; }
    
    const btn = document.getElementById(`saveClientNoteBtn_${modalId}`);
    btn.disabled = true;
    btn.innerHTML = 'Загрузка...';

    const file = document.getElementById(`clientNoteFile_${modalId}`)?.files[0];
    let fileUrl = null;
    let fileType = null;

    if (file) {
        if (file.size > 5 * 1024 * 1024) { showToast('Файл слишком большой', true); btn.disabled = false; btn.innerHTML = 'Сохранить'; return; }
        const fd = new FormData(); fd.append('file', file);
        const r = await authFetch('/api/upload', { method: 'POST', body: fd });
        const d = await r.json();
        if (d.success) { 
            fileUrl = d.fileUrl; 
            fileType = file.type.startsWith('image/') ? 'image' : 'file'; 
        } else { 
            showToast(d.error || 'Ошибка загрузки файла', true); 
            btn.disabled = false; btn.innerHTML = 'Сохранить'; 
            return; 
        }
    }

    const title = `Клиент: ${clientName}`;
    
    // Сохраняем в основной профиль
    await fetchJSON('/api/notes', { 
        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ psychologistId: currentUser.id, title, content, attachment: fileUrl, attachmentType: fileType }) 
    });

    // Сохраняем в карту клиента
    let cardNoteText = content;
    if (fileUrl) cardNoteText += `\n\n[Прикреплен файл]: ${fileUrl}`;

    const res = await fetchJSON('/api/client-notes', { 
        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ psychologistId: currentUser.id, clientId, note: cardNoteText }) 
    });

    if (res.success) {
        showToast('Заметка добавлена');
        closeModal(modalId);
        closeModal(window.currentClientCardModalId);
        setTimeout(() => openClientCardInCall(), 350);
    } else {
        showToast('Ошибка сохранения', true);
        btn.disabled = false; btn.innerHTML = 'Сохранить';
    }
}
