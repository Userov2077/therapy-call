        async function getIceServers() { 
            return [ 
                { urls: 'stun:stun.l.google.com:19302' }, 
                { urls: 'stun:stun1.l.google.com:19302' }, 
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }, 
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' } 
            ]; 
        }

        async function createPeerConnectionCall() { 
            if (peerConnection) peerConnection.close(); 
            
            const config = { 
                iceServers: await getIceServers(), 
                iceTransportPolicy: 'all' 
            }; 
            
            peerConnection = new RTCPeerConnection(config); 
            
            if (localStream) {
                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream)); 
            }

            // Обработка входящего видео
            peerConnection.ontrack = (event) => { 
                const stream = event.streams[0]; 
                document.getElementById('remoteVideo').srcObject = stream; 
                document.getElementById('floatingRemoteVideo').srcObject = stream; 
                document.getElementById('waitingMessageCall').style.display = 'none'; 
                callConnectionEstablished = true; 
                updateRemoteVideoMode(remoteScreenMode); 
                
                if (!callStartTime) startCallTimer(); 
            }; 

            // Отправка ICE-кандидатов собеседнику
            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket && currentCallPartnerUserId) {
                    socket.emit('ice-candidate', { 
                        targetUserId: currentCallPartnerUserId, 
                        candidate: event.candidate 
                    });
                }
            }; 

            // Обработка статуса соединения (переподключение при обрыве)
            peerConnection.oniceconnectionstatechange = () => { 
                if (!peerConnection) return; 
                
                const state = peerConnection.iceConnectionState; 
                if (state === 'connected') { 
                    callConnectionEstablished = true; 
                    document.getElementById('waitingMessageCall').style.display = 'none'; 
                    if (!callStartTime) startCallTimer(); 
                } else if (state === 'failed' || state === 'disconnected') { 
                    callConnectionEstablished = false; 
                    document.getElementById('waitingMessageCall').style.display = 'flex'; 
                    setTimeout(() => { 
                        if (!callConnectionEstablished) reconnectCall(); 
                    }, 3000); 
                } 
            }; 
            
            return peerConnection; 
        }

        // ==========================================
        // УПРАВЛЕНИЕ ЗВОНКОМ И ТАЙМЕРАМИ
        // ==========================================

        function startCallTimer() { 
            if (callTimerInterval) clearInterval(callTimerInterval); 
            callStartTime = Date.now(); 
            
            const timerElement = document.getElementById('callTimer'); 
            if (timerElement) timerElement.style.display = 'block'; 
            
            callTimerInterval = setInterval(() => { 
                if (!callStartTime) return; 
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000); 
                const mins = Math.floor(elapsed / 60); 
                const secs = elapsed % 60; 
                document.getElementById('callTimer').textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`; 
            }, 1000); 
        }

        function stopCallTimer() { 
            if (callTimerInterval) clearInterval(callTimerInterval); 
            callTimerInterval = null; 
            
            const timerElement = document.getElementById('callTimer'); 
            if (timerElement) timerElement.style.display = 'none'; 
            
            if (callStartTime && currentCallRoomId) { 
                const duration = Math.floor((Date.now() - callStartTime) / 1000); 
                // ИСПРАВЛЕНИЕ: Используем authFetch вместо обычного fetch, чтобы передать токен и избежать ошибки 401
                authFetch('/api/appointment/duration', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ roomId: currentCallRoomId, duration }) 
                }).catch(console.error); 
                callStartTime = null; 
            } 
        }

        async function startLocalStreamCall() { 
            try { 
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); 
                localStream = stream; 
                document.getElementById('localVideo').srcObject = localStream; 
                cameraTrack = localStream.getVideoTracks()[0]; 
                
                if (socket && currentCallPartnerUserId) {
                    await initWebRTCCall(currentCallRole === 'psychologist'); 
                }
            } catch (e) { 
                showToast('Нет доступа к камере/микрофону', true); 
            } 
        }

        async function initWebRTCCall(createOffer = true) { 
            if (!localStream) return; 
            await createPeerConnectionCall(); 
            
            if (createOffer && socket && currentCallPartnerUserId) { 
                const offer = await peerConnection.createOffer(); 
                await peerConnection.setLocalDescription(offer); 
                socket.emit('offer', { targetUserId: currentCallPartnerUserId, sdp: offer }); 
            } 
        }

        // ==========================================
        // ДЕМОНСТРАЦИЯ ЭКРАНА
        // ==========================================

        async function replaceVideoTrackCall(newTrack) { 
            if (!peerConnection) return; 
            const sender = peerConnection.getSenders().find(s => s.track?.kind === 'video'); 
            
            if (sender) {
                await sender.replaceTrack(newTrack); 
            } else if (newTrack) {
                peerConnection.addTrack(newTrack, localStream); 
            }
            
            if (newTrack) { 
                const newStream = new MediaStream(); 
                newStream.addTrack(newTrack); 
                if (localStream.getAudioTracks()[0]) newStream.addTrack(localStream.getAudioTracks()[0]); 
                document.getElementById('localVideo').srcObject = newStream; 
            } 
        }

        async function startScreenShareCall() { 
            if (isScreenSharing || !navigator.mediaDevices?.getDisplayMedia) {
                return showToast('Не поддерживается', true); 
            }
            try { 
                const screen = await navigator.mediaDevices.getDisplayMedia({ video: true }); 
                screenStream = screen; 
                const track = screen.getVideoTracks()[0]; 
                if (cameraTrack) cameraTrack.enabled = false; 
                
                await replaceVideoTrackCall(track); 
                updateLocalVideoMode(true); 
                isScreenSharing = true; 
                
                if (socket) socket.emit('call-message', { text: 'Начал трансляцию экрана' }); 
                if (socket) socket.emit('screen-share-started', { roomId: currentCallRoomId }); 
                
                track.onended = () => stopScreenShareCall(); 
            } catch(e) { 
                showToast('Ошибка трансляции', true); 
            } 
        }

        async function stopScreenShareCall() { 
            if (!isScreenSharing) return; 
            if (screenStream) screenStream.getTracks().forEach(t => t.stop()); 
            screenStream = null; 
            
            if (cameraTrack) { 
                cameraTrack.enabled = true; 
                await replaceVideoTrackCall(cameraTrack); 
            } else {
                await replaceVideoTrackCall(null); 
            }
            
            updateLocalVideoMode(false); 
            isScreenSharing = false; 
            
            if (socket) socket.emit('call-message', { text: 'Остановил трансляцию экрана' }); 
            if (socket) socket.emit('screen-share-stopped', { roomId: currentCallRoomId }); 
        }

        function toggleScreenShareCall() { 
            isScreenSharing ? stopScreenShareCall() : startScreenShareCall(); 
        }

        // ==========================================

        function addCallChatMessage(text, isOutgoing = false, time = null) { 
            const container = document.getElementById('chatMessagesCall'); 
            if (!container) return; 
            
            const empty = container.querySelector('.chat-empty'); 
            if (empty) empty.remove(); 
            
            const div = document.createElement('div'); 
            div.className = 'chat-message-call ' + (isOutgoing ? 'outgoing' : 'incoming'); 
            
            const t = time ? new Date(time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); 
            div.innerHTML = `<div>${escapeHtml(text)}</div><div class="chat-message-time" style="font-size:9px;opacity:0.6;margin-top:2px;text-align:right;">${t}</div>`; 
            
            container.appendChild(div); 
            container.scrollTop = container.scrollHeight; 
        }

        function sendCallChatMessage() { 
            const input = document.getElementById('chatInputCall'); 
            if (!input) return; 
            const text = input.value.trim(); 
            
            if (text && socket) { 
                addCallChatMessage(text, true); 
                // ИСПРАВЛЕНИЕ: Обязательно передаем roomId, чтобы сервер нашел комнату
                socket.emit('call-message', { roomId: currentCallRoomId, text }); 
                input.value = ''; 
            } 
        }

        function startCallRecording() { 
            if (!localStream) return; 
            recordedChunks = []; 
            const stream = new MediaStream([localStream.getAudioTracks()[0]]); 
            mediaRecorderCall = new MediaRecorder(stream, { mimeType: 'audio/webm' }); 
            
            mediaRecorderCall.ondataavailable = e => { 
                if (e.data.size) recordedChunks.push(e.data); 
            }; 
            
            mediaRecorderCall.onstop = async () => { 
                const blob = new Blob(recordedChunks, { type: 'audio/webm' }); 
                const fd = new FormData(); 
                fd.append('recording', blob, `call_${Date.now()}.webm`); 
                fd.append('from', currentUser.id); 
                fd.append('to', currentCallPartnerUserId || 'unknown'); 
                fd.append('roomId', currentCallRoomId); 
                
                try { 
                    await authFetch('/api/upload-recording', { method: 'POST', body: fd }); 
                    showToast('Запись сохранена'); 
                } catch(e) {
                    console.error('Ошибка сохранения записи', e);
                } 
            }; 
            
            mediaRecorderCall.start(1000); 
            isRecordingCall = true; 
            
            const recordBtn = document.getElementById('recordCallBtn'); 
            if (recordBtn) { 
                recordBtn.classList.add('recording-active'); 
                recordBtn.innerHTML = '<span class="rec-dot"></span> Запись ...'; 
            } 
        }

        function stopCallRecording() { 
            if (mediaRecorderCall?.state === 'recording') { 
                mediaRecorderCall.stop(); 
                isRecordingCall = false; 
                const recordBtn = document.getElementById('recordCallBtn'); 
                if (recordBtn) { 
                    recordBtn.classList.remove('recording-active'); 
                    recordBtn.innerHTML = '<i class="fas fa-circle"></i> Запись'; 
                } 
            } 
        }

        function toggleCallRecording() { 
            isRecordingCall ? stopCallRecording() : startCallRecording(); 
        }

        function executeLeaveCall(isComplete, modalId) {
            if (modalId) closeModal(modalId);
            stopCallTimer(); stopCallRecording(); 
            
            if (socket) {
                if (isComplete) socket.emit('end-call'); 
                else socket.emit('leave-call'); 
            }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
            
            document.getElementById('callContainer').style.display = 'none'; 
            document.getElementById('floatingCall').style.display = 'none'; 
            document.getElementById('mainContent').style.display = 'block'; 
            document.querySelector('.navbar').style.display = 'flex'; 
            document.getElementById('bottomNav').style.display = 'flex'; 
            
            const chatContainer = document.getElementById('chatMessagesCall');
            if (chatContainer) chatContainer.innerHTML = '<div class="chat-empty">Сообщения появятся здесь</div>';
            const chatPanel = document.getElementById('chatPanelCall');
            if (chatPanel) chatPanel.classList.remove('open');
            
            isCallActive = false; currentCallRoomId = null; currentCallRole = null; 
            currentCallPartnerUserId = null; currentClientIdInCall = null; 
            callConnectionEstablished = false; callStartTime = null; 
        }

        function reconnectCall() { 
            if (!currentCallRoomId) { showToast('Нет активного звонка', true); return; } 
            if (peerConnection) { peerConnection.close(); peerConnection = null; } 
            callConnectionEstablished = false; 
            document.getElementById('waitingMessageCall').style.display = 'flex'; 
            
            if (socket && socket.connected) { 
                socket.emit('request-reconnect', { roomId: currentCallRoomId, role: currentCallRole });

                        initWebRTCCall(currentCallRole === 'psychologist');

            } else {

                socket.once('connect', () => { 
                    socket.emit('join-call-room', currentCallRoomId, currentUser.id, currentCallRole); 
                }); 
            } 
        }

        async function submitClientNote(clientId, clientName, modalId) {
            const content = document.getElementById(`clientNoteContent_${modalId}`).value.trim();
            if (!content) { showToast('Введите текст заметки', true); return; }
            
            const btn = document.getElementById(`saveClientNoteBtn_${modalId}`);
            btn.disabled = true;
            btn.innerHTML = 'Загрузка...';

            const file = document.getElementById(`clientNoteFile_${modalId}`)?.files[0];
            let fileUrl = null;
            let fileType = null;

            if (file) {
                if (file.size > 5 * 1024 * 1024) { showToast('Файл слишком большой', true); btn.disabled = false; btn.innerHTML = 'Сохранить'; return; }
                const fd = new FormData(); fd.append('file', file);
                const r = await authFetch('/api/upload', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.success) { 
                    fileUrl = d.fileUrl; 
                    fileType = file.type.startsWith('image/') ? 'image' : 'file'; 
                } else { 
                    showToast(d.error || 'Ошибка загрузки файла', true); 
                    btn.disabled = false; btn.innerHTML = 'Сохранить'; 
                    return; 
                }
            }

            const title = `Клиент: ${clientName}`;
            
            await fetchJSON('/api/notes', { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ psychologistId: currentUser.id, title, content, attachment: fileUrl, attachmentType: fileType }) 
            });

            let cardNoteText = content;
            if (fileUrl) cardNoteText += `\n\n[Прикреплен файл]: ${fileUrl}`;

            const res = await fetchJSON('/api/client-notes', { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ psychologistId: currentUser.id, clientId, note: cardNoteText }) 
            });

            if (res.success) {
                showToast('Заметка добавлена');
                closeModal(modalId);
                closeModal(window.currentClientCardModalId);
                setTimeout(() => openClientCardInCall(), 350);
            } else {
                showToast('Ошибка сохранения', true);
                btn.disabled = false; btn.innerHTML = 'Сохранить';
            }
        }

        async function submitClientProgress(clientId, modalId) {
            const type = document.getElementById(`scaleType_${modalId}`).value;
            const scoreRaw = parseInt(document.getElementById(`scaleScore_${modalId}`).value);
            const userNote = document.getElementById(`scaleNote_${modalId}`).value.trim();

            if (isNaN(scoreRaw)) { showToast('Введите корректный балл', true); return; }

            const btn = document.getElementById(`saveProgressBtn_${modalId}`);
            btn.disabled = true;

            let severity10 = 5; 
            let finalNoteText = '';

            if (type === 'standard') {
                if (scoreRaw < 1 || scoreRaw > 10) { showToast('Введите от 1 до 10', true); btn.disabled = false; return; }
                severity10 = scoreRaw;
                finalNoteText = userNote;
            } 
            else if (type === 'beck_dep') {
                if (scoreRaw < 0 || scoreRaw > 63) { showToast('Балл Бека должен быть от 0 до 63', true); btn.disabled = false; return; }
                if (scoreRaw <= 13) { severity10 = 9; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Норма). `; }
                else if (scoreRaw <= 19) { severity10 = 6; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Легкая депрессия). `; }
                else if (scoreRaw <= 28) { severity10 = 4; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Умеренная депрессия). `; }
                else { severity10 = 2; finalNoteText = `Шкала депрессии Бека: ${scoreRaw} (Тяжелая депрессия). `; }
                finalNoteText += userNote;
            }
            else if (type === 'beck_anx') {
                if (scoreRaw < 0 || scoreRaw > 63) { showToast('Балл Бека должен быть от 0 до 63', true); btn.disabled = false; return; }
                if (scoreRaw <= 7) { severity10 = 9; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Норма). `; }
                else if (scoreRaw <= 15) { severity10 = 6; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Слабая тревога). `; }
                else if (scoreRaw <= 25) { severity10 = 4; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Умеренная тревога). `; }
                else { severity10 = 2; finalNoteText = `Шкала тревоги Бека: ${scoreRaw} (Тяжелая тревога). `; }
                finalNoteText += userNote;
            }

            const data = await fetchJSON('/api/client-progress', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ psychologistId: currentUser.id, clientId, value: severity10, type: 'psychologist', notes: finalNoteText.trim() })
            });

            if (data.success) {
                showToast('Прогресс зафиксирован');
                closeModal(modalId);
                closeModal(window.currentClientCardModalId);
                setTimeout(() => openClientCardInCall(), 350);
            } else {
                showToast('Ошибка сохранения', true);
                btn.disabled = false;
            }
        }

        function initVideoObservers() { 
            if (videoObserver) videoObserver.disconnect(); 
            
            // Ищем ТОЛЬКО видео в ленте (feed-video), профильные видео не трогаем
            const videos = document.querySelectorAll('.feed-video'); 
            if (videos.length === 0) return; 
            
            videoObserver = new IntersectionObserver((entries) => { 
                entries.forEach(entry => { 
                    const video = entry.target; 
                    if (entry.isIntersecting) { 
                        // Проигрываем автоматически только 1 раз
                        if (video.dataset.played !== 'true') {
                            video.play().then(() => {
                                video.dataset.played = 'true'; // Отмечаем, что автоплей сработал
                            }).catch(e => console.log('Автовоспроизведение заблокировано', e)); 
                        }
                    } else { 
                        video.pause(); 
                    } 
                }); 
            }, { threshold: 0.5 }); 
            
            videos.forEach(video => {
                videoObserver.observe(video);
                // Когда видео заканчивается, убеждаемся, что оно на паузе
                video.onended = () => { video.pause(); };
            }); 
        }

        const publicVapidKey = 'BDThpkrn-kuIXBuFXJRHiFX29Kwz8A6HWw1q9SYnlc2syl1ZKXCsVsyjdsLF9Llq9_JTivCurcDTGOdNCPzz-fQ'; 

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function requestNotificationPermission() {
            if (!('Notification' in window) || !('serviceWorker' in navigator)) return;

            if (Notification.permission !== 'granted') {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;
            }

            try {
                const registration = await navigator.serviceWorker.ready;
                let subscription = await registration.pushManager.getSubscription();
                
                if (!subscription) {
                    subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                    });
                }

                await authFetch('/api/push/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subscription)
                });
                console.log('Подписка на фоновые Push успешно сохранена');
            } catch (error) {
                console.error('Ошибка подписки на Push:', error);
            }
        }
        
        function makeDraggable(element) { 
            let startX, startY, startLeft, startTop, isDragging = false; 
            const header = element.querySelector('.floating-header'); 
            if (!header) return; 
            
            const onStart = (e) => { 
                if (e.target.closest('.floating-controls button') || e.target.closest('#restoreCallBtn')) return; 
                e.preventDefault(); 
                const touch = e.touches ? e.touches[0] : e; 
                startX = touch.clientX; 
                startY = touch.clientY; 
                const rect = element.getBoundingClientRect(); 
                startLeft = rect.left; 
                startTop = rect.top; 
                isDragging = true; 
                element.classList.add('dragging'); 
            }; 
            
            const onMove = (e) => { 
                if (!isDragging) return; 
                const touch = e.touches ? e.touches[0] : e; 
                const dx = touch.clientX - startX; 
                const dy = touch.clientY - startY; 
                let newLeft = startLeft + dx; 
                let newTop = startTop + dy; 
                newLeft = Math.min(window.innerWidth - element.offsetWidth, Math.max(0, newLeft)); 
                newTop = Math.min(window.innerHeight - element.offsetHeight, Math.max(0, newTop)); 
                element.style.left = newLeft + 'px'; 
                element.style.top = newTop + 'px'; 
                element.style.right = 'auto'; 
                element.style.bottom = 'auto'; 
            }; 
            
            const onEnd = () => { 
                isDragging = false; 
                element.classList.remove('dragging'); 
            }; 
            
            header.addEventListener('mousedown', onStart); 
            window.addEventListener('mousemove', onMove); 
            window.addEventListener('mouseup', onEnd); 
            header.addEventListener('touchstart', onStart); 
            window.addEventListener('touchmove', onMove); 
            window.addEventListener('touchend', onEnd); 
        }

        // ======================= PWA INSTALL PROMPT =======================
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(showInstallPrompt, 2000);
        });

        function showInstallPrompt() {
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            if (localStorage.getItem('pwa_prompt_dismissed')) return;

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const modalId = 'pwaPrompt';
            
            const content = isIOS 
                ? `Чтобы установить <b>Therapy Call</b> на iPhone, нажмите кнопку <b>Поделиться</b> <i class="fas fa-external-link-alt" style="color:var(--green);"></i> внизу браузера и выберите <b>«На экран Домой»</b>.`
                : `Установите приложение <b>Therapy Call</b> на свой телефон для быстрой работы, кэширования постов и получения уведомлений!`;
            
            const btnHtml = isIOS 
                ? `<button class="btn-primary" onclick="closeModal('${modalId}'); localStorage.setItem('pwa_prompt_dismissed', '1')">Понятно</button>`
                : `<button class="btn-primary" onclick="installPWA('${modalId}')">Установить</button><button class="btn-secondary" onclick="closeModal('${modalId}'); localStorage.setItem('pwa_prompt_dismissed', '1')">Позже</button>`;

            const html = `
                <div class="modal" id="${modalId}" style="z-index: 5000;">
                    <div class="modal-content">
                        <div class="modal-handle"></div>
                        <h3 style="margin-bottom:10px;"><i class="fas fa-download" style="color:var(--green);"></i> Установить приложение</h3>
                        <p style="font-size:14px; color:rgba(255,255,255,0.8); line-height:1.5; margin-bottom:20px;">${content}</p>
                        <div class="modal-buttons">${btnHtml}</div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById(modalId).classList.add('active'), 10);
        }

        window.installPWA = async (modalId) => {
            closeModal(modalId);
            localStorage.setItem('pwa_prompt_dismissed', '1');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
        };
        
        window.addEventListener('load', () => {
            if (isMobile && !window.matchMedia('(display-mode: standalone)').matches && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
                 setTimeout(showInstallPrompt, 3000);
            }
        });
