<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Therapy Call</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
        .post { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .post-text { font-size: 16px; margin-bottom: 8px; }
        .post-time { font-size: 12px; color: gray; }
    </style>
</head>
<body>
    <h1>Лента постов</h1>
    <div id="posts"></div>

    <script>
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                const data = await res.json();
                if (data.success && data.posts) {
                    const container = document.getElementById('posts');
                    container.innerHTML = data.posts.map(post => `
                        <div class="post">
                            <div class="post-text">${escapeHtml(post.text)}</div>
                            ${post.image ? `<img src="${post.image}" style="max-width:100%; border-radius:8px;">` : ''}
                            ${post.video ? `<video src="${post.video}" controls style="max-width:100%; border-radius:8px;"></video>` : ''}
                            <div class="post-time">${new Date(post.created_at).toLocaleString()}</div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('posts').innerHTML = '<p>Нет постов</p>';
                }
            } catch (err) {
                document.getElementById('posts').innerHTML = '<p>Ошибка загрузки</p>';
                console.error(err);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        loadPosts();
    </script>
</body>
</html>
