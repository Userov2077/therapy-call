<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Therapy Call | Сообщество психологов</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ------------------- БАЗОВЫЕ ПЕРЕМЕННЫЕ ------------------- */
        :root {
            --green: #8bca8b;
            --green-dark: #5a9e5a;
            --green-dim: rgba(139, 202, 139, 0.15);
            --green-border: rgba(139, 202, 139, 0.25);
            --glass: rgba(20, 26, 22, 0.65);
            --glass-hover: rgba(28, 36, 30, 0.82);
            --border: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(139, 202, 139, 0.28);
            --text-muted: rgba(255,255,255,0.45);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --nav-h: 62px;
            --bottom-h: 68px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: #050a06;
            color: #fff;
            overflow-x: hidden;
            padding-bottom: calc(var(--bottom-h) + env(safe-area-inset-bottom));
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0a1f0a, #020804);
        }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
            background: rgba(4,10,5,0.78); backdrop-filter: blur(28px) saturate(1.6);
            z-index: 1000; padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
        .logo-icon { font-size: 22px; filter: drop-shadow(0 0 8px rgba(139,202,139,0.5)); }
        .auth-buttons { display: flex; gap: 8px; }
        .btn-login {
            padding: 7px 18px; border-radius: 30px; font-weight: 500; font-size: 13px;
            cursor: pointer; background: transparent; border: 1px solid var(--green-border); color: white;
            transition: all 0.22s;
        }
        .btn-login:hover { background: var(--green-dim); }
        .btn-register {
            padding: 7px 18px; border-radius: 30px; font-weight: 600; font-size: 13px;
            cursor: pointer; background: linear-gradient(135deg, var(--green), var(--green-dark));
            border: none; color: #0d2010;
        }
        .btn-register:hover { opacity: 0.88; transform: scale(1.02); }
        .btn-logout {
            padding: 7px 16px; border-radius: 30px; font-weight: 600; font-size: 13px;
            cursor: pointer; background: rgba(220,38,38,0.18); border: 1px solid rgba(220,38,38,0.35);
            color: #ff6b6b;
        }
        .btn-logout:hover { background: rgba(220,38,38,0.32); }
        .search-btn {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
            border: 1px solid var(--border); width: 36px; height: 36px;
            border-radius: 50%; color: rgba(255,255,255,0.75); font-size: 15px;
            cursor: pointer; margin-right: 8px;
        }
        .search-btn:hover { background: var(--green-dim); color: var(--green); }
        #navUser { display: flex; align-items: center; gap: 2px; }
        .main-content { padding-top: calc(var(--nav-h) + 12px); min-height: 100vh; }
        .container { max-width: 680px; margin: 0 auto; padding: 0 16px; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-h);
            background: rgba(4,10,5,0.9); backdrop-filter: blur(28px);
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--text-muted); cursor: pointer; transition: all 0.22s;
            padding: 6px 14px; border-radius: 16px; min-width: 50px;
        }
        .nav-item i { font-size: 21px; transition: transform 0.2s; }
        .nav-item span { font-size: 9.5px; font-weight: 500; }
        .nav-item.active { color: var(--green); background: var(--green-dim); }
        .nav-item.active i { transform: scale(1.1); }
        .glass-card {
            background: var(--glass); backdrop-filter: blur(22px) saturate(1.4);
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            transition: all 0.28s;
        }
        .glass-card:hover { background: var(--glass-hover); border-color: var(--border-hover); }
        .btn-sm {
            padding: 8px 18px; font-size: 13px; border-radius: 30px;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            border: none; color: #0d2010; cursor: pointer; font-weight: 600;
            transition: all 0.22s; white-space: nowrap;
        }
        .btn-sm:hover { opacity: 0.88; transform: scale(1.02); }
        .btn-outline {
            background: transparent !important;
            border: 1px solid var(--green-border) !important;
            color: rgba(255,255,255,0.85) !important;
        }
        .btn-outline:hover { background: var(--green-dim) !important; color: var(--green) !important; }
        .btn-danger { background: rgba(220,38,38,0.2) !important; border: 1px solid rgba(220,38,38,0.35) !important; color: #ff6b6b !important; }
        .btn-danger:hover { background: rgba(220,38,38,0.35) !important; }
        .posts-grid { display: flex; flex-direction: column; gap: 14px; }
        .post-card { padding: 18px; }
        .post-header { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
        .post-avatar {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
            cursor: pointer; border: 2px solid var(--green-border);
        }
        .post-author { font-weight: 600; font-size: 14.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .post-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .post-text { margin-bottom: 12px; line-height: 1.6; font-size: 14px; color: rgba(255,255,255,0.88); }
        .post-image { max-width: 100%; border-radius: var(--radius-md); margin-bottom: 12px; cursor: pointer; display: block; }
        .post-video { max-width: 100%; border-radius: var(--radius-md); margin-bottom: 12px; cursor: pointer; background: #000; }
        .post-stats {
            display: flex; gap: 18px; padding: 10px 0;
            border-top: 1px solid var(--border);
        }
        .post-stats button {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            display: flex; gap: 6px; align-items: center; font-size: 13px;
            padding: 2px 6px; border-radius: 8px;
        }
        .post-stats button:hover { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.05); }
        .post-stats button.liked { color: var(--green); }
        .post-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .post-actions button {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 12px; padding: 4px 10px; border-radius: 8px;
        }
        .post-actions button:hover { background: rgba(255,255,255,0.07); color: white; }
        .rating-stars { color: #f5c518; font-size: 11px; letter-spacing: -1px; display: inline-flex; gap: 1px; }
        .comments-section { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
        .comment { display: flex; gap: 10px; margin-bottom: 10px; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .comment-content { background: rgba(255,255,255,0.05); border-radius: var(--radius-sm); padding: 8px 12px; flex: 1; }
        .comment-author { font-weight: 600; font-size: 12px; margin-bottom: 2px; color: var(--green); }
        .comment-text { font-size: 13px; color: rgba(255,255,255,0.82); line-height: 1.4; }
        .comment-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
        .new-comment { display: flex; gap: 8px; margin-top: 10px; }
        .new-comment input {
            flex: 1; padding: 9px 14px; border-radius: 30px;
            border: 1px solid var(--border); background: rgba(255,255,255,0.05);
            color: white; font-size: 13px; outline: none;
        }
        .new-comment input:focus { border-color: var(--green-border); }
        .profile-header { text-align: center; padding: 20px 0 16px; }
        .profile-avatar-wrap { position: relative; display: inline-block; }
        .profile-avatar-lg {
            width: 92px; height: 92px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--green); cursor: pointer;
            box-shadow: 0 0 0 6px rgba(139,202,139,0.12);
        }
        .profile-avatar-lg:hover { opacity: 0.82; }
        .avatar-edit-btn {
            position: absolute; bottom: 2px; right: 2px;
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--green); border: 2px solid #050a06;
            color: #0d2010; font-size: 11px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-name { font-size: 22px; font-weight: 700; margin-top: 12px; letter-spacing: -0.3px; }
        .profile-role-badge {
            display: inline-block; margin-top: 5px; padding: 3px 12px;
            background: var(--green-dim); border: 1px solid var(--green-border);
            border-radius: 20px; font-size: 11px; color: var(--green); font-weight: 500;
        }
        .profile-bio { color: var(--text-muted); margin-top: 8px; font-size: 13.5px; line-height: 1.5; max-width: 400px; margin-left: auto; margin-right: auto; }
        .profile-stats {
            display: flex; justify-content: center; gap: 0; margin: 18px 0 14px;
            background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-md);
            overflow: hidden;
        }
        .profile-stat {
            flex: 1; text-align: center; padding: 14px 8px;
            border-right: 1px solid var(--border);
        }
        .profile-stat:last-child { border-right: none; }
        .profile-stat .number { font-size: 20px; font-weight: 700; }
        .profile-stat .label { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .profile-actions {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 6px;
        }
        .profile-sections { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .collapsible-section {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: var(--radius-lg); overflow: hidden; transition: border-color 0.22s;
        }
        .collapsible-section.open { border-color: var(--green-border); }
        .collapsible-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px; cursor: pointer; user-select: none;
        }
        .collapsible-header:hover { background: rgba(255,255,255,0.03); }
        .collapsible-header-left { display: flex; align-items: center; gap: 10px; }
        .collapsible-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; background: var(--green-dim); flex-shrink: 0;
        }
        .collapsible-title { font-weight: 600; font-size: 15px; }
        .collapsible-subtitle { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
        .collapsible-chevron {
            color: var(--text-muted); font-size: 13px;
            transition: transform 0.28s; flex-shrink: 0;
        }
        .collapsible-section.open .collapsible-chevron { transform: rotate(180deg); color: var(--green); }
        .collapsible-body {
            max-height: 0; overflow: hidden;
            transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1), padding 0.28s;
            padding: 0 18px;
        }
        .collapsible-section.open .collapsible-body { max-height: 2000px; padding: 0 18px 18px; }
        .task-item {
            display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px;
            background: rgba(255,255,255,0.04); border-radius: var(--radius-md);
            margin-bottom: 8px; border: 1px solid var(--border);
        }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; margin-top: 1px; }
        .task-text { flex: 1; font-size: 13.5px; line-height: 1.4; }
        .task-due { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        .task-completed { opacity: 0.45; text-decoration: line-through; }
        .task-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px; }
        .task-delete:hover { color: #ff6b6b; }
        .section-add-btn {
            width: 100%; padding: 10px; border-radius: var(--radius-sm);
            background: var(--green-dim); border: 1px dashed var(--green-border);
            color: var(--green); cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.2s; margin-top: 4px;
        }
        .section-add-btn:hover { background: rgba(139,202,139,0.22); }
        .apple-calendar {
            background: rgba(20, 26, 22, 0.5);
            border-radius: 20px;
            padding: 12px;
            backdrop-filter: blur(12px);
        }
        .apple-calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .apple-calendar-header h3 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--green);
        }
        .apple-calendar-nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .apple-calendar-nav-btn:hover {
            background: var(--green-dim);
            color: var(--green);
        }
        .apple-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            margin-bottom: 12px;
        }
        .apple-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .apple-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.02);
            position: relative;
        }
        .apple-day:hover {
            background: rgba(139,202,139,0.2);
            transform: scale(1.02);
        }
        .apple-day.today {
            background: var(--green);
            color: #0d2010;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(139,202,139,0.3);
        }
        .apple-day.has-event {
            background: var(--green-dim);
            border: 1px solid var(--green-border);
            font-weight: 600;
            color: #8bca8b;
        }
        .apple-day.other-month {
            opacity: 0.3;
        }
        .event-dot-apple {
            width: 5px;
            height: 5px;
            background: var(--green);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }
        .appointment-item {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.04);
            border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .appt-info { flex: 1; min-width: 120px; }
        .appt-name { font-weight: 600; font-size: 14px; }
        .appt-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .appt-status { font-size: 11px; margin-top: 3px; }
        .status-pending { color: #f59e0b; }
        .status-confirmed { color: var(--green); }
        .status-completed { color: #9ca3af; text-decoration: line-through; }
        .appt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .notes-grid { display: flex; flex-direction: column; gap: 8px; }
        .note-card {
            padding: 12px 14px; background: rgba(255,255,255,0.04);
            border-radius: var(--radius-md); cursor: pointer; border: 1px solid var(--border);
        }
        .note-card:hover { background: rgba(255,255,255,0.07); border-color: var(--green-border); }
        .note-title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
        .note-preview { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        .certificates-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .certificate-card {
            background: rgba(255,255,255,0.05); border-radius: var(--radius-md);
            padding: 10px; text-align: center; width: 96px;
            border: 1px solid var(--border); position: relative;
        }
        .certificate-card:hover { border-color: var(--green-border); }
        .certificate-card img { width: 100%; height: 72px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 6px; }
        .certificate-title { font-size: 10.5px; font-weight: 500; word-break: break-word; color: rgba(255,255,255,0.8); }
        .delete-cert-btn {
            position: absolute; top: -7px; right: -7px;
            background: rgba(220,38,38,0.9); border: none; color: white;
            width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 11px;
            display: flex; align-items: center; justify-content: center;
        }
        .delete-cert-btn:hover { background: #dc2626; }
        .add-cert-card {
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 6px; height: 108px;
            background: var(--green-dim) !important;
            border: 1px dashed var(--green-border) !important;
            color: var(--green); font-size: 12px; font-weight: 500;
        }
        .add-cert-card i { font-size: 22px; }
        .add-cert-card:hover { background: rgba(139,202,139,0.22) !important; }
        .psychologists-list { display: flex; flex-direction: column; gap: 10px; }
        .psychologist-item {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px;
            cursor: pointer; transition: all 0.22s; border-radius: var(--radius-lg);
        }
        .psychologist-item:hover { background: var(--glass-hover); border-color: var(--border-hover); transform: translateX(3px); }
        .psychologist-avatar-list {
            width: 54px; height: 54px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--green-border); flex-shrink: 0;
        }
        .psychologist-info { flex: 1; min-width: 0; }
        .psychologist-name { font-weight: 600; font-size: 15.5px; }
        .psychologist-spec { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .psychologist-price { font-size: 12.5px; color: var(--green); margin-top: 4px; font-weight: 500; }
        .psychologist-chevron { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
        .chat-list { display: flex; flex-direction: column; gap: 8px; }
        .chat-contact {
            display: flex; align-items: center; gap: 14px; padding: 13px 16px;
            cursor: pointer; border-radius: var(--radius-lg); transition: all 0.22s;
            position: relative;
        }
        .chat-contact:hover { background: var(--glass-hover); border-color: var(--border-hover); }
        .chat-contact-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--green-border); flex-shrink: 0; }
        .chat-contact-info { flex: 1; min-width: 0; }
        .chat-contact-name { font-weight: 600; font-size: 15px; }
        .chat-contact-last { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge {
            background: var(--green); color: #0d2010; border-radius: 20px;
            padding: 3px 10px; font-size: 11px; font-weight: 700; flex-shrink: 0;
            min-width: 28px; text-align: center;
        }
        .chat-page {
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--nav-h) - var(--bottom-h));
            padding: 0 8px;
        }
        .chat-page .chat-messages-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--glass);
            backdrop-filter: blur(22px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }
        .chat-page .chat-messages-header {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .chat-page .chat-messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-messages-list::-webkit-scrollbar { width: 4px; }
        .chat-messages-list::-webkit-scrollbar-track { background: transparent; }
        .chat-messages-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
        .message {
            max-width: 72%; padding: 10px 14px; border-radius: 20px;
            word-wrap: break-word; animation: msgIn 0.2s ease;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .message.outgoing {
            align-self: flex-end; background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #0d2010; border-bottom-right-radius: 5px;
        }
        .message.incoming {
            align-self: flex-start; background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 5px;
        }
        .message-text { font-size: 14px; line-height: 1.45; }
        .message-time { font-size: 10px; opacity: 0.55; margin-top: 4px; text-align: right; }
        .message.incoming .message-time { text-align: left; }
        .chat-image {
            max-width: 180px;
            max-height: 140px;
            border-radius: var(--radius-sm);
            margin-top: 4px;
            cursor: pointer;
            transition: transform 0.1s;
            object-fit: cover;
        }
        .chat-image:hover { transform: scale(1.02); }
        .voice-message {
            display: flex;

            height: 36px;
            border-radius: 30px;
        }
        .speed-btn {
            background: rgba(139,202,139,0.2);

            font-size: 11px;

            padding: 4px 10px;

        }

        .chat-input-area input {

        .chat-controls button {

        .send-btn-chat:hover { opacity: 0.85; transform: scale(1.05); }
        .recording-active { background: rgba(220,38,38,0.8) !important; border-color: #dc2626 !important; color: white !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
        .notifications-list { display: flex; flex-direction: column; gap: 10px; }
        .notification-item { padding: 16px 18px; }

        .modal {
            position: fixed; inset: 0;

            display: flex; align-items: flex-end; justify-content: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.28s;
        }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            width: 100%; max-width: 560px;
            padding: 26px 24px 32px;

        .modal.active .modal-content { transform: translateY(0); }
        .modal-handle {
            width: 36px; height: 4px; background: rgba(255,255,255,0.18);

        }
        .modal-content h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%; padding: 12px 14px; border-radius: var(--radius-md);
            border: 1px solid var(--border); background: rgba(255,255,255,0.06);
            color: white; font-size: 14px; margin-bottom: 12px; outline: none;
            font-family: inherit;
        }
        .modal-content input:focus, .modal-content textarea:focus, .modal-content select:focus { border-color: var(--green-border); }
        .modal-content textarea { resize: vertical; min-height: 90px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 18px; }
        .modal-buttons button { flex: 1; padding: 13px; border-radius: 40px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, var(--green), var(--green-dark)); border: none; color: #0d2010; }
        .btn-primary:hover { opacity: 0.88; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: rgba(255,255,255,0.75); }

        .toast {

            border: 1px solid var(--green-border); border-radius: 40px;
            padding: 10px 20px; color: var(--green); font-size: 13px; font-weight: 500;
            z-index: 3000; animation: toastIn 0.3s ease; white-space: nowrap;

        }
        .toast.error { border-color: rgba(220,38,38,0.4); color: #ff6b6b; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .floating-notif {
            position: fixed;
            top: calc(var(--nav-h) + 8px);
            right: 16px;
            max-width: 280px;

            border-radius: 14px;

        .floating-notif.error { border-left-color: #ff6b6b; }
        .floating-notif.warning { border-left-color: #f5c518; }
        .back-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            color: white; font-size: 16px; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%;

        .time-slot {

        }
        .time-slot:hover { background: rgba(139,202,139,0.28); }
        .time-slot.selected { background: var(--green); color: #0d2010; border-color: var(--green); font-weight: 600; }
        .schedule-modal-list {
            max-height: 240px;

        .schedule-modal-form {

        .client-item {

        }
        .client-name { font-weight: 600; font-size: 14px; }
        .client-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .section-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-header-row h3 { font-size: 16px; font-weight: 600; }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 18px; letter-spacing: -0.3px; }

        .psych-page-header {

        .info-row {

        @media (max-width: 768px) {

            .btn-sm, .btn-login, .btn-register, .btn-logout { padding: 6px 14px; font-size: 12px; }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="logo-icon">🌿</span><span>Therapy Call</span></div>
        <div id="navAuth" class="auth-buttons">
            <button class="btn-login" onclick="openLoginModal()">Войти</button>
            <button class="btn-register" onclick="openRegisterModal()">Регистрация</button>
        </div>
        <div id="navUser" style="display:none">
            <button id="searchNavBtn" class="search-btn"><i class="fas fa-search"></i></button>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </nav>

    <main class="main-content" id="mainContent"></main>

    <div id="bottomNav" class="bottom-nav" style="display:none;">
        <div class="nav-item" data-tab="feed"><i class="fas fa-home"></i><span>Лента</span></div>
        <div class="nav-item" data-tab="psychologists"><i class="fas fa-users"></i><span>Психологи</span></div>
        <div class="nav-item" data-tab="chats"><i class="fas fa-comment-dots"></i><span>Чаты</span></div>
        <div class="nav-item" data-tab="notifications"><i class="fas fa-bell"></i><span>Уведомления</span></div>
        <div class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Профиль</span></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ======================= ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =======================
        let currentUser = null;
        let currentTab = 'feed';
        let socket = null;
        let allPsychologists = [];
        let currentChatPartner = null;
        let currentCalendarDate = new Date();
        let isLoading = false;
        let audioAllowed = false;
        let isPosting = false;
        let videoObserver = null;

        // ======================= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =======================
        function showToast(msg, isErr = false) {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const t = document.createElement('div');
            t.className = `toast${isErr ? ' error' : ''}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }

        async function fetchJSON(url, opt = {}) {
            try {
                const r = await fetch(url, opt);
                return await r.json();
            } catch(e) { showToast('Ошибка соединения', true); return { success: false }; }
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
        }

        function renderStars(r) {
            let s = '';
            const full = Math.floor(r);
            for (let i = 0; i < full; i++) s += '<i class="fas fa-star"></i>';
            for (let i = full; i < 5; i++) s += '<i class="far fa-star"></i>';
            return `<span class="rating-stars">${s}</span>`;
        }

        function toggleSection(el) {
            const section = el.closest('.collapsible-section');
            if (section) section.classList.toggle('open');
        }

        function playBeep() {
            if (!audioAllowed) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.3;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
                setTimeout(() => audioCtx.close(), 600);
            } catch(e) {}
        }

        document.body.addEventListener('click', () => { audioAllowed = true; }, { once: true });

        function showFloatingNotification(title, message, type = 'info') {
            const existing = document.querySelector('.floating-notif');
            if (existing) existing.remove();
            const notif = document.createElement('div');
            notif.className = `floating-notif ${type}`;
            notif.innerHTML = `<div class="fn-title">${escapeHtml(title)}</div><div class="fn-message">${escapeHtml(message)}</div>`;
            document.body.appendChild(notif);
            setTimeout(() => notif.classList.add('show'), 10);
            setTimeout(() => {
                notif.classList.remove('show');
                setTimeout(() => notif.remove(), 300);
            }, 5000);
            playBeep();
        }

        async function compressImage(file, maxSize = 1024, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = Math.round(height * (maxSize / width));
                            width = maxSize;
                        } else {
                            width = Math.round(width * (maxSize / height));
                            height = maxSize;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessagesList');
            if (container) {
                container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            }
        }

        function openImageModal(imgUrl) {
            const html = `
                <div class="modal" id="imageModal">
                    <div class="modal-content" style="max-width: 90vw; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 16px;">
                        <div class="modal-handle"></div>
                        <img src="${escapeHtml(imgUrl)}" style="width: 100%; height: auto; border-radius: 12px;">
                        <div class="modal-buttons" style="margin-top: 10px;">
                            <button class="btn-secondary" onclick="closeModal('imageModal')">Закрыть</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById('imageModal').classList.add('active'), 10);
        }

        // ======================= ОБНОВЛЕНИЕ ДАННЫХ ПОЛЬЗОВАТЕЛЯ =======================
        window.refreshUser = async function() {
            if (!currentUser) return;
            const r = await fetch(`/api/user/${currentUser.id}`);
            const d = await r.json();
            if (d.success) {
                currentUser = d.user;
                if (!currentUser.unreadCounts) currentUser.unreadCounts = {};
            }
        };

        // ======================= ИНИЦИАЛИЗАЦИЯ СОКЕТА =======================
        function initSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
            socket = io({
                transports: ['websocket', 'polling']
            });
            socket.on('connect', () => {
                console.log('Socket connected');
                if (currentUser) socket.emit('register_user', currentUser.id);
            });
            socket.on('connect_error', (err) => {
                console.error('Socket connect error:', err.message);
                showToast('Ошибка соединения с сервером', true);
            });
            socket.on('new_message', async (msg) => {
                await window.refreshUser();
                
                let preview = '';
                if (msg.text) preview = msg.text.substring(0,50);
                else if (msg.image) preview = '📷 Фото';
                else if (msg.voice) preview = '🎤 Голосовое';
                else preview = 'Вложение';
                
                const userRes = await fetch(`/api/user/${msg.from}`);
                const userData = await userRes.json();
                const senderName = userData.success ? userData.user.fullName : 'Кто-то';
                
                showFloatingNotification('Новое сообщение', `${senderName}: ${preview}`);
                
                if (currentChatPartner && msg.from === currentChatPartner.id) {
                    await fetch('/api/messages/read', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, fromUserId: msg.from }) });
                    await loadChatMessages();
                    scrollToBottom();
                    if (currentUser.unreadCounts && currentUser.unreadCounts[msg.from]) {
                        delete currentUser.unreadCounts[msg.from];
                    }
                    if (currentTab === 'chats') renderChats();
                } else {
                    if (currentUser && currentUser.unreadCounts) {
                        currentUser.unreadCounts[msg.from] = (currentUser.unreadCounts[msg.from] || 0) + 1;
                    }
                    if (currentTab === 'chats') {
                        renderChats();
                    }
                }
            });
            socket.on('notification', (notif) => {
                showFloatingNotification(notif.title, notif.message);
                if (currentUser) window.refreshUser();
                if (currentTab === 'notifications') renderNotifications();
            });
            socket.on('unread_update', (data) => {
                if (currentUser && data.from && data.count !== undefined) {
                    if (!currentUser.unreadCounts) currentUser.unreadCounts = {};
                    currentUser.unreadCounts[data.from] = data.count;
                    if (currentTab === 'chats') renderChats();
                }
            });
        }

        // ======================= ЛЕНТА =======================
        async function renderFeed() {
            document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;
            const data = await fetchJSON(`/api/posts?userId=${currentUser?.id || ''}`);
            if (!data.success) return;
            const posts = data.posts;
            let html = `<div class="container"><div class="posts-grid">`;
            for (const post of posts) {
                html += `
                    <div class="post-card glass-card" data-post-id="${post.id}">
                        <div class="post-header">
                            <img class="post-avatar" src="${escapeHtml(post.author.avatar)}" onclick="viewPsychologistPage('${post.author.id}')">
                            <div>
                                <div class="post-author" onclick="viewPsychologistPage('${post.author.id}')">
                                    ${escapeHtml(post.author.fullName)}
                                    ${renderStars(post.author.rating || 0)}
                                </div>
                                <div class="post-time">${new Date(post.createdAt).toLocaleString()}</div>
                            </div>
                        </div>
                        <div class="post-text">${escapeHtml(post.text)}</div>
                        ${post.image ? `<img class="post-image" src="${escapeHtml(post.image)}" onclick="openImageModal('${escapeHtml(post.image)}')">` : ''}
                        ${post.video ? `<video class="post-video" controls preload="metadata"><source src="${escapeHtml(post.video)}" type="video/mp4"></video>` : ''}
                        <div class="post-stats">
                            <button class="like-btn${post.userLiked ? ' liked' : ''}" data-id="${post.id}">
                                <i class="fa-${post.userLiked ? 'solid' : 'regular'} fa-heart"></i>
                                <span>${post.likesCount || 0}</span>
                            </button>
                            <button class="comment-toggle" data-id="${post.id}">
                                <i class="fa-regular fa-comment"></i>
                                <span>${post.commentsCount || 0}</span>
                            </button>
                        </div>
                        <div class="comments-section" id="comments-${post.id}" style="display:none">
                            <div class="comments-list">
                                ${(post.comments || []).map(c => `
                                    <div class="comment">
                                        <img class="comment-avatar" src="${escapeHtml(c.author.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=8bca8b&color=fff'">
                                        <div class="comment-content">
                                            <div class="comment-author">${escapeHtml(c.author.fullName)}</div>
                                            <div class="comment-text">${escapeHtml(c.text)}</div>
                                            <div class="comment-time">${new Date(c.createdAt).toLocaleString()}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            ${currentUser ? `
                            <div class="new-comment">
                                <input type="text" placeholder="Написать комментарий..." id="comment-input-${post.id}" onkeypress="if(event.key==='Enter')addComment('${post.id}')">
                                <button class="btn-sm" onclick="addComment('${post.id}')"><i class="fas fa-paper-plane"></i></button>
                            </div>` : ''}
                        </div>
                        ${currentUser && post.author.id === currentUser.id ? `
                        <div class="post-actions">
                            <button class="edit-post-btn" data-id="${post.id}"><i class="fas fa-pen"></i> Редактировать</button>
                            <button class="delete-post-btn" data-id="${post.id}"><i class="fas fa-trash-alt"></i> Удалить</button>
                        </div>` : ''}
                    </div>
                `;
            }
            if (posts.length === 0) html += '<div class="empty-state glass-card"><i class="fas fa-newspaper"></i><div>Пока нет постов</div></div>';
            html += `</div></div>`;
            document.getElementById('mainContent').innerHTML = html;
            initVideoObservers();
            attachFeedEvents();
        }

        function attachFeedEvents() {
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.onclick = async () => {
                    if (isLoading || !currentUser) { showToast('Войдите в аккаунт', true); return; }
                    isLoading = true;
                    const postId = btn.dataset.id;
                    const res = await fetch(`/api/posts/${postId}/like`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userId: currentUser.id }) });
                    const data = await res.json();
                    if (data.success) {
                        btn.querySelector('span').textContent = data.likesCount;
                        btn.classList.toggle('liked', data.liked);
                        btn.querySelector('i').className = data.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                    }
                    isLoading = false;
                };
            });
            document.querySelectorAll('.comment-toggle').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.dataset.id;
                    const div = document.getElementById(`comments-${id}`);
                    const isHidden = div.style.display === 'none';
                    div.style.display = isHidden ? 'block' : 'none';
                    btn.querySelector('i').className = isHidden ? 'fa-solid fa-comment' : 'fa-regular fa-comment';
                };
            });
            document.querySelectorAll('.edit-post-btn').forEach(btn => {
                btn.onclick = () => {
                    const postCard = btn.closest('.post-card');
                    const currentText = postCard.querySelector('.post-text').innerText;
                    openEditPostModal(btn.dataset.id, currentText);
                };
            });
            document.querySelectorAll('.delete-post-btn').forEach(btn => {
                btn.onclick = () => openConfirmModal('Удалить пост?', 'Это действие нельзя отменить.', async () => {
                    await fetch(`/api/posts/${btn.dataset.id}`, { method: 'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ authorId: currentUser.id }) });
                    renderFeed();
                });
            });
        }

        function openEditPostModal(postId, currentText) {
            const html = `
                <div class="modal" id="editPostModal">

                        <div class="modal-buttons">
                            <button class="btn-secondary" onclick="closeModal('editPostModal')">Отмена</button>
                            <button class="btn-primary" onclick="saveEditPost('${postId}')">Сохранить</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById('editPostModal').classList.add('active'), 10);
        }

        async function saveEditPost(postId) {
            const newText = document.getElementById('editPostText').value;
            if (!newText.trim()) { showToast('Текст не может быть пустым', true); return; }
            const fd = new FormData();
            fd.append('authorId', currentUser.id);
            fd.append('text', newText);
            await fetch(`/api/posts/${postId}`, { method: 'PUT', body: fd });
            closeModal('editPostModal');
            renderFeed();
        }

        async function addComment(postId) {
            if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input || !input.value.trim()) return;
            await fetch(`/api/posts/${postId}/comment`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userId: currentUser.id, text: input.value.trim() }) });
            input.value = '';
            renderFeed();
        }

        async function renderProfileCalendar() {
            const container = document.getElementById('profileCalendar');
            if (!container) return;
            const year = currentCalendarDate.getFullYear(), month = currentCalendarDate.getMonth();
            const firstDay = new Date(year, month, 1);
            let startDay = firstDay.getDay();
            startDay = startDay === 0 ? 6 : startDay - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevDays = new Date(year, month, 0).getDate();

            const [tasksRes] = await Promise.all([ fetchJSON(`/api/tasks/${currentUser.id}`) ]);
            const tasks = tasksRes.tasks || [];
            const appointments = currentUser.clients || [];
            const events = [];
            tasks.forEach(t => { if (t.dueDate) events.push({ date: t.dueDate, title: t.text, type: 'task', roomId: null }); });
            appointments.filter(a => a.status === 'confirmed').forEach(a => { events.push({ date: a.date, title: `Запись с ${a.clientName} в ${a.time}`, type: 'appointment', roomId: a.roomId }); });

            let daysHtml = '';
            for (let i = 0; i < startDay; i++) {
                daysHtml += `<div class="apple-day other-month">${prevDays - startDay + i + 1}</div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                const isToday = dateStr === new Date().toISOString().split('T')[0];
                daysHtml += `<div class="apple-day${dayEvents.length ? ' has-event' : ''}${isToday ? ' today' : ''}" data-date="${dateStr}" data-events='${JSON.stringify(dayEvents).replace(/'/g, "&#39;")}'>
                    ${d}${dayEvents.length && !isToday ? '<div class="event-dot-apple"></div>' : ''}
                </div>`;
            }
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

        function showScheduleEditor() {
            const schedule = currentUser.schedule || {};
            const renderSlots = () => {
                const sched = currentUser.schedule || {};
                const ds = Object.keys(sched).sort();
                return ds.length ? ds.map(d => `
                    <div style="margin-bottom:12px;">
                        <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${d}</div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;">
                            ${sched[d].map(t => `
                                <span style="display:inline-flex;align-items:center;gap:6px;background:var(--green-dim);border:1px solid var(--green-border);padding:4px 12px;border-radius:20px;font-size:13px;">
                                    ${t}
                                    <button onclick="removeSlot('${d}','${t}')" style="background:none;border:none;color:rgba(255,100,100,0.8);cursor:pointer;font-size:12px;padding:0;line-height:1;">✕</button>
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `).join('') : '<div class="empty-state" style="padding:20px;"><i class="fas fa-calendar-times"></i><div>Нет добавленного времени</div></div>';
            };

            const html = `
                <div class="modal" id="scheduleModal">
                    <div class="modal-content" style="max-height:85vh;display:flex;flex-direction:column;">
                        <div class="modal-handle"></div>
                        <h3>📅 Свободное время</h3>
                        <div class="schedule-modal-form">
                            <div style="display:flex;gap:8px;align-items:flex-end;">
                                <div style="flex:1;">
                                    <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Дата</label>
                                    <input type="date" id="slotDate" style="margin-bottom:0;width:100%;">
                                </div>
                                <div style="flex:1;">
                                    <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Время</label>
                                    <input type="time" id="slotTime" style="margin-bottom:0;width:100%;">
                                </div>
                                <button class="btn-sm" style="height:44px;margin-bottom:0;" onclick="addSlot()"><i class="fas fa-plus"></i> Добавить</button>
                            </div>
                        </div>
                        <div class="schedule-modal-list">
                            ${renderSlots()}
                        </div>
                        <div class="modal-buttons" style="margin-top:0;">
                            <button class="btn-secondary" onclick="closeModal('scheduleModal')">Закрыть</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById('scheduleModal').classList.add('active'), 10);

            window.addSlot = async () => {
                const date = document.getElementById('slotDate').value;
                const time = document.getElementById('slotTime').value;
                if (!date || !time) { showToast('Выберите дату и время', true); return; }
                const sched = currentUser.schedule || {};
                if (!sched[date]) sched[date] = [];
                if (sched[date].includes(time)) { showToast('Такое время уже есть', true); return; }
                sched[date].push(time); sched[date].sort();
                const res = await fetch('/api/schedule', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, schedule: sched }) });
                if (res.ok) {
                    currentUser.schedule = sched;
                    document.getElementById('scheduleModal').querySelector('.schedule-modal-list').innerHTML = renderSlots();
                    showToast('Время добавлено');
                }
            };

            window.removeSlot = async (date, time) => {
                const sched = currentUser.schedule || {};
                if (sched[date]) {
                    sched[date] = sched[date].filter(t => t !== time);
                    if (!sched[date].length) delete sched[date];
                    await fetch('/api/schedule', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: currentUser.id, schedule: sched }) });
                    currentUser.schedule = sched;
                    document.getElementById('scheduleModal').querySelector('.schedule-modal-list').innerHTML = renderSlots();
                }
            };
        }

        async function addTaskWithDate() {
            return new Promise((resolve) => {
                const modalId = 'addTaskModal_' + Date.now();
                const html = `
                    <div class="modal" id="${modalId}">
                        <div class="modal-content">
                            <div class="modal-handle"></div>
                            <h3>Новая задача</h3>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px;">Дата выполнения (необязательно)</label>
                            <input type="date" id="taskDueDate_${modalId}" style="margin-bottom:16px; width:100%;">
                            <input type="text" id="taskText_${modalId}" placeholder="Введите задачу..." style="margin-bottom:20px;">
                            <div class="modal-buttons">
                                <button class="btn-secondary" id="cancelTaskBtn_${modalId}">Отмена</button>
                                <button class="btn-primary" id="saveTaskBtn_${modalId}">Сохранить</button>
                            </div>
                        </div>
                    </div>`;
                document.body.insertAdjacentHTML('beforeend', html);
                const modal = document.getElementById(modalId);
                const textInput = document.getElementById(`taskText_${modalId}`);
                const dueDateInput = document.getElementById(`taskDueDate_${modalId}`);
                const cancelBtn = document.getElementById(`cancelTaskBtn_${modalId}`);
                const saveBtn = document.getElementById(`saveTaskBtn_${modalId}`);

                const cleanup = () => {
                    modal.classList.remove('active');
                    setTimeout(() => modal.remove(), 300);
                };

                saveBtn.onclick = async () => {
                    const text = textInput.value.trim();
                    if (!text) {
                        showToast('Введите текст задачи', true);
                        return;
                    }
                    const dueDate = dueDateInput.value || null;
                    await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ psychologistId: currentUser.id, text: text, dueDate: dueDate })
                    });
                    showToast('Задача добавлена');
                    cleanup();
                    renderProfile();
                    resolve();
                };
                cancelBtn.onclick = () => {
                    cleanup();
                    resolve();
                };
                setTimeout(() => modal.classList.add('active'), 10);
                textInput.focus();
            });
        }

        // ======================= ЧАТЫ =======================
        async function renderChats() {
            if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
            await window.refreshUser();
            document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;

            const messagesRes = await fetchJSON(`/api/messages/${currentUser.id}`);
            const messages = messagesRes.messages || [];
            const contactsMap = new Map();
            const unreadCountsFromServer = currentUser.unreadCounts || {};

            messages.forEach(msg => {
                const contactId = msg.from_user === currentUser.id ? msg.to_user : msg.from_user;
                if (!contactsMap.has(contactId)) {
                    contactsMap.set(contactId, {
                        lastMessage: msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение')),
                        lastTime: msg.created_at,
                    });
                } else {
                    const existing = contactsMap.get(contactId);
                    if (new Date(msg.created_at) > new Date(existing.lastTime)) {
                        existing.lastMessage = msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение'));
                        existing.lastTime = msg.created_at;
                    }
                }
            });

            const contacts = await Promise.all(Array.from(contactsMap.keys()).map(async id => {
                const r = await fetch(`/api/user/${id}`);
                const d = await r.json();
                if (d.success) {
                    const unread = unreadCountsFromServer[id] || 0;
                    return { ...d.user, ...contactsMap.get(id), unread };
                }
                return null;
            }));

            const validContacts = contacts.filter(Boolean).sort((a,b) => new Date(b.lastTime) - new Date(a.lastTime));

            let html = `<div class="container"><div class="page-title">Сообщения</div><div class="chat-list">`;
            for (const c of validContacts) {
                html += `
                    <div class="chat-contact glass-card" data-contact-id="${c.id}" onclick="openChat('${c.id}','${escapeHtml(c.fullName)}')">
                        <img class="chat-contact-avatar" src="${escapeHtml(c.avatar)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.fullName)}&background=8bca8b&color=fff'">
                        <div class="chat-contact-info">
                            <div class="chat-contact-name">${escapeHtml(c.fullName)}</div>
                            <div class="chat-contact-last">${escapeHtml((c.lastMessage || '').substring(0, 40))}</div>
                        </div>
                        ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
                    </div>
                `;
            }
            if (validContacts.length === 0) html += '<div class="empty-state glass-card" style="padding:40px;"><i class="fas fa-comment-slash"></i><div>Нет сообщений. Напишите психологу из раздела «Психологи»!</div></div>';
            html += `</div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function openChat(userId, userName) {
            currentChatPartner = { id: userId, name: userName };
            
            await fetch('/api/messages/read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, fromUserId: userId })
            });
            await window.refreshUser();
            
            if (currentUser.unreadCounts && currentUser.unreadCounts[userId]) {
                delete currentUser.unreadCounts[userId];
            }
            
            if (currentTab === 'chats') {
                const chatsContainer = document.querySelector('.chat-list');
                if (chatsContainer) {
                    const chatItems = document.querySelectorAll('.chat-contact');
                    for (const item of chatItems) {
                        const contactId = item.getAttribute('data-contact-id');
                        if (contactId === userId) {
                            const badge = item.querySelector('.unread-badge');
                            if (badge) badge.remove();
                            break;
                        }
                    }
                }
            }
            
            document.getElementById('mainContent').innerHTML = `
                <div class="chat-page">
                    <div class="chat-messages-container">
                        <div class="chat-messages-header">
                            <button class="back-btn" onclick="renderChats()"><i class="fas fa-arrow-left"></i></button>
                            <img src="" id="chatPartnerAvatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--green-border);" onerror="this.style.display='none'">
                            <div style="flex:1">
                                <div style="font-weight:600;font-size:15px;">${escapeHtml(userName)}</div>
                            </div>
                        </div>
                        <div class="chat-messages-list" id="chatMessagesList"></div>
                        <div class="chat-input-area">
                            <div class="chat-controls">
                                <button id="attachImageBtn" title="Фото"><i class="fas fa-image"></i></button>
                                <button id="voiceRecordBtn" title="Голосовое"><i class="fas fa-microphone"></i></button>
                            </div>
                            <input type="file" id="imageInput" accept="image/*" style="display:none">
                            <input type="text" id="chatMessageInput" placeholder="Сообщение...">
                            <button class="send-btn-chat" id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            `;
            
            await new Promise(resolve => setTimeout(resolve, 10));
            
            fetch(`/api/user/${userId}`).then(r => r.json()).then(d => {
                const av = document.getElementById('chatPartnerAvatar');
                if (av && d.success) av.src = d.user.avatar;
            }).catch(console.error);
            
            await loadChatMessages();
            scrollToBottom();
            
            const sendBtn = document.getElementById('sendMsgBtn');
            const chatInput = document.getElementById('chatMessageInput');
            const attachBtn = document.getElementById('attachImageBtn');
            const imageInput = document.getElementById('imageInput');
            const voiceBtn = document.getElementById('voiceRecordBtn');
            
            if (sendBtn) sendBtn.onclick = sendChatMessage;
            if (chatInput) chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendChatMessage(); };
            
            if (attachBtn && imageInput) {
                attachBtn.onclick = () => imageInput.click();
                imageInput.onchange = async () => {
                    const file = imageInput.files[0];
                    if (!file || !file.type.startsWith('image/')) { showToast('Только изображения', true); return; }
                    const compressedBlob = await compressImage(file, 1024, 0.8);
                    const formData = new FormData();
                    formData.append('image', compressedBlob, file.name);
                    const res = await fetch('/api/upload-chat-image', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        await fetch('/api/messages', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', image: data.imageUrl })
                        });
                        await loadChatMessages();
                        scrollToBottom();
                    }
                    imageInput.value = '';
                };
            }
            
            if (voiceBtn) {
                let mediaRecorder = null, audioChunks = [], isRecording = false;
                voiceBtn.onclick = async () => {
                    if (!isRecording) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                            audioChunks = [];
                            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                            mediaRecorder.onstop = async () => {
                                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                                const fd = new FormData();
                                fd.append('voice', blob, 'voice.webm');
                                const res = await fetch('/api/upload-voice', { method: 'POST', body: fd });
                                const data = await res.json();
                                if (data.success) {
                                    await fetch('/api/messages', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', voice: data.voiceUrl })
                                    });
                                    await loadChatMessages();
                                    scrollToBottom();
                                    showToast('Голосовое отправлено');
                                }
                                stream.getTracks().forEach(t => t.stop());
                                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                                voiceBtn.classList.remove('recording-active');
                                isRecording = false;
                            };
                            mediaRecorder.start();
                            isRecording = true;
                            voiceBtn.classList.add('recording-active');
                            voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
                            setTimeout(() => {
                                if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
                            }, 30000);
                        } catch(e) {
                            showToast('Нет доступа к микрофону', true);
                        }
                    } else {
                        if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
                    }
                };
            }
        }

        async function loadChatMessages() {
            if (!currentChatPartner) return;
            const res = await fetchJSON(`/api/messages/${currentUser.id}`);
            const messages = (res.messages || []).filter(m => (m.from_user === currentChatPartner.id && m.to_user === currentUser.id) || (m.from_user === currentUser.id && m.to_user === currentChatPartner.id));
            messages.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
            const listDiv = document.getElementById('chatMessagesList');
            if (!listDiv) return;
            let html = '';
            for (const m of messages) {
                let voiceHtml = '';
                if (m.voice) {
                    voiceHtml = `<div class="voice-message"><audio controls src="${escapeHtml(m.voice)}"></audio></div>`;
                }
                html += `
                    <div class="message ${m.from_user === currentUser.id ? 'outgoing' : 'incoming'}">
                        ${m.text ? `<div class="message-text">${escapeHtml(m.text)}</div>` : ''}
                        ${m.image ? `<img class="chat-image" src="${escapeHtml(m.image)}" onclick="openImageModal('${escapeHtml(m.image)}')">` : ''}
                        ${voiceHtml}
                        <div class="message-time">${new Date(m.created_at).toLocaleTimeString()}</div>
                    </div>
                `;
            }
            listDiv.innerHTML = html;
            document.querySelectorAll('.voice-message').forEach(container => {
                const audio = container.querySelector('audio');
                if (audio && !container.querySelector('.speed-btn')) {
                    const speeds = [1, 1.5, 2];
                    let currentSpeed = 1;
                    const btn = document.createElement('button');
                    btn.className = 'speed-btn';
                    btn.textContent = `${currentSpeed}x`;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        let idx = speeds.indexOf(currentSpeed);
                        idx = (idx + 1) % speeds.length;
                        currentSpeed = speeds[idx];
                        audio.playbackRate = currentSpeed;
                        btn.textContent = `${currentSpeed}x`;
                    };
                    container.appendChild(btn);
                }
            });
            scrollToBottom();
        }

        async function bookPsychologist(id, name) {
            const userRes = await fetch(`/api/user/${id}`);
            const userData = await userRes.json();
            if (!userData.success) {
                showToast('Не удалось загрузить данные психолога', true);
                return;
            }
            const psychologist = userData.user;
            const sched = psychologist.schedule || {};
            if (!allPsychologists.length) await fetchJSON('/api/psychologists').then(d => { allPsychologists = d.psychologists || []; });
            const p = allPsychologists.find(p => p.id === id);
            const dates = Object.keys(sched).sort();

            let slotsHtml = '';
            if (dates.length) {
                for (const d of dates) {
                    slotsHtml += `<div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${d}</div><div style="display:flex;flex-wrap:wrap;gap:6px;">`;
                    for (const t of sched[d]) {
                        slotsHtml += `<button class="time-slot" data-date="${d}" data-time="${t}">${t}</button>`;
                    }
                    slotsHtml += `</div></div>`;
                }
            } else {
                slotsHtml = '<div class="empty-state" style="padding:20px;"><i class="fas fa-calendar-times"></i><div>Нет свободного времени</div></div>';
            }

            const html = `
                <div class="modal" id="bookModal">
                    <div class="modal-content">
                        <div class="modal-handle"></div>
                        <h3>Записаться к ${name}</h3>
                        <div id="slots" style="max-height:300px;overflow-y:auto;">${slotsHtml}</div>
                        <div id="selSlot" style="margin-top:10px;font-size:13px;color:var(--green);min-height:20px;"></div>
                        <div class="modal-buttons">
                            <button class="btn-secondary" onclick="closeModal('bookModal')">Отмена</button>
                            <button class="btn-primary" id="confirmBook" disabled onclick="submitBook('${id}')">Записаться</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById('bookModal').classList.add('active'), 10);

            document.querySelectorAll('.time-slot').forEach(b => {
                b.onclick = () => {
                    document.querySelectorAll('.time-slot').forEach(bb => bb.classList.remove('selected'));
                    b.classList.add('selected');
                    document.getElementById('selSlot').textContent = `✅ Выбрано: ${b.dataset.date} в ${b.dataset.time}`;
                    document.getElementById('confirmBook').disabled = false;
                    window.selDate = b.dataset.date;
                    window.selTime = b.dataset.time;
                };
            });
        }

        async function submitBook(id) {
