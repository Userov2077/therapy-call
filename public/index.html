                const gender = document.getElementById('profileGender').value;
                const complaints = document.getElementById('profileComplaints').value;
                const goals = document.getElementById('profileGoals').value;
                
                const res = await authFetch('/api/client-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: uid,
                        birthDate,
                        gender,
                        emergencyContacts: contacts,
                        complaints,
                        goals
                    })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Профиль сохранён');
                    closeModal(modalId);
                } else {
                    showToast('Ошибка сохранения', true);
                    btn.disabled = false;
                }
            };
        }

        function logout() {
            openConfirmModal('Выйти из аккаунта?', '', () => {
                if (socket) socket.disconnect();
                localStorage.removeItem('token');
                localStorage.removeItem('userId');
                isFeedCacheValid = false;
                isProfileCacheValid = false;
                isPsychologistsCacheValid = false;
                isChatsCacheValid = false;
                isNotificationsCacheValid = false;
                isQuestionnairesCacheValid = false;
                feedPosts = [];
                currentUser = null;
                location.reload();
            });
        }

        // ======================= СОКЕТ =======================
        function initSocket() {
            if (socket) {
                socket.removeAllListeners();
                socket.disconnect();
                socket = null; 
            }
            const token = localStorage.getItem('token');
            if (!token) return;
            
            socket = io({
                query: { token },
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                timeout: 20000
            });
            
            socket.on('connect', () => { 
                if (currentUser) {
                    socket.emit('register_user', currentUser.id); 
                    
                    if (isCallActive && currentCallRoomId && currentCallRole) {
                        console.log('Auto-rejoining call room after reconnect...');
                        socket.emit('join-call-room', currentCallRoomId, currentUser.id, currentCallRole);
                    }

                    isChatsCacheValid = false;
                    refreshUser().then(() => {
                        if (currentTab === 'chats') {
                            // ИСПРАВЛЕНИЕ: Если мы уже внутри чата, не выкидываем пользователя в общий список!
                            if (!currentChatPartner) {
                                renderChats(true);
                            } else {
                                loadChatMessages(); // Просто тихо подгружаем новые сообщения
                            }
                        }
                    });
                }
            });
            
            socket.on('connect_error', (err) => { 
                console.error('Socket connect error:', err.message); 
            });
            
            socket.on('post_created', (newPost) => {
                // ИСПРАВЛЕНИЕ: Жесткая защита от дубликатов. 
                // Если пост с таким ID уже есть в ленте (мы его сами только что добавили) - игнорируем сокет.
                if (feedPosts.some(p => p.id === newPost.id)) return;

                feedPosts.unshift(newPost);
                if (currentTab === 'feed') {
                    const container = document.getElementById('postsContainer');
                    if (container) {
                        const newPostHtml = renderSinglePost(newPost);
                        container.insertAdjacentHTML('afterbegin', newPostHtml);
                        const newPostElement = container.firstElementChild;
                        attachEventsToPostElement(newPostElement);
                    }
                    feedOffset++;
                } else {
                    isFeedCacheValid = false;
                    if (currentTab === 'profile' && currentUser?.role === 'psychologist') {
                        renderProfile(true);
                    }
                }
            });
            socket.on('post_updated', (data) => {
                isFeedCacheValid = false; 
                if (currentTab === 'feed') {
                    const postElement = document.querySelector(`.post-card[data-post-id="${data.id}"]`);
                    if (postElement) {
                        const textDiv = postElement.querySelector('.post-text');
                        if (textDiv) textDiv.innerText = data.text;
                        const post = feedPosts.find(p => p.id === data.id);
                        if (post) post.text = data.text;
                    }
                } else if (currentTab === 'profile') {
                    renderProfile(true);
                }
            });
            socket.on('post_deleted', (postId) => {
                isFeedCacheValid = false; 
                if (currentTab === 'feed') {
                    const postElement = document.querySelector(`.post-card[data-post-id="${postId}"]`);
                    if (postElement) postElement.remove();
                    const index = feedPosts.findIndex(p => p.id === postId);
                    if (index !== -1) feedPosts.splice(index, 1);
                } else if (currentTab === 'profile') {
                    renderProfile(true);
                }
            });
            socket.on('comment_created', ({ postId, comment }) => {
                const commentsDiv = document.getElementById(`comments-${postId}`);
                if (commentsDiv) {
                    const commentsList = commentsDiv.querySelector('.comments-list');
                    if (commentsList) {
                        const isOwnComment = currentUser && String(currentUser.id) === String(comment.author.id);
                        const newCommentHtml = `
                            <div class="comment" data-comment-id="${comment.id}">
                                <img class="comment-avatar" src="${escapeHtml(optimizeMedia(comment.author.avatar, 'avatar'))}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=8bca8b&color=fff'">
                                <div class="comment-content">
                                    <div class="comment-author">${escapeHtml(comment.author.fullName)}</div>
                                    <div class="comment-text" id="comment-text-${comment.id}">${escapeHtml(comment.text)}</div>
                                    <div class="comment-time">Только что</div>
                                </div>
                                ${isOwnComment ? `
                                <div class="comment-actions">
                                    <button class="edit-comment-btn" data-id="${comment.id}" data-post-id="${postId}" data-text="${escapeHtml(comment.text)}"><i class="fas fa-pen"></i></button>
                                    <button class="delete-comment-btn" data-id="${comment.id}" data-post-id="${postId}"><i class="fas fa-trash-alt"></i></button>
                                </div>
                                ` : ''}
                            </div>
                        `;
                        const emptyState = commentsList.querySelector('.empty-state');
                        if (emptyState) emptyState.remove();
                        commentsList.insertAdjacentHTML('beforeend', newCommentHtml);
                        const commentSpan = document.querySelector(`.comment-toggle[data-id="${postId}"] span`);
                        if (commentSpan) commentSpan.textContent = (parseInt(commentSpan.textContent) || 0) + 1;
                        const post = feedPosts.find(p => p.id === postId);
                        if (post) post.commentsCount = (post.commentsCount || 0) + 1;
                        const newEditBtn = commentsList.querySelector(`.edit-comment-btn[data-id="${comment.id}"]`);
                        if (newEditBtn) newEditBtn.onclick = () => editComment(comment.id, postId, comment.text);
                        const newDeleteBtn = commentsList.querySelector(`.delete-comment-btn[data-id="${comment.id}"]`);
                        if (newDeleteBtn) newDeleteBtn.onclick = () => deleteComment(comment.id, postId);
                    }
                } else if (currentTab === 'feed') {
                    renderFeed(true);
                }
            });
            socket.on('comment_deleted', ({ commentId, postId }) => {
                const commentDiv = document.querySelector(`.comment[data-comment-id="${commentId}"]`);
                if (commentDiv) commentDiv.remove();
                const commentSpan = document.querySelector(`.comment-toggle[data-id="${postId}"] span`);
                if (commentSpan) commentSpan.textContent = Math.max(0, (parseInt(commentSpan.textContent) || 0) - 1);
                const post = feedPosts.find(p => p.id === postId);
                if (post) post.commentsCount = (post.commentsCount || 0) - 1;
            });
            socket.on('post_liked', ({ postId, likesCount, userId, liked }) => {
                const likeBtn = document.querySelector(`.like-btn[data-id="${postId}"]`);
                if (likeBtn) {
                    const span = likeBtn.querySelector('span');
                    if (span) span.textContent = likesCount;
                    if (liked) {
                        likeBtn.classList.add('liked');
                        likeBtn.querySelector('i').className = 'fa-solid fa-heart';
                    } else {
                        likeBtn.classList.remove('liked');
                        likeBtn.querySelector('i').className = 'fa-regular fa-heart';
                    }
                    const post = feedPosts.find(p => p.id === postId);
                    if (post) {
                        post.likesCount = likesCount;
                        post.userLiked = liked;
                    }
                } else if (currentTab === 'feed') {
                    renderFeed(true);
                }
            });
            socket.on('appointment_created', async (data) => {
                await refreshUser(); // Принудительно тянем свежие данные
                isProfileCacheValid = false;
                if (currentTab === 'profile') renderProfile(true);
            });
            socket.on('appointment_updated', async (apt) => {
                await refreshUser(); 
                isProfileCacheValid = false;
                if (currentTab === 'profile') renderProfile(true);
                if (currentTab === 'notifications') renderNotifications(true);
            });
            socket.on('appointment_completed', async (appointmentId) => {
                await refreshUser(); 
                isProfileCacheValid = false;
                if (currentTab === 'profile') renderProfile(true);
                if (currentTab === 'notifications') renderNotifications(true);
                showFloatingNotification('Сеанс завершён', 'Запись отмечена как завершённая', 'info');
            });
            socket.on('new_message', async (msg) => {
                let preview = '';
                if (msg.text) preview = msg.text.substring(0, 50);
                else if (msg.image) preview = '📷 Фото';
                else if (msg.voice) preview = '🎤 Голосовое';
                else preview = 'Вложение';
                if (currentChatPartner && msg.from === currentChatPartner.id) {
                    appendMessageToChat(msg);
                    scrollToBottom();
                    await fetchJSON('/api/messages/read', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentUser.id, fromUserId: msg.from })
                    }).catch(console.error);
                    if (currentUser.unreadCounts) delete currentUser.unreadCounts[msg.from];
                    updateChatListUnread(msg.from, 0);
                    return;
                }
                if (currentUser && currentUser.unreadCounts) {
                    currentUser.unreadCounts[msg.from] = (currentUser.unreadCounts[msg.from] || 0) + 1;
                }
                if (currentTab === 'chats') {
                    renderChats(true);
                } else {
                    isChatsCacheValid = false;
                }
                try {
                    const userRes = await fetchJSON(`/api/user/${msg.from}`);
                    const senderName = userRes.success ? userRes.user.fullName : 'Новое сообщение';
                    showFloatingNotification('Новое сообщение', `${senderName}: ${preview}`);
                    
                    // БЕЗОПАСНЫЙ ВЫЗОВ УВЕДОМЛЕНИЙ ДЛЯ PWA (Изолируем в отдельный try/catch)
                    try {
                        if ('Notification' in window && Notification.permission === 'granted') {
                            if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                                navigator.serviceWorker.ready.then(reg => {
                                    reg.showNotification('Новое сообщение', { body: `${senderName}: ${preview}`, icon: '/icons/icon-512.png' });
                                }).catch(e => console.log('SW Notification skipped'));
                            } else {
                                new Notification('Новое сообщение', { body: `${senderName}: ${preview}` });
                            }
                        }
                    } catch(err) { /* Игнорируем ошибку нативных пушей */ }

                    // ТЕПЕРЬ КОД ДОЙДЕТ СЮДА И ОБНОВИТ НАКЛЕЙКИ
                    if (!currentChatPartner && currentTab === 'chats') {
                        renderChats(true);
                    } else if (!currentChatPartner) {
                        const chatListExists = document.querySelector('.chat-list');
                        if (chatListExists) {
                            updateChatListItem(msg, senderName, preview);
                        }
                    }
                } catch(e) { console.error(e); }
            });
            socket.on('notification', (notif) => {
                if (notif.type === 'request_review') {
                    showFloatingNotification(notif.title, notif.message, 'info');
                    
                    // Показываем модалку после задержки, чтобы звонок успел закрыться
                    setTimeout(() => {
                        const modalId = 'reviewPromptModal_' + Date.now();
                        const html = `
                            <div class="modal" id="${modalId}" style="z-index: 9999;">
                                <div class="modal-content">
                                    <div class="modal-handle"></div>
                                    <h3 style="text-align:center; color:var(--green);"><i class="fas fa-star"></i> Оцените сессию</h3>
                                    <p style="text-align:center; color:rgba(255,255,255,0.8); margin-bottom:20px; font-size:15px;">
                                        ${escapeHtml(notif.message)}
                                    </p>
                                    <div class="modal-buttons" style="flex-direction: column; gap: 10px; display: flex;">
                                        <button class="btn-primary" style="width: 100%; padding: 14px;" onclick="closeModal('${modalId}'); openReviewModalWithAppointment('${notif.psychologistId}', '${escapeHtml(notif.psychologistName)}', '${notif.appointmentId}');">Оценить сейчас</button>
                                        <button class="btn-secondary" style="width: 100%; padding: 14px;" onclick="closeModal('${modalId}')">Позже</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        document.body.insertAdjacentHTML('beforeend', html);
                        setTimeout(() => document.getElementById(modalId).classList.add('active'), 10);
                    }, 1500);
                    
                    // ВАЖНО: Мы убрали отсюда return; чтобы код пошел дальше и сохранил уведомление в список!
                } else {
                    showFloatingNotification(notif.title, notif.message);
                }
                
                if (currentUser) refreshUser();
                isNotificationsCacheValid = false;
                if (currentTab === 'notifications') {
                    renderNotifications(true);
                }
            });
            socket.on('unread_update', (data) => {
                if (currentUser && data.from && data.count !== undefined) {
                    if (!currentUser.unreadCounts) currentUser.unreadCounts = {};
                    currentUser.unreadCounts[data.from] = data.count;
                    if (!currentChatPartner && currentTab === 'chats') {
                        renderChats(true);
                    } else if (!currentChatPartner) {
                        updateChatListUnread(data.from, data.count);
                    }
                }
            });
        }

        // ======================= НАПОМИНАНИЯ =======================
        function checkUpcomingEvents() {
            if (!currentUser) return;
            const now = new Date();
            const appointments = currentUser.role === 'psychologist' ? (currentUser.clients || []) : (currentUser.appointments || []);
            for (const apt of appointments) {
                if (apt.status === 'confirmed') {
                    const eventDate = new Date(apt.date + 'T' + apt.time);
                    const diff = (eventDate - now) / (1000 * 60);
                    if (diff > 0 && diff <= 60 && !localStorage.getItem(`notified_${apt.appointmentId}`)) {
                        showFloatingNotification('Скоро созвон', `Запись с ${apt.clientName || apt.psychologistName} через ${Math.round(diff)} минут`, 'warning');
                        localStorage.setItem(`notified_${apt.appointmentId}`, '1');
                    }
                }
            }
            if (currentUser.role === 'psychologist') {
                fetchJSON(`/api/tasks/${currentUser.id}`).then(res => {
                    for (const task of (res.tasks || [])) {
                        if (!task.completed && task.dueDate) {
                            const due = new Date(task.dueDate);
                            const today = new Date(); today.setHours(0,0,0,0);
                            const daysDiff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                            if (daysDiff === 0 && !localStorage.getItem(`task_today_${task.id}`)) {
                                showFloatingNotification('Задача на сегодня', task.text, 'warning');
                                localStorage.setItem(`task_today_${task.id}`, '1');
                            } else if (daysDiff === 1 && !localStorage.getItem(`task_tomorrow_${task.id}`)) {
                                showFloatingNotification('Задача на завтра', task.text, 'info');
                                localStorage.setItem(`task_tomorrow_${task.id}`, '1');
                            }
                        }
                    }
                });
            }
        }

        // ======================= ЛЕНТА =======================
        async function editComment(commentId, postId, oldText) {
            const newText = prompt('Редактировать комментарий:', oldText);
            if (!newText || newText === oldText) return;
            const res = await fetchJSON(`/api/posts/${postId}/comment/${commentId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, text: newText })
            });
            if (res.success) {
                const commentTextDiv = document.getElementById(`comment-text-${commentId}`);
                if (commentTextDiv) commentTextDiv.innerText = newText;
                showToast('Комментарий обновлён');
            } else {
                showToast('Ошибка', true);
            }
        }

        async function deleteComment(commentId, postId) {
            if (!confirm('Удалить комментарий?')) return;
            const res = await fetchJSON(`/api/posts/${postId}/comment/${commentId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id })
            });
            if (res.success) {
                const commentDiv = document.querySelector(`.comment[data-comment-id="${commentId}"]`);
                if (commentDiv) commentDiv.remove();
                const commentSpan = document.querySelector(`.comment-toggle[data-id="${postId}"] span`);
                if (commentSpan) commentSpan.textContent = Math.max(0, (parseInt(commentSpan.textContent) || 0) - 1);
                showToast('Комментарий удалён');
            } else {
                showToast('Ошибка', true);
            }
        }

        async function renderFeed(forceRefresh = false) {
            if (!forceRefresh && isFeedCacheValid && feedPosts.length > 0) {
                document.getElementById('mainContent').innerHTML = `<div class="container"><div class="posts-grid" id="postsContainer"></div></div>`;
                renderFeedPosts();
                if (feedHasMore && !document.getElementById('loadMoreBtn')) {
                    const btn = document.createElement('button');
                    btn.id = 'loadMoreBtn';
                    btn.className = 'btn-sm';
                    btn.textContent = 'Загрузить ещё';
                    btn.style.margin = '20px auto';
                    btn.style.display = 'block';
                    btn.onclick = () => loadMoreFeed();
                    document.getElementById('postsContainer').after(btn);
                }
                return;
            }
            feedOffset = 0;
            feedPosts = [];
            feedHasMore = true;
            document.getElementById('mainContent').innerHTML = `<div class="container"><div class="posts-grid" id="postsContainer"></div><div id="feedLoader" style="text-align:center; padding:20px;"><i class="fas fa-circle-notch fa-spin"></i> Загрузка...</div></div>`;
            await loadMoreFeed();
            isFeedCacheValid = true;
        }

        async function loadMoreFeed() {
            if (!feedHasMore) return;
            const data = await fetchJSON(`/api/posts?limit=12&offset=${feedOffset}&userId=${currentUser?.id || ''}`);
            if (data.success) {
                const newPosts = data.posts;
                feedPosts = feedPosts.concat(newPosts);
                feedOffset += newPosts.length;
                feedHasMore = data.hasMore || false;
                renderFeedPosts();
                if (feedHasMore) {
                    let btn = document.getElementById('loadMoreBtn');
                    if (!btn) {
                        btn = document.createElement('button');
                        btn.id = 'loadMoreBtn';
                        btn.className = 'btn-sm';
                        btn.textContent = 'Загрузить ещё';
                        btn.style.margin = '20px auto';
                        btn.style.display = 'block';
                        btn.onclick = () => loadMoreFeed();
                        document.getElementById('postsContainer').after(btn);
                    }
                } else {
                    const btn = document.getElementById('loadMoreBtn');
                    if (btn) btn.remove();
                }
                document.getElementById('feedLoader')?.remove();
            } else {
                document.getElementById('feedLoader').innerHTML = '<div class="empty-state glass-card"><i class="fas fa-exclamation-triangle"></i><div>Ошибка загрузки</div></div>';
            }
        }

        function renderFeedPosts() {
            const container = document.getElementById('postsContainer');
            if (!container) return;
            let html = '';
            for (const post of feedPosts) {
                html += renderSinglePost(post);
            }
            container.innerHTML = html;
            document.querySelectorAll('.post-card').forEach(card => attachEventsToPostElement(card));
            initVideoObservers();
        }

        function renderSinglePost(post) {
            const authorName = post.author?.fullName || 'Неизвестный';
            const authorAvatar = post.author?.avatar || '';
            const authorId = post.author?.id || '';
            const authorRating = post.author?.rating || 0;

            return `
                <div class="post-card glass-card" data-post-id="${post.id}">
                    <div class="post-header">
                        <img class="post-avatar" src="${escapeHtml(optimizeMedia(authorAvatar, 'avatar'))}" onclick="viewPsychologistPage('${authorId}')" onerror="this.src='https://ui-avatars.com/api/?name=U&background=8bca8b&color=fff'">
                        <div>
                            <div class="post-author" onclick="viewPsychologistPage('${authorId}')">
                                ${escapeHtml(authorName)}
                                ${renderStars(authorRating)}
                            </div>
                            <div class="post-time">${new Date(post.createdAt).toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="post-text">${escapeHtml(post.text)}</div>
                    ${post.image ? `<img class="post-image" src="${escapeHtml(optimizeMedia(post.image, 'image'))}" onclick="openImageModal('${escapeHtml(post.image)}')">` : ''}
                    ${post.video ? `<video class="post-video feed-video" muted playsinline disablePictureInPicture preload="metadata" onclick="this.currentTime=0; this.play();"><source src="${escapeHtml(post.video)}" type="video/mp4"></video>` : ''}
                    <div class="post-stats">
                        <button class="like-btn${post.userLiked ? ' liked' : ''}" data-id="${post.id}">
                            <i class="fa-${post.userLiked ? 'solid' : 'regular'} fa-heart"></i>
                            <span>${post.likesCount || 0}</span>
                        </button>
                        <button class="comment-toggle" data-id="${post.id}" data-loaded="false">
                            <i class="fa-regular fa-comment"></i>
                            <span>${post.commentsCount || 0}</span>
                        </button>
                    </div>
                    <div class="comments-section" id="comments-${post.id}" style="display:none">
                        <div class="comments-list"></div>
                        ${currentUser ? `<div class="new-comment"><input type="text" placeholder="Написать комментарий..." id="comment-input-${post.id}" onkeypress="if(event.key==='Enter')addComment('${post.id}')"><button class="btn-sm" onclick="addComment('${post.id}')"><i class="fas fa-paper-plane"></i></button></div>` : ''}
                    </div>
                    ${currentUser && authorId === currentUser.id ? `
                    <div class="post-actions">
                        <button class="edit-post-btn" data-id="${post.id}"><i class="fas fa-pen"></i> Редактировать</button>
                        <button class="delete-post-btn" data-id="${post.id}"><i class="fas fa-trash-alt"></i> Удалить</button>
                    </div>` : ''}
                </div>
            `;
        }

        function attachEventsToPostElement(postElement) {
            const likeBtn = postElement.querySelector('.like-btn');
            if (likeBtn) {
                likeBtn.onclick = async () => {
                    if (isLoading || !currentUser) { openLoginModal(); return; }
                    isLoading = true;
                    const postId = likeBtn.dataset.id;
                    const data = await fetchJSON(`/api/posts/${postId}/like`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentUser.id })
                    });
                    if (data.success) {
                        likeBtn.querySelector('span').textContent = data.likesCount;
                        likeBtn.classList.toggle('liked', data.liked);
                        likeBtn.querySelector('i').className = data.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                        const post = feedPosts.find(p => p.id === postId);
                        if (post) { post.likesCount = data.likesCount; post.userLiked = data.liked; }
                    }
                    isLoading = false;
                };
            }
            const commentToggle = postElement.querySelector('.comment-toggle');
            if (commentToggle) {
                commentToggle.onclick = async () => {
                    const postId = commentToggle.dataset.id;
                    const div = document.getElementById(`comments-${postId}`);
                    const isHidden = div.style.display === 'none';
                    div.style.display = isHidden ? 'block' : 'none';
                    commentToggle.querySelector('i').className = isHidden ? 'fa-solid fa-comment' : 'fa-regular fa-comment';
                    if (isHidden && commentToggle.dataset.loaded === 'false') {
                        await loadCommentsForPost(postId);
                        commentToggle.dataset.loaded = 'true';
                    }
                };
            }
            const editBtn = postElement.querySelector('.edit-post-btn');
            if (editBtn) {
                editBtn.onclick = () => {
                    const postCard = editBtn.closest('.post-card');
                    const currentText = postCard.querySelector('.post-text').innerText;
                    openEditPostModal(editBtn.dataset.id, currentText);
                };
            }
            const deleteBtn = postElement.querySelector('.delete-post-btn');
            if (deleteBtn) {
                deleteBtn.onclick = () => openConfirmModal('Удалить пост?', 'Это действие нельзя отменить.', async () => {
                    await fetchJSON(`/api/posts/${deleteBtn.dataset.id}`, {
                        method: 'DELETE',

        async function saveEditPost(postId) {
            const newText = document.getElementById('editPostText').value;
            if (!newText.trim()) { showToast('Текст не может быть пустым', true); return; }
            
            const btn = document.getElementById('saveEditPostBtn');
            btn.disabled = true;

            const data = await fetchJSON(`/api/posts/${postId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ authorId: currentUser.id, text: newText })
            });
            if (data.success) {
                closeModal('editPostModal');
                const post = feedPosts.find(p => p.id === postId);
                if (post) post.text = newText;
                renderFeedPosts();
                showToast('Пост обновлён');
            } else {
                showToast('Ошибка', true);
                btn.disabled = false;
            }
        }

        async function addComment(postId) {
            if (!currentUser) { openLoginModal(); return; }
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input?.value.trim();
            if (!text) return;
            const sendBtn = input.nextElementSibling;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                const data = await fetchJSON(`/api/posts/${postId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id, text })
                });
                if (data.success) {
                    input.value = '';
                }
            } catch (err) {
                showToast('Ошибка соединения', true);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }
        }

        function renderAppointmentsList(filter = 'upcoming') {
            const container = document.getElementById('appointmentsList');
            if (!container) return;
            const allAppointments = currentUser?.clients || [];
            const now = new Date();
            
            // ИСПРАВЛЕНИЕ ЛОГИКИ ФИЛЬТРОВ: Даем запас в 2 часа на "Предстоящие", чтобы звонок не исчезал во время сеанса
            let filtered = [];
            if (filter === 'upcoming') {
                filtered = allAppointments.filter(a => {
                    if (a.status !== 'confirmed') return false;
                    const aptTime = new Date(a.date + 'T' + a.time);
                    aptTime.setHours(aptTime.getHours() + 2); // Сеанс считается предстоящим/текущим еще 2 часа после начала
                    return aptTime >= now;
                });
            } else if (filter === 'past') {
                filtered = allAppointments.filter(a => {
                    if (a.status === 'completed') return true;
                    if (a.status === 'confirmed') {
                        const aptTime = new Date(a.date + 'T' + a.time);
                        aptTime.setHours(aptTime.getHours() + 2);
                        return aptTime < now; // Ушло в прошлое, но зависло в confirmed
                    }
                    return false;
                });
            } else if (filter === 'pending') {
                filtered = allAppointments.filter(a => a.status === 'pending');
            }
            
            const subtitle = document.getElementById('appointmentsSubtitle');
            if (subtitle) {
                if (filter === 'upcoming') subtitle.textContent = `${filtered.length} предстоящих`;
                else if (filter === 'past') subtitle.textContent = `${filtered.length} прошедших`;
                else subtitle.textContent = `${filtered.length} ожидают подтверждения`;
            }
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding:20px;"><i class="fas fa-calendar-times"></i><div>Нет записей</div></div>';
                return;
            }
            let html = '';
            filtered.forEach(apt => {
                const isCompleted = apt.status === 'completed';
                const isStuck = apt.status === 'confirmed' && filter === 'past'; // Зависший звонок
                
                html += `
                    <div class="appointment-item">
                        <div class="appt-info">
                            <div class="appt-name">${escapeHtml(apt.clientName)}</div>
                            <div class="appt-time">📅 ${apt.date} в ${apt.time}</div>
                            <div class="appt-status ${apt.status === 'confirmed' ? 'status-confirmed' : (apt.status === 'pending' ? 'status-pending' : 'status-completed')}">
                                ${apt.status === 'confirmed' ? (isStuck ? '⚠️ Не завершён' : '✅ Подтверждено') : (apt.status === 'pending' ? '⏳ Ожидает' : '✅ Завершён')}
                            </div>
                        </div>
                        <div class="appt-actions">
                            ${apt.status === 'pending' ? `<button class="btn-sm" onclick="confirmAppointment('${apt.appointmentId}','${apt.clientId}')">Подтвердить</button>` : ''}
                            ${apt.status === 'confirmed' && filter === 'upcoming' ? `<button class="btn-sm" onclick="startCall('${apt.roomId}', 'psychologist', '${apt.clientId}')"><i class="fas fa-video"></i> Начать</button>` : ''}
                            
                            <!-- ИСПРАВЛЕНИЕ: Кнопка ручного завершения для зависших звонков -->
                            ${isStuck ? `<button class="btn-sm btn-outline" style="color:#ff6b6b; border-color:#ff6b6b;" onclick="manualCompleteAppointment('${apt.appointmentId}')"><i class="fas fa-check"></i> Завершить</button>` : ''}
                            
                            ${isCompleted ? '<i class="fas fa-check-circle" style="color:var(--green); font-size:20px;"></i>' : ''}
                            <button class="btn-sm btn-outline" onclick="startChatWith('${apt.clientId}','${escapeHtml(apt.clientName)}')"><i class="fas fa-comment-dots"></i> Чат</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function renderProfileCalendar() {
            const container = document.getElementById('profileCalendar');
            if (!container) return;
            const year = currentCalendarDate.getFullYear(), month = currentCalendarDate.getMonth();
            const firstDay = new Date(year, month, 1);
            let startDay = firstDay.getDay();
            startDay = startDay === 0 ? 6 : startDay - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevDays = new Date(year, month, 0).getDate();
            const tasksRes = await fetchJSON(`/api/tasks/${currentUser.id}`);
            const tasks = tasksRes.tasks || [];
            const appointments = currentUser.clients || [];
            const events = [];
            tasks.forEach(t => { if (t.dueDate) events.push({ date: t.dueDate, title: t.text, type: 'task' }); });
            appointments.filter(a => a.status === 'confirmed').forEach(a => { events.push({ date: a.date, title: `Запись с ${a.clientName} в ${a.time}`, type: 'appointment', roomId: a.roomId, clientId: a.clientId }); });
            let daysHtml = '';
            for (let i = 0; i < startDay; i++) { daysHtml += `<div class="apple-day other-month">${prevDays - startDay + i + 1}</div>`; }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                const isToday = dateStr === new Date().toISOString().split('T')[0];
                
                // ИСПРАВЛЕНИЕ: Безопасное кодирование массива событий для HTML-атрибута
                const safeEventsData = encodeURIComponent(JSON.stringify(dayEvents));
                
                daysHtml += `<div class="apple-day${dayEvents.length ? ' has-event' : ''}${isToday ? ' today' : ''}" data-date="${dateStr}" data-events="${safeEventsData}">${d}${dayEvents.length && !isToday ? '<div class="event-dot-apple"></div>' : ''}</div>`;
            }
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            container.innerHTML = `<div class="apple-calendar"><div class="apple-calendar-header"><button class="apple-calendar-nav-btn" onclick="changeProfileMonth(-1)"><i class="fas fa-chevron-left"></i></button><h3>${monthNames[month]} ${year}</h3><button class="apple-calendar-nav-btn" onclick="changeProfileMonth(1)"><i class="fas fa-chevron-right"></i></button></div><div class="apple-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="apple-days" id="appleDaysContainer">${daysHtml}</div></div>`;
            
            document.querySelectorAll('.apple-day').forEach(day => { 
                day.onclick = () => { 
                    // ИСПРАВЛЕНИЕ: Декодируем обратно
                    const rawData = day.getAttribute('data-events');
                    if (!rawData) return;
                    const evs = JSON.parse(decodeURIComponent(rawData)); 
                    if (evs.length) showDayEventsApple(day.getAttribute('data-date'), evs); 
                    else showToast('Нет событий на эту дату'); 
                }; 
            });
        }

        window.changeProfileMonth = (delta) => { currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta); renderProfileCalendar(); };

                document.body.insertAdjacentHTML('beforeend', html);
                const modal = document.getElementById(modalId);
                const textInput = document.getElementById(`taskText_${modalId}`);
                const dueDateInput = document.getElementById(`taskDueDate_${modalId}`);
                const cancelBtn = document.getElementById(`cancelTaskBtn_${modalId}`);
                const saveBtn = document.getElementById(`saveTaskBtn_${modalId}`);
                const cleanup = () => { modal.classList.remove('active'); setTimeout(() => modal.remove(), 300); };
                
                saveBtn.onclick = async () => {

        async function saveNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            if (!title || !content) { showToast('Заполните все поля', true); return; }
            
            const btn = document.getElementById('saveNoteBtn');
            btn.disabled = true;

            const file = document.getElementById('noteFile')?.files[0];
            let att = null, attT = null;
            if (file) {
                if (file.size > 5 * 1024 * 1024) { showToast('Файл не должен превышать 5 МБ', true); btn.disabled = false; return; }
                const fd = new FormData(); fd.append('file', file);
                const r = await authFetch('/api/upload', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.success) { att = d.fileUrl; attT = file.type.startsWith('image/') ? 'image' : 'file'; }
                else { showToast(d.error || 'Ошибка загрузки файла', true); btn.disabled = false; return; }
            }
            const data = await fetchJSON('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ psychologistId: currentUser.id, title, content, attachment: att, attachmentType: attT }) });
            if (data.success) { closeModal('noteModal'); showToast('Заметка сохранена'); renderProfile(true); }
            else { showToast(data.error || 'Ошибка сохранения заметки', true); btn.disabled = false; }
        }

            const input = document.createElement('input');

                const file = input.files[0];
                if (!file) return;
                const fd = new FormData();
                fd.append('userId', currentUser.id);
                fd.append('title', title);
                fd.append('certificate', file);
                showToast('Загружаем...');
                const data = await fetchJSON('/api/certificates', { method:'POST', body: fd });
                if (data.success) {
                    if (data.user) currentUser = data.user;
                    else await refreshUser();
                    showToast('Сертификат добавлен');
                    renderProfile(true);
                    setTimeout(() => { const sec = document.getElementById('sec-certs'); if (sec && !sec.classList.contains('open')) sec.classList.add('open'); }, 100);

        // ======================= НОВЫЙ ПОСТ =======================
        function createPostModal() {
            const modalId = 'cpModal';
            const html = `<div class="modal" id="${modalId}"><div class="modal-content"><div class="modal-handle"></div><h3>Новый пост</h3><textarea id="postText" rows="5" placeholder="Поделитесь чем-то полезным..."></textarea><label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;">Фото или видео (необязательно, видео до 1 минуты)</label><input type="file" id="postMedia" accept="image/*,video/*" style="font-size:12px;"><div id="mediaPreview" style="margin-top:8px; display:none;"></div><div id="uploadProgress" style="display:none;" class="upload-progress"><div class="upload-progress-bar"></div></div><div class="modal-buttons"><button class="btn-secondary" onclick="closeModal('${modalId}')">Отмена</button><button class="btn-primary" id="publishPostBtn">Опубликовать</button></div></div></div>`;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => document.getElementById(modalId).classList.add('active'), 10);
            const mediaInput = document.getElementById('postMedia');
            const previewDiv = document.getElementById('mediaPreview');
            const progressDiv = document.getElementById('uploadProgress');
            const progressBar = progressDiv.querySelector('.upload-progress-bar');
            const publishBtn = document.getElementById('publishPostBtn');
            let selectedFile = null;
            mediaInput.onchange = async () => {
                const file = mediaInput.files[0];
                if (!file) return;

                // 1. ПРОВЕРКА ВЕСА (40 МБ)
                if (file.size > 40 * 1024 * 1024) {
                    showToast('Файл слишком большой (максимум 40 МБ)', true);
                    mediaInput.value = '';
                    selectedFile = null;
                    return;
                }

                selectedFile = file;
                if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.preload = 'metadata';
                    video.onloadedmetadata = () => {
                        URL.revokeObjectURL(video.src);
                        // 2. ПРОВЕРКА ДЛИНЫ (60 секунд)
                        if (video.duration > 60) {
                            showToast('Видео не должно превышать 60 секунд', true);
                            mediaInput.value = '';
                            previewDiv.innerHTML = '';
                            previewDiv.style.display = 'none';
                            selectedFile = null;
                        } else {
                            previewDiv.innerHTML = `<video controls style="max-width:100%; max-height:120px; border-radius:12px;"><source src="${URL.createObjectURL(file)}"></video><div style="font-size:11px; color:var(--text-muted); margin-top:4px;">✅ Видео ${Math.round(video.duration)} сек.</div>`;
                            previewDiv.style.display = 'block';
                        }
                    };
                    video.src = URL.createObjectURL(file);
                } else if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        previewDiv.innerHTML = `<img src="${e.target.result}" style="max-width:100%; max-height:120px; border-radius:12px;">`;
                        previewDiv.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else { 
                    showToast('Неподдерживаемый формат', true); 
                    mediaInput.value = ''; 
                    selectedFile = null; 
                }
            };
            publishBtn.onclick = async () => {
                if (isPosting) { showToast('Пост уже публикуется, подождите...', true); return; }
                const txt = document.getElementById('postText').value;
                if (!txt.trim()) { showToast('Введите текст', true); return; }
                isPosting = true;
                publishBtn.disabled = true;
                publishBtn.innerHTML = '<span class="spinner-small"></span> Публикация...';
                let imageUrl = null, videoUrl = null;
                if (selectedFile) {
                    const formData = new FormData();
                    let endpoint = '';
                    if (selectedFile.type.startsWith('video/')) {
                        endpoint = '/api/upload-video';
                        formData.append('video', selectedFile);
                    } else if (selectedFile.type.startsWith('image/')) {
                        endpoint = '/api/upload-image';
                        const compressedImg = await compressImage(selectedFile, 1080, 0.75);
                        formData.append('image', compressedImg, selectedFile.name);
                    }
                    if (endpoint) {
                        try {
                            const res = await authFetch(endpoint, { method: 'POST', body: formData });
                            const data = await res.json();
                            if (data.success) {
                                if (selectedFile.type.startsWith('video/')) videoUrl = data.videoUrl;
                                else if (selectedFile.type.startsWith('image/')) imageUrl = data.imageUrl;
                            } else { showToast('Ошибка загрузки медиа', true); isPosting = false; publishBtn.disabled = false; publishBtn.innerHTML = 'Опубликовать'; return; }
                        } catch(err) { showToast('Ошибка загрузки', true); isPosting = false; publishBtn.disabled = false; publishBtn.innerHTML = 'Опубликовать'; return; }
                    }
                }
                progressDiv.style.display = 'block';
                let progress = 0;
                const interval = setInterval(() => { progress += 10; if (progress <= 90) progressBar.style.width = progress + '%'; }, 200);
                try {
                    const data = await fetchJSON('/api/posts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ authorId: currentUser.id, text: txt, image: imageUrl, video: videoUrl }) });
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    
                    if (data.success) {
                        // ИСПРАВЛЕНИЕ: Берем готовый, правильный пост прямо от сервера, а не собираем его вручную
                        const fullPost = data.post;
                        
                        // Добавляем в ленту, только если сокет нас еще не опередил
                        if (!feedPosts.some(p => p.id === fullPost.id)) {
                            feedPosts.unshift(fullPost);
                            isFeedCacheValid = true;
                            
                            if (currentTab === 'feed') {
                                const container = document.getElementById('postsContainer');
                                if (container) {
                                    const newPostHtml = renderSinglePost(fullPost);
                                    container.insertAdjacentHTML('afterbegin', newPostHtml);
                                    const newPostElement = container.firstElementChild;
                                    attachEventsToPostElement(newPostElement);
                                    feedOffset++;
                                }
                            }
                        }
                        
                        closeModal(modalId);
                        showToast('Пост опубликован');
                        
                        // Обновляем UI в зависимости от текущей вкладки
                        if (currentTab === 'profile') {
                            renderProfile(true);
                        } else if (currentTab !== 'feed') {
                            renderFeed();
                        }
                    } else {
                        showToast(data.error || 'Ошибка публикации', true);
                        progressDiv.style.display = 'none';
                    }
                } catch(err) { 
                    clearInterval(interval); 
                    showToast('Ошибка соединения', true); 
                    progressDiv.style.display = 'none'; 
                } finally { 
                    isPosting = false; 
                    publishBtn.disabled = false; 
                    publishBtn.innerHTML = 'Опубликовать'; 
                    setTimeout(() => { progressDiv.style.display = 'none'; progressBar.style.width = '0%'; }, 1000); 
                }
            };
        }

        // ======================= ЧАТ =======================
        async function renderChats(forceRefresh = false) {
            if (!forceRefresh && isChatsCacheValid && cachedChatsHtml) {
                document.getElementById('mainContent').innerHTML = cachedChatsHtml;
                return;
            }
            currentChatPartner = null;
            if (!currentUser) { showToast('Войдите в аккаунт', true); return; }
            await refreshUser();
            document.getElementById('mainContent').innerHTML = `<div class="container"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i></div></div>`;
            const messagesRes = await fetchJSON(`/api/messages/${currentUser.id}`);
            const messages = messagesRes.messages || [];
            const usersFromServer = messagesRes.users || [];
            const contactsMap = new Map();
            const unreadCountsFromServer = currentUser.unreadCounts || {};
            messages.forEach(msg => {
                const contactId = msg.from_user === currentUser.id ? msg.to_user : msg.from_user;
                if (!contactsMap.has(contactId)) {
                    contactsMap.set(contactId, { lastMessage: msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение')), lastTime: msg.created_at });
                } else {
                    const existing = contactsMap.get(contactId);
                    if (new Date(msg.created_at) > new Date(existing.lastTime)) {
                        existing.lastMessage = msg.text || (msg.image ? '📷 Фото' : (msg.voice ? '🎤 Голосовое' : 'Вложение'));
                        existing.lastTime = msg.created_at;
                    }
                }
            });
            const contacts = usersFromServer.map(u => {
                const contactInfo = contactsMap.get(u.id) || { lastMessage: '', lastTime: new Date(0).toISOString() };
                const unread = unreadCountsFromServer[u.id] || 0;
                return { ...u, ...contactInfo, unread };
            }).sort((a,b) => new Date(b.lastTime) - new Date(a.lastTime));
            let html = `<div class="container"><div class="page-title">Сообщения</div><div class="chat-list">`;
            for (const c of contacts) {
                html += `
                    <div class="chat-contact glass-card" data-contact-id="${c.id}" onclick="openChat('${c.id}','${escapeHtml(c.fullName)}')">
                        <img class="chat-contact-avatar" src="${escapeHtml(optimizeMedia(c.avatar, 'avatar'))}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.fullName)}&background=8bca8b&color=fff'">
                        <div class="chat-contact-info">
                            <div class="chat-contact-name">${escapeHtml(c.fullName)}</div>
                            <div class="chat-contact-last">${escapeHtml((c.lastMessage || '').substring(0, 40))}</div>
                        </div>
                        ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
                    </div>
                `;
            }
            if (contacts.length === 0) html += '<div class="empty-state glass-card" style="padding:40px;"><i class="fas fa-comment-slash"></i><div>Нет сообщений. Напишите психологу из раздела «Психологи»!</div></div>';
            html += `</div></div>`;
            cachedChatsHtml = html;
            isChatsCacheValid = true;
            document.getElementById('mainContent').innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        async function openChat(userId, userName) {
            currentChatPartner = { id: userId, name: userName };
            await fetchJSON('/api/messages/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, fromUserId: userId }) });
            
            // ЗАЩИТА: Если пользователь успел уйти из чата во время запроса
            if (!currentChatPartner || currentChatPartner.id !== userId) return;

            if (currentUser.unreadCounts && currentUser.unreadCounts[userId]) delete currentUser.unreadCounts[userId];
            if (currentTab === 'chats') {
                const chatItems = document.querySelectorAll('.chat-contact');
                for (const item of chatItems) {
                    if (item.getAttribute('data-contact-id') === userId) {
                        const badge = item.querySelector('.unread-badge');
                        if (badge) badge.remove();
                        break;
                    }
                }
            }
            document.getElementById('mainContent').innerHTML = `
                <div class="chat-page">
                    <div class="chat-messages-container">
                        <div class="chat-messages-header">
                            <button class="back-btn" onclick="renderChats()"><i class="fas fa-arrow-left"></i></button>
                            <img src="" id="chatPartnerAvatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--green-border);" onerror="this.style.display='none'">
                            <div style="flex:1">
                                <div style="font-weight:600;font-size:15px;">${escapeHtml(userName)}</div>
                            </div>
                        </div>
                        <div class="chat-messages-list" id="chatMessagesList"></div>
                        <div class="chat-input-area">
                            <div class="chat-controls">
                                <button id="attachImageBtn" title="Фото"><i class="fas fa-image"></i></button>
                                <button id="voiceRecordBtn" title="Голосовое"><i class="fas fa-microphone"></i></button>
                            </div>
                            <input type="file" id="imageInput" accept="image/*" style="display:none">
                            <input type="text" id="chatMessageInput" placeholder="Сообщение...">
                            <button class="send-btn-chat" id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            `;
            await new Promise(resolve => setTimeout(resolve, 10));
            
            if (!currentChatPartner || currentChatPartner.id !== userId) return;

            authFetch(`/api/user/${userId}`)
            .then(r => r.json())
            .then(d => {
                const av = document.getElementById('chatPartnerAvatar');
                if (av && d.success) av.src = optimizeMedia(d.user.avatar, 'avatar');
            })
            .catch(console.error);
            
            await loadChatMessages();
            
            if (!currentChatPartner || currentChatPartner.id !== userId) return;

            scrollToBottom();
            const sendBtn = document.getElementById('sendMsgBtn');
            const chatInput = document.getElementById('chatMessageInput');
            const attachBtn = document.getElementById('attachImageBtn');
            const imageInput = document.getElementById('imageInput');
            const voiceBtn = document.getElementById('voiceRecordBtn');
            
            if (sendBtn) sendBtn.onclick = sendChatMessage;
            if (chatInput) chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendChatMessage(); };
            
            if (attachBtn && imageInput) {
                attachBtn.onclick = () => imageInput.click();
                imageInput.onchange = async () => {
                    const file = imageInput.files[0];
                    if (!file || !file.type.startsWith('image/')) { showToast('Только изображения', true); return; }
                    const compressedBlob = await compressImage(file, 1024, 0.8);
                    const formData = new FormData(); formData.append('image', compressedBlob, file.name);
                    const res = await authFetch('/api/upload-chat-image', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        if (!currentChatPartner) return; // ЗАЩИТА
                        await fetchJSON('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', image: data.imageUrl }) });
                        await loadChatMessages();
                        scrollToBottom();
                    }
                    imageInput.value = '';
                };
            }
            if (voiceBtn) {
                let mediaRecorder = null, audioChunks = [], isRecording = false;
                voiceBtn.onclick = async () => {
                    if (!isRecording) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                            audioChunks = [];
                            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                            mediaRecorder.onstop = async () => {
                                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                                const fd = new FormData(); fd.append('voice', blob, 'voice.webm');
                                const res = await authFetch('/api/upload-voice', { method: 'POST', body: fd });
                                const data = await res.json();
                                if (data.success) {
                                    if (!currentChatPartner) return; // ЗАЩИТА
                                    await fetchJSON('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text: '', voice: data.voiceUrl }) });
                                    await loadChatMessages();
                                    scrollToBottom();
                                    showToast('Голосовое отправлено');
                                }
                                stream.getTracks().forEach(t => t.stop());
                                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                                voiceBtn.classList.remove('recording-active');
                                isRecording = false;
                            };
                            mediaRecorder.start();
                            isRecording = true;
                            voiceBtn.classList.add('recording-active');
                            voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
                            setTimeout(() => { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); }, 30000);
                        } catch(e) { showToast('Нет доступа к микрофону', true); }
                    } else { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); }
                };
            }
        }
        
        async function loadChatMessages() {
            if (!currentChatPartner) return;
            const partnerId = currentChatPartner.id; // Запоминаем ID для защиты
            
            const res = await fetchJSON(`/api/messages/${currentUser.id}`);
            
            // ЗАЩИТА: Проверяем, не закрыл ли юзер чат, пока мы ждали ответ от сервера
            if (!currentChatPartner || currentChatPartner.id !== partnerId) return;
            
            const messages = (res.messages || []).filter(m => (m.from_user === partnerId && m.to_user === currentUser.id) || (m.from_user === currentUser.id && m.to_user === partnerId));
            messages.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
            
            const listDiv = document.getElementById('chatMessagesList');
            if (!listDiv) return;
            
            let html = '';
            for (const m of messages) {
                let voiceHtml = '';
                if (m.voice) voiceHtml = `<div class="voice-message"><audio controls src="${escapeHtml(m.voice)}"></audio></div>`;
                const isOutgoing = m.from_user === currentUser.id;
                html += `
                    <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                        ${m.text ? `<div class="message-text">${escapeHtml(m.text)}</div>` : ''}
                        ${m.image ? `<img class="chat-image" src="${escapeHtml(optimizeMedia(m.image, 'image'))}" onclick="openImageModal('${escapeHtml(m.image)}')">` : ''}
                        ${voiceHtml}
                        <div class="message-time">${new Date(m.created_at).toLocaleTimeString()}</div>
                    </div>
                `;
            }
            listDiv.innerHTML = html;
            document.querySelectorAll('.voice-message').forEach(container => {
                const audio = container.querySelector('audio');
                if (audio && !container.querySelector('.speed-btn')) addSpeedButtonToAudio(audio);
            });
            scrollToBottom();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatMessageInput');
            const btn = document.getElementById('sendMsgBtn');
            if (!input || !input.value.trim()) return;
            if (!currentChatPartner) return; // ЗАЩИТА
            
            const text = input.value.trim();
            input.value = '';
            btn.disabled = true;
            
            const tempMsg = { id: Date.now().toString(), from: currentUser.id, to: currentChatPartner.id, text, created_at: new Date().toISOString() };
            appendMessageToChat(tempMsg);
            
            try {
                await fetchJSON('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: currentUser.id, to: currentChatPartner.id, text }) });
                isChatsCacheValid = false;
            } catch(e) {
                showToast('Ошибка отправки', true);
            } finally {
                btn.disabled = false;
            }
            scrollToBottom();
        }
        
        function addSpeedButtonToAudio(audio) {
            const container = audio.closest('.voice-message');
            if (!container || container.querySelector('.speed-btn')) return;
            const speeds = [1, 1.5, 2];
            let currentSpeed = 1;
            const btn = document.createElement('button');
            btn.className = 'speed-btn';
            btn.textContent = `${currentSpeed}x`;
            btn.onclick = (e) => {
                e.stopPropagation();
                let idx = speeds.indexOf(currentSpeed);
                idx = (idx + 1) % speeds.length;
                currentSpeed = speeds[idx];
                audio.playbackRate = currentSpeed;
                btn.textContent = `${currentSpeed}x`;
            };
            container.appendChild(btn);
        }
        
        function updateChatListUnread(contactId, count) {
            const chatItems = document.querySelectorAll('.chat-contact');
            for (const item of chatItems) {
                if (item.getAttribute('data-contact-id') === contactId) {
                    const existingBadge = item.querySelector('.unread-badge');
                    if (count > 0) {
                        if (existingBadge) existingBadge.textContent = count;
                        else item.insertAdjacentHTML('beforeend', `<div class="unread-badge">${count}</div>`);
                    } else {
                        if (existingBadge) existingBadge.remove();
                    }
                    break;
                }
            }
        }
        
        function updateChatListItem(msg, senderName, preview) {
            const contactDiv = document.querySelector(`.chat-contact[data-contact-id="${msg.from}"]`);
            if (!contactDiv) return;
            const lastMsgSpan = contactDiv.querySelector('.chat-contact-last');
            if (lastMsgSpan) lastMsgSpan.textContent = preview.length > 40 ? preview.substring(0,37)+'...' : preview;
            let badge = contactDiv.querySelector('.unread-badge');
            const currentCount = currentUser?.unreadCounts?.[msg.from] || 0;
            if (currentCount > 0) {
                if (badge) badge.textContent = currentCount;
                else contactDiv.insertAdjacentHTML('beforeend', `<div class="unread-badge">${currentCount}</div>`);
            } else {
                if (badge) badge.remove();
            }
            const parent = contactDiv.parentNode;
            parent.insertBefore(contactDiv, parent.firstChild);
        }
        
        
        function appendMessageToChat(msg) {
            const listDiv = document.getElementById('chatMessagesList');
            if (!listDiv) return;
            const fromId = msg.from_user || msg.from;
            const isOutgoing = fromId === currentUser.id;
            let voiceHtml = '';
            if (msg.voice) voiceHtml = `<div class="voice-message"><audio controls src="${escapeHtml(msg.voice)}"></audio></div>`;
            const messageHtml = `
                <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                    ${msg.text ? `<div class="message-text">${escapeHtml(msg.text)}</div>` : ''}
                    ${msg.image ? `<img class="chat-image" src="${escapeHtml(optimizeMedia(msg.image, 'image'))}" onclick="openImageModal('${escapeHtml(msg.image)}')">` : ''}
                    ${voiceHtml}
                    <div class="message-time">${new Date(msg.created_at || msg.createdAt || Date.now()).toLocaleTimeString()}</div>
                </div>
            `;
            listDiv.insertAdjacentHTML('beforeend', messageHtml);
            scrollToBottom();

            const modalId = 'createQuestModal_' + Date.now();
            let questions = [];
            const renderQuestions = () => {
                return questions.map((q, idx) => `
                    <div style="margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">

                                <option value="number" ${q.type === 'number' ? 'selected' : ''}>Число</option>
                                <option value="choice" ${q.type === 'choice' ? 'selected' : ''}>Выбор (через запятую)</option>
                            </select>

                        </div>
                        ${q.type === 'choice' ? `<input type="text" placeholder="Варианты через запятую" value="${escapeHtml(q.options.join(','))}" data-idx="${idx}" class="quest-options_${modalId}" style="width: 100%; margin-top: 5px;">` : ''}
                    </div>
                `).join('');
            };
            const html = `
                <div class="modal" id="${modalId}">
                    <div class="modal-content">
                        <div class="modal-handle"></div>
                        <h3>Создать опросник</h3>
                        <input type="text" id="questTitle_${modalId}" placeholder="Название опросника" style="margin-bottom: 12px;">
                        <textarea id="questDesc_${modalId}" placeholder="Описание (необязательно)" rows="2" style="margin-bottom: 12px;"></textarea>
                        <div id="questionsContainer_${modalId}"></div>
                        <button class="btn-sm" onclick="addQuestion_${modalId}()" style="margin-top: 8px;">+ Добавить вопрос</button>
                        <div class="modal-buttons" style="margin-top: 20px;">
                            <button class="btn-secondary" onclick="closeModal('${modalId}')">Отмена</button>
                            <button class="btn-primary" id="saveQuestBtn" onclick="saveQuestionnaire_${modalId}()">Сохранить</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
            const modal = document.getElementById(modalId);
            setTimeout(() => modal.classList.add('active'), 10);
            
            window[`addQuestion_${modalId}`] = () => {
                questions.push({ text: '', type: 'text', options: [] });
                document.getElementById(`questionsContainer_${modalId}`).innerHTML = renderQuestions();
                attachQuestionEvents();
            };
            window[`removeQuestion_${modalId}`] = (idx) => {
                questions.splice(idx, 1);
                document.getElementById(`questionsContainer_${modalId}`).innerHTML = renderQuestions();
                attachQuestionEvents();
            };
            function attachQuestionEvents() {
                document.querySelectorAll(`.quest-type_${modalId}`).forEach(select => {
                    select.onchange = (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        questions[idx].type = e.target.value;
                        document.getElementById(`questionsContainer_${modalId}`).innerHTML = renderQuestions();
                        attachQuestionEvents();
                    };
                });
                document.querySelectorAll(`.quest-text_${modalId}`).forEach(input => {
                    input.oninput = (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        questions[idx].text = e.target.value;
                    };
                });
                document.querySelectorAll(`.quest-options_${modalId}`).forEach(input => {
                    input.oninput = (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        questions[idx].options = e.target.value.split(',').map(s => s.trim()).filter(s => s);
                    };
                });
            }
            window[`saveQuestionnaire_${modalId}`] = async () => {
                const btn = document.getElementById('saveQuestBtn');
                btn.disabled = true;
                
                const title = document.getElementById(`questTitle_${modalId}`).value.trim();
                if (!title) { showToast('Введите название опросника', true); btn.disabled = false; return; }
                const description = document.getElementById(`questDesc_${modalId}`).value;
                const qs = [];
                for (let i = 0; i < questions.length; i++) {
                    const text = questions[i].text;
                    if (!text) continue;
                    qs.push({
                        text: text,
                        type: questions[i].type,
                        options: questions[i].type === 'choice' ? questions[i].options : []
                    });
                }
                if (qs.length === 0) { showToast('Добавьте хотя бы один вопрос', true); btn.disabled = false; return; }
                const data = await fetchJSON('/api/questionnaires', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ psychologistId: currentUser.id, title, description, questions: qs })
                });
                if (data.success) {
                    showToast('Опросник создан');
                    closeModal(modalId);
                    renderProfile(true);
                } else {
                    showToast('Ошибка при создании', true);
                    btn.disabled = false;
                }
            };
            attachQuestionEvents();
            document.getElementById(`questionsContainer_${modalId}`).innerHTML = renderQuestions();
        }
